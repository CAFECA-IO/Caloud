<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="title desc">
<title id="title">App 部署與流量轉發</title>
<desc id="desc">上傳的 compose 檔先經安全檢查，再加上 Caloud 的 override 後以 docker compose 啟動；部署完成後路由表即時更新，訪客的請求依 Host 轉發到容器。</desc>
<style>
  .bg{fill:#ffffff}
  .t{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#111827}
  .m{fill:#4b5563} .s{font-size:12px} .b{font-weight:600} .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#cfd4dc;stroke-width:1.25}
  .soft{fill:#f6f7f9;stroke:#e4e7ec;stroke-width:1.25}
  .grp{fill:none;stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:5 4}
  .acc{fill:#eef3ff;stroke:#1d4ed8;stroke-width:1.5}
  .acct{fill:#1d4ed8} .ok{fill:#15803d} .okbg{fill:#ecfdf3;stroke:#15803d;stroke-width:1.25}
  .warnbg{fill:#fef6e7;stroke:#a15c07;stroke-width:1.25} .warn{fill:#a15c07}
  .dark{fill:#0f172a} .darkt{fill:#ffffff}
  .ln{stroke:#5f6774;stroke-width:1.5;fill:none} .lna{stroke:#1d4ed8;stroke-width:1.75;fill:none}
  .life{stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:4 4}
  .dot{fill:#1d4ed8} .num{fill:#ffffff;font-weight:600;font-size:12px}
  .ah{fill:#5f6774} .aha{fill:#1d4ed8}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b0f17} .t{fill:#e6e9ef} .m{fill:#a3acb9}
    .box{fill:#111722;stroke:#334052} .soft{fill:#18202d;stroke:#222b38} .grp{stroke:#334052}
    .acc{fill:#14223d;stroke:#6ea2ff} .acct{fill:#6ea2ff} .ok{fill:#4ade80} .okbg{fill:#0f2a1b;stroke:#4ade80}
    .warnbg{fill:#2b2210;stroke:#fbbf24} .warn{fill:#fbbf24}
    .dark{fill:#070b12} .ln{stroke:#8c95a3} .lna{stroke:#6ea2ff} .life{stroke:#334052}
    .dot{fill:#6ea2ff} .num{fill:#08101f} .ah{fill:#8c95a3} .aha{fill:#6ea2ff}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="980" height="470" rx="12"/>
<text class="t b" x="24" y="38" font-size="18" text-anchor="start">App 部署與流量轉發</text>
<text class="t b m" x="24" y="70" font-size="13" text-anchor="start">部署</text>
<rect class="box" x="24" y="84" width="172" height="92" rx="8"/>
<circle class="dot" cx="46" cy="108" r="11"/>
<text class="t num" x="46" y="112" text-anchor="middle">1</text>
<text class="t b" x="64" y="113" font-size="13" text-anchor="start">上傳 compose</text>
<text class="t m s" x="40" y="140" font-size="12" text-anchor="start">網頁、REST 或 MCP</text>
<text class="t m s" x="40" y="159" font-size="12" text-anchor="start">status：stopped</text>
<path class="ln" d="M196 130 L214 130" marker-end="url(#a)"/>
<rect class="box" x="214" y="84" width="172" height="92" rx="8"/>
<circle class="dot" cx="236" cy="108" r="11"/>
<text class="t num" x="236" y="112" text-anchor="middle">2</text>
<text class="t b" x="254" y="113" font-size="13" text-anchor="start">安全檢查</text>
<text class="t m s" x="230" y="140" font-size="12" text-anchor="start">禁止 ports、privileged、</text>
<text class="t m s" x="230" y="159" font-size="12" text-anchor="start">主機路徑、build…</text>
<path class="ln" d="M386 130 L404 130" marker-end="url(#a)"/>
<rect class="box" x="404" y="84" width="172" height="92" rx="8"/>
<circle class="dot" cx="426" cy="108" r="11"/>
<text class="t num" x="426" y="112" text-anchor="middle">3</text>
<text class="t b" x="444" y="113" font-size="13" text-anchor="start">產生 override</text>
<text class="t m s" x="420" y="140" font-size="12" text-anchor="start">加入 caloud-edge 網路</text>
<text class="t m s" x="420" y="159" font-size="12" text-anchor="start">alias、資源上限</text>
<path class="ln" d="M576 130 L594 130" marker-end="url(#a)"/>
<rect class="box" x="594" y="84" width="172" height="92" rx="8"/>
<circle class="dot" cx="616" cy="108" r="11"/>
<text class="t num" x="616" y="112" text-anchor="middle">4</text>
<text class="t b" x="634" y="113" font-size="13" text-anchor="start">docker compose up</text>
<text class="t m s mono" x="610" y="140" font-size="12" text-anchor="start">-d --wait</text>
<text class="t m s mono" x="610" y="159" font-size="12" text-anchor="start">status：deploying</text>
<path class="ln" d="M766 130 L784 130" marker-end="url(#a)"/>
<rect class="okbg" x="784" y="84" width="172" height="92" rx="8"/>
<circle class="dot" cx="806" cy="108" r="11"/>
<text class="t num" x="806" y="112" text-anchor="middle">5</text>
<text class="t b" x="824" y="113" font-size="13" text-anchor="start">更新狀態與路由</text>
<text class="t m s" x="800" y="140" font-size="12" text-anchor="start">running／failed</text>
<text class="t m s" x="800" y="159" font-size="12" text-anchor="start">路由表即時重載</text>
<rect class="warnbg" x="180" y="190" width="240" height="34" rx="6"/>
<text class="t s warn" x="300" y="212" font-size="11" text-anchor="middle">不合規 → 400，指出 service 與欄位</text>
<path class="ln" d="M300 176 L300 190" marker-end="url(#a)"/>
<text class="t b m" x="24" y="262" font-size="13" text-anchor="start">轉發</text>
<rect class="box" x="24" y="276" width="160" height="64" rx="8"/>
<text class="t b" x="40" y="303" font-size="13" text-anchor="start">訪客</text>
<text class="t m s mono" x="40" y="324" font-size="11" text-anchor="start">blog.example.com</text>
<rect class="acc" x="232" y="276" width="300" height="64" rx="8"/>
<text class="t b acct" x="248" y="303" font-size="13" text-anchor="start">Caloud 反向代理</text>
<text class="t m s mono" x="248" y="324" font-size="11" text-anchor="start">Host → http://caloud-&lt;id&gt;-web:80</text>
<rect class="soft" x="580" y="264" width="376" height="160" rx="10"/>
<text class="t m s" x="596" y="288" font-size="12" text-anchor="start">caloud-edge 網路（不對主機開 port）</text>
<rect class="box" x="596" y="300" width="160" height="56" rx="8"/>
<text class="t b mono" x="612" y="324" font-size="13" text-anchor="start">web</text>
<text class="t m s mono" x="612" y="344" font-size="10" text-anchor="start">alias：caloud-&lt;id&gt;-web</text>
<rect class="box" x="780" y="300" width="160" height="56" rx="8"/>
<text class="t b mono" x="796" y="324" font-size="13" text-anchor="start">db</text>
<text class="t m s" x="796" y="344" font-size="11" text-anchor="start">只在 App 內部網路</text>
<path class="lna" d="M184 308 L232 308" marker-end="url(#aa)"/>
<path class="lna" d="M532 308 L596 328" marker-end="url(#aa)"/>
<path class="ln" d="M756 328 L780 328" marker-end="url(#a)"/>
<rect class="soft" x="24" y="372" width="508" height="74" rx="8"/>
<text class="t m s" x="40" y="396" font-size="12" text-anchor="start">找不到路由：404「此網域尚未綁定運作中的 App」</text>
<text class="t m s" x="40" y="416" font-size="12" text-anchor="start">容器沒有回應：502「App 沒有回應，請稍後再試」</text>
<text class="t m s" x="40" y="436" font-size="12" text-anchor="start">只有「已驗證＋已綁定＋App 運作中」的網域會進入路由表</text>
</svg>
