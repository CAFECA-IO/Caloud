<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="title desc">
<title id="title">Sign in with CAFECA 登入流程</title>
<desc id="desc">瀏覽器向 Caloud 取得一次性 nonce，CAFECA 錢包以 Passkey 簽署綁定網域的 EIP-712 訊息，Caloud 以公開 RPC 呼叫身分合約 isValidSignature 驗證後建立 session；第一位登入者成為 Super Admin。</desc>
<style>
  .bg{fill:#ffffff}
  .t{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#111827}
  .m{fill:#4b5563} .s{font-size:12px} .b{font-weight:600} .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#cfd4dc;stroke-width:1.25}
  .soft{fill:#f6f7f9;stroke:#e4e7ec;stroke-width:1.25}
  .grp{fill:none;stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:5 4}
  .acc{fill:#eef3ff;stroke:#1d4ed8;stroke-width:1.5}
  .acct{fill:#1d4ed8} .ok{fill:#15803d} .okbg{fill:#ecfdf3;stroke:#15803d;stroke-width:1.25}
  .warnbg{fill:#fef6e7;stroke:#a15c07;stroke-width:1.25} .warn{fill:#a15c07}
  .dark{fill:#0f172a} .darkt{fill:#ffffff}
  .ln{stroke:#5f6774;stroke-width:1.5;fill:none} .lna{stroke:#1d4ed8;stroke-width:1.75;fill:none}
  .life{stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:4 4}
  .dot{fill:#1d4ed8} .num{fill:#ffffff;font-weight:600;font-size:12px}
  .ah{fill:#5f6774} .aha{fill:#1d4ed8}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b0f17} .t{fill:#e6e9ef} .m{fill:#a3acb9}
    .box{fill:#111722;stroke:#334052} .soft{fill:#18202d;stroke:#222b38} .grp{stroke:#334052}
    .acc{fill:#14223d;stroke:#6ea2ff} .acct{fill:#6ea2ff} .ok{fill:#4ade80} .okbg{fill:#0f2a1b;stroke:#4ade80}
    .warnbg{fill:#2b2210;stroke:#fbbf24} .warn{fill:#fbbf24}
    .dark{fill:#070b12} .ln{stroke:#8c95a3} .lna{stroke:#6ea2ff} .life{stroke:#334052}
    .dot{fill:#6ea2ff} .num{fill:#08101f} .ah{fill:#8c95a3} .aha{fill:#6ea2ff}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="980" height="600" rx="12"/>
<text class="t b" x="24" y="38" font-size="18" text-anchor="start">Sign in with CAFECA 登入流程</text>
<rect class="box" x="60" y="60" width="140" height="52" rx="8"/>
<text class="t b" x="130" y="83" font-size="14" text-anchor="middle">瀏覽器</text>
<text class="t m s" x="130" y="102" font-size="12" text-anchor="middle">管理者</text>
<line class="life" x1="130" y1="112" x2="130" y2="540"/>
<rect class="acc" x="320" y="60" width="140" height="52" rx="8"/>
<text class="t b acct" x="390" y="83" font-size="14" text-anchor="middle">Caloud</text>
<text class="t m s" x="390" y="102" font-size="12" text-anchor="middle">後端</text>
<line class="life" x1="390" y1="112" x2="390" y2="540"/>
<rect class="box" x="580" y="60" width="140" height="52" rx="8"/>
<text class="t b" x="650" y="83" font-size="14" text-anchor="middle">CAFECA 錢包</text>
<text class="t m s" x="650" y="102" font-size="12" text-anchor="middle">Passkey</text>
<line class="life" x1="650" y1="112" x2="650" y2="540"/>
<rect class="box" x="810" y="60" width="140" height="52" rx="8"/>
<text class="t b" x="880" y="83" font-size="14" text-anchor="middle">公開 RPC</text>
<text class="t m s" x="880" y="102" font-size="12" text-anchor="middle">身分合約</text>
<line class="life" x1="880" y1="112" x2="880" y2="540"/>
<path class="lna" d="M130 150 L384 150" marker-end="url(#aa)"/>
<text class="t s" x="260.0" y="142" font-size="12" text-anchor="middle">POST /api/auth/nonce</text>
<circle class="dot" cx="177" cy="138" r="11"/>
<text class="t num" x="177" y="142" text-anchor="middle">1</text>
<path class="ln" d="M390 188 L136 188" marker-end="url(#a)"/>
<text class="t s" x="260.0" y="180" font-size="12" text-anchor="middle">nonce（128 bit，5 分鐘，只能用一次）</text>
<circle class="dot" cx="131" cy="176" r="11"/>
<text class="t num" x="131" y="180" text-anchor="middle">2</text>
<path class="lna" d="M130 226 L644 226" marker-end="url(#aa)"/>
<text class="t s" x="390.0" y="218" font-size="12" text-anchor="middle">signIn：網域、nonce、有效期</text>
<circle class="dot" cx="289" cy="214" r="11"/>
<text class="t num" x="289" y="218" text-anchor="middle">3</text>
<rect class="soft" x="507" y="246" width="287" height="30" rx="6"/>
<circle class="dot" cx="491" cy="261" r="11"/>
<text class="t num" x="491" y="265" text-anchor="middle">4</text>
<text class="t s" x="518.72" y="266" font-size="12" text-anchor="start">使用者以指紋／Passkey 簽署 EIP-712 SignIn</text>
<path class="ln" d="M650 302 L136 302" marker-end="url(#a)"/>
<text class="t s" x="390.0" y="294" font-size="12" text-anchor="middle">account（身分合約）＋ signature</text>
<circle class="dot" cx="275" cy="290" r="11"/>
<text class="t num" x="275" y="294" text-anchor="middle">5</text>
<path class="lna" d="M130 340 L384 340" marker-end="url(#aa)"/>
<text class="t s" x="260.0" y="332" font-size="12" text-anchor="middle">POST /api/auth/login（原封不動轉交）</text>
<circle class="dot" cx="129" cy="328" r="11"/>
<text class="t num" x="129" y="332" text-anchor="middle">6</text>
<rect class="soft" x="404" y="360" width="369" height="30" rx="6"/>
<circle class="dot" cx="388" cy="375" r="11"/>
<text class="t num" x="388" y="379" text-anchor="middle">7</text>
<text class="t s" x="416" y="380" font-size="12" text-anchor="start">作廢 nonce；檢查網域、chainId、有效期；計算 SignIn 雜湊</text>
<path class="lna" d="M390 416 L874 416" marker-end="url(#aa)"/>
<text class="t s" x="635.0" y="408" font-size="12" text-anchor="middle">eth_call isValidSignature(hash, sig)</text>
<circle class="dot" cx="498" cy="404" r="11"/>
<text class="t num" x="498" y="408" text-anchor="middle">8</text>
<path class="ln" d="M880 454 L396 454" marker-end="url(#a)"/>
<text class="t s" x="635.0" y="446" font-size="12" text-anchor="middle">0x1626ba7e（簽章有效）</text>
<circle class="dot" cx="549" cy="442" r="11"/>
<text class="t num" x="549" y="446" text-anchor="middle">9</text>
<path class="ln" d="M390 492 L136 492" marker-end="url(#a)"/>
<text class="t s" x="260.0" y="484" font-size="12" text-anchor="middle">session cookie（HttpOnly、SameSite=Strict）</text>
<circle class="dot" cx="102" cy="480" r="11"/>
<text class="t num" x="102" y="484" text-anchor="middle">10</text>
<rect class="okbg" x="260" y="514" width="460" height="44" rx="8"/>
<text class="t s ok" x="490" y="534" font-size="12" text-anchor="middle">建立或更新使用者：資料庫中沒有任何使用者時，此人成為 Super Admin</text>
<text class="t s m" x="490" y="551" font-size="12" text-anchor="middle">其餘新使用者預設為「待核准」</text>
</svg>
