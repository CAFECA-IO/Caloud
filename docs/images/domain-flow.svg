<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-labelledby="title desc">
<title id="title">網域設定四步驟</title>
<desc id="desc">新增網域、在 DNS 服務商設定 A 與 TXT 紀錄、由 Caloud 查詢 TXT 驗證擁有權，最後綁定 App 的 service 與 port，網域即開始轉發。</desc>
<style>
  .bg{fill:#ffffff}
  .t{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#111827}
  .m{fill:#4b5563} .s{font-size:12px} .b{font-weight:600} .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#cfd4dc;stroke-width:1.25}
  .soft{fill:#f6f7f9;stroke:#e4e7ec;stroke-width:1.25}
  .grp{fill:none;stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:5 4}
  .acc{fill:#eef3ff;stroke:#1d4ed8;stroke-width:1.5}
  .acct{fill:#1d4ed8} .ok{fill:#15803d} .okbg{fill:#ecfdf3;stroke:#15803d;stroke-width:1.25}
  .warnbg{fill:#fef6e7;stroke:#a15c07;stroke-width:1.25} .warn{fill:#a15c07}
  .dark{fill:#0f172a} .darkt{fill:#ffffff}
  .ln{stroke:#5f6774;stroke-width:1.5;fill:none} .lna{stroke:#1d4ed8;stroke-width:1.75;fill:none}
  .life{stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:4 4}
  .dot{fill:#1d4ed8} .num{fill:#ffffff;font-weight:600;font-size:12px}
  .ah{fill:#5f6774} .aha{fill:#1d4ed8}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b0f17} .t{fill:#e6e9ef} .m{fill:#a3acb9}
    .box{fill:#111722;stroke:#334052} .soft{fill:#18202d;stroke:#222b38} .grp{stroke:#334052}
    .acc{fill:#14223d;stroke:#6ea2ff} .acct{fill:#6ea2ff} .ok{fill:#4ade80} .okbg{fill:#0f2a1b;stroke:#4ade80}
    .warnbg{fill:#2b2210;stroke:#fbbf24} .warn{fill:#fbbf24}
    .dark{fill:#070b12} .ln{stroke:#8c95a3} .lna{stroke:#6ea2ff} .life{stroke:#334052}
    .dot{fill:#6ea2ff} .num{fill:#08101f} .ah{fill:#8c95a3} .aha{fill:#6ea2ff}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="980" height="330" rx="12"/>
<text class="t b" x="24" y="38" font-size="18" text-anchor="start">網域設定四步驟</text>
<rect class="box" x="24" y="64" width="222" height="196" rx="8"/>
<circle class="dot" cx="48" cy="92" r="11"/>
<text class="t num" x="48" y="96" text-anchor="middle">1</text>
<text class="t b" x="68" y="97" font-size="14" text-anchor="start">新增網域</text>
<text class="t m s" x="42" y="132" font-size="12" text-anchor="start">輸入主機名稱</text>
<text class="t m s" x="42" y="154" font-size="12" text-anchor="start">blog.example.com</text>
<text class="t m s" x="42" y="176" font-size="12" text-anchor="start">自動轉小寫、檢查格式</text>
<line class="life" x1="40" y1="222" x2="230" y2="222"/>
<text class="t s" x="42" y="244" font-size="12" text-anchor="start">Caloud 產生驗證值</text>
<path class="lna" d="M246 162 L266 162" marker-end="url(#aa)"/>
<rect class="box" x="266" y="64" width="222" height="196" rx="8"/>
<circle class="dot" cx="290" cy="92" r="11"/>
<text class="t num" x="290" y="96" text-anchor="middle">2</text>
<text class="t b" x="310" y="97" font-size="14" text-anchor="start">設定 DNS</text>
<text class="t m s mono" x="284" y="132" font-size="12" text-anchor="start">A  blog.example.com</text>
<text class="t m s mono" x="284" y="154" font-size="12" text-anchor="start">   → Caloud 主機 IP</text>
<text class="t m s mono" x="284" y="176" font-size="12" text-anchor="start">TXT _caloud-challenge.…</text>
<text class="t m s mono" x="284" y="198" font-size="12" text-anchor="start">   = caloud-4f1d…</text>
<line class="life" x1="282" y1="222" x2="472" y2="222"/>
<text class="t s" x="284" y="244" font-size="12" text-anchor="start">在你的 DNS 服務商操作</text>
<path class="lna" d="M488 162 L508 162" marker-end="url(#aa)"/>
<rect class="box" x="508" y="64" width="222" height="196" rx="8"/>
<circle class="dot" cx="532" cy="92" r="11"/>
<text class="t num" x="532" y="96" text-anchor="middle">3</text>
<text class="t b" x="552" y="97" font-size="14" text-anchor="start">驗證擁有權</text>
<text class="t m s" x="526" y="132" font-size="12" text-anchor="start">Caloud 以 DNS-over-HTTPS</text>
<text class="t m s" x="526" y="154" font-size="12" text-anchor="start">查詢 TXT 紀錄</text>
<text class="t m s" x="526" y="176" font-size="12" text-anchor="start">相符才標記「已驗證」</text>
<line class="life" x1="524" y1="222" x2="714" y2="222"/>
<text class="t s" x="526" y="244" font-size="12" text-anchor="start">DNS 生效可能需數分鐘</text>
<path class="lna" d="M730 162 L750 162" marker-end="url(#aa)"/>
<rect class="okbg" x="750" y="64" width="222" height="196" rx="8"/>
<circle class="dot" cx="774" cy="92" r="11"/>
<text class="t num" x="774" y="96" text-anchor="middle">4</text>
<text class="t b" x="794" y="97" font-size="14" text-anchor="start">綁定 App</text>
<text class="t m s" x="768" y="132" font-size="12" text-anchor="start">選擇 App 與 service</text>
<text class="t m s" x="768" y="154" font-size="12" text-anchor="start">填入容器內 port</text>
<text class="t m s" x="768" y="176" font-size="12" text-anchor="start">例：web : 80</text>
<line class="life" x1="766" y1="222" x2="956" y2="222"/>
<text class="t s" x="768" y="244" font-size="12" text-anchor="start">立即生效，不需重啟</text>
<rect class="soft" x="24" y="276" width="932" height="36" rx="8"/>
<text class="t s m" x="40" y="299" font-size="12" text-anchor="start">網頁的「新增網域」精靈與 MCP 工具 create_domain → verify_domain → bind_domain 都依這個順序；DNS 紀錄提供一鍵複製。</text>
</svg>
