<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="title desc">
<title id="title">MCP 介面運作方式</title>
<desc id="desc">使用者在網頁以 CAFECA 登入後建立個人 API 權杖，設定到 Claude 等 MCP 用戶端；AI 助手以 Bearer 權杖呼叫 POST /mcp，Caloud 依使用者目前角色驗證並經由共用服務層執行工具，所有操作寫入稽核。</desc>
<style>
  .bg{fill:#ffffff}
  .t{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#111827}
  .m{fill:#4b5563} .s{font-size:12px} .b{font-weight:600} .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#cfd4dc;stroke-width:1.25}
  .soft{fill:#f6f7f9;stroke:#e4e7ec;stroke-width:1.25}
  .grp{fill:none;stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:5 4}
  .acc{fill:#eef3ff;stroke:#1d4ed8;stroke-width:1.5}
  .acct{fill:#1d4ed8} .ok{fill:#15803d} .okbg{fill:#ecfdf3;stroke:#15803d;stroke-width:1.25}
  .warnbg{fill:#fef6e7;stroke:#a15c07;stroke-width:1.25} .warn{fill:#a15c07}
  .dark{fill:#0f172a} .darkt{fill:#ffffff}
  .ln{stroke:#5f6774;stroke-width:1.5;fill:none} .lna{stroke:#1d4ed8;stroke-width:1.75;fill:none}
  .life{stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:4 4}
  .dot{fill:#1d4ed8} .num{fill:#ffffff;font-weight:600;font-size:12px}
  .ah{fill:#5f6774} .aha{fill:#1d4ed8}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b0f17} .t{fill:#e6e9ef} .m{fill:#a3acb9}
    .box{fill:#111722;stroke:#334052} .soft{fill:#18202d;stroke:#222b38} .grp{stroke:#334052}
    .acc{fill:#14223d;stroke:#6ea2ff} .acct{fill:#6ea2ff} .ok{fill:#4ade80} .okbg{fill:#0f2a1b;stroke:#4ade80}
    .warnbg{fill:#2b2210;stroke:#fbbf24} .warn{fill:#fbbf24}
    .dark{fill:#070b12} .ln{stroke:#8c95a3} .lna{stroke:#6ea2ff} .life{stroke:#334052}
    .dot{fill:#6ea2ff} .num{fill:#08101f} .ah{fill:#8c95a3} .aha{fill:#6ea2ff}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="980" height="420" rx="12"/>
<text class="t b" x="24" y="38" font-size="18" text-anchor="start">MCP 介面運作方式</text>
<rect class="box" x="24" y="64" width="260" height="120" rx="8"/>
<circle class="dot" cx="48" cy="92" r="11"/>
<text class="t num" x="48" y="96" text-anchor="middle">1</text>
<text class="t b" x="68" y="97" font-size="14" text-anchor="start">建立 API 權杖</text>
<text class="t m s" x="40" y="126" font-size="12" text-anchor="start">網頁 →「API 權杖」→ 建立</text>
<text class="t m s" x="40" y="146" font-size="12" text-anchor="start">cld_…  只顯示一次</text>
<text class="t m s" x="40" y="166" font-size="12" text-anchor="start">預設 90 天到期、可隨時撤銷</text>
<rect class="box" x="24" y="208" width="260" height="120" rx="8"/>
<circle class="dot" cx="48" cy="236" r="11"/>
<text class="t num" x="48" y="240" text-anchor="middle">2</text>
<text class="t b" x="68" y="241" font-size="14" text-anchor="start">設定 MCP 用戶端</text>
<text class="t m s mono" x="40" y="270" font-size="11" text-anchor="start">claude mcp add --transport http</text>
<text class="t m s mono" x="40" y="288" font-size="11" text-anchor="start">  caloud https://…/mcp</text>
<text class="t m s mono" x="40" y="306" font-size="11" text-anchor="start">  --header "Authorization: Bearer cld_…"</text>
<path class="ln" d="M154 184 L154 208" marker-end="url(#a)"/>
<rect class="box" x="332" y="136" width="200" height="120" rx="8"/>
<circle class="dot" cx="356" cy="164" r="11"/>
<text class="t num" x="356" y="168" text-anchor="middle">3</text>
<text class="t b" x="376" y="169" font-size="14" text-anchor="start">AI 助手</text>
<text class="t m s" x="348" y="198" font-size="12" text-anchor="start">「部署這份 compose 並</text>
<text class="t m s" x="348" y="218" font-size="12" text-anchor="start">綁定 blog.example.com」</text>
<text class="t m s" x="348" y="238" font-size="12" text-anchor="start">→ POST /mcp（Bearer）</text>
<path class="ln" d="M284 268 L308 268 L308 196 L332 196" marker-end="url(#a)"/>
<rect class="acc" x="580" y="64" width="376" height="264" rx="12"/>
<text class="t b acct" x="600" y="92" font-size="15" text-anchor="start">Caloud</text>
<path class="lna" d="M532 196 L556 196 L556 136 L600 136" marker-end="url(#aa)"/>
<rect class="box" x="600" y="112" width="336" height="48" rx="8"/>
<text class="t b" x="616" y="133" font-size="13" text-anchor="start">驗證權杖與來源</text>
<text class="t m s" x="616" y="151" font-size="11" text-anchor="start">Bearer 雜湊比對 · 拒絕 cookie · 檢查 Origin</text>
<rect class="box" x="600" y="172" width="336" height="48" rx="8"/>
<text class="t b" x="616" y="193" font-size="13" text-anchor="start">依目前角色授權</text>
<text class="t m s" x="616" y="211" font-size="11" text-anchor="start">pending／disabled 立即失效 · Admin 才有使用者工具</text>
<rect class="box" x="600" y="232" width="336" height="48" rx="8"/>
<text class="t b" x="616" y="253" font-size="13" text-anchor="start">共用服務層執行</text>
<text class="t m s" x="616" y="271" font-size="11" text-anchor="start">與網頁相同的權限、compose 政策與錯誤訊息</text>
<path class="ln" d="M768 160 L768 172" marker-end="url(#a)"/>
<path class="ln" d="M768 220 L768 232" marker-end="url(#a)"/>
<rect class="okbg" x="600" y="288" width="336" height="28" rx="6"/>
<text class="t s ok" x="616" y="307" font-size="11" text-anchor="start">稽核標示 via=mcp:&lt;權杖名稱&gt;；刪除需 confirm: true</text>
<rect class="soft" x="24" y="348" width="932" height="56" rx="8"/>
<text class="t s m mono" x="40" y="371" font-size="11" text-anchor="start">工具：whoami · list_apps · get_app · create_app · update_app · deploy_app · stop_app · delete_app · get_app_logs</text>
<text class="t s m mono" x="82" y="391" font-size="11" text-anchor="start">list_domains · create_domain · verify_domain · bind_domain · delete_domain · Admin：list_users · set_user_role</text>
</svg>
