<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" role="img" aria-labelledby="title desc">
<title id="title">Caloud 系統架構</title>
<desc id="desc">管理者、AI 助手與網站訪客經由 Caloud 單一執行檔的 Web 介面、MCP 端點與反向代理，操作 Docker 中的 App 容器；登入由 CAFECA 錢包簽署並以公開 RPC 驗證。</desc>
<style>
  .bg{fill:#ffffff}
  .t{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;fill:#111827}
  .m{fill:#4b5563} .s{font-size:12px} .b{font-weight:600} .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#cfd4dc;stroke-width:1.25}
  .soft{fill:#f6f7f9;stroke:#e4e7ec;stroke-width:1.25}
  .grp{fill:none;stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:5 4}
  .acc{fill:#eef3ff;stroke:#1d4ed8;stroke-width:1.5}
  .acct{fill:#1d4ed8} .ok{fill:#15803d} .okbg{fill:#ecfdf3;stroke:#15803d;stroke-width:1.25}
  .warnbg{fill:#fef6e7;stroke:#a15c07;stroke-width:1.25} .warn{fill:#a15c07}
  .dark{fill:#0f172a} .darkt{fill:#ffffff}
  .ln{stroke:#5f6774;stroke-width:1.5;fill:none} .lna{stroke:#1d4ed8;stroke-width:1.75;fill:none}
  .life{stroke:#cfd4dc;stroke-width:1.25;stroke-dasharray:4 4}
  .dot{fill:#1d4ed8} .num{fill:#ffffff;font-weight:600;font-size:12px}
  .ah{fill:#5f6774} .aha{fill:#1d4ed8}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0b0f17} .t{fill:#e6e9ef} .m{fill:#a3acb9}
    .box{fill:#111722;stroke:#334052} .soft{fill:#18202d;stroke:#222b38} .grp{stroke:#334052}
    .acc{fill:#14223d;stroke:#6ea2ff} .acct{fill:#6ea2ff} .ok{fill:#4ade80} .okbg{fill:#0f2a1b;stroke:#4ade80}
    .warnbg{fill:#2b2210;stroke:#fbbf24} .warn{fill:#fbbf24}
    .dark{fill:#070b12} .ln{stroke:#8c95a3} .lna{stroke:#6ea2ff} .life{stroke:#334052}
    .dot{fill:#6ea2ff} .num{fill:#08101f} .ah{fill:#8c95a3} .aha{fill:#6ea2ff}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" width="980" height="530" rx="12"/>
<text class="t b" x="24" y="38" font-size="18" text-anchor="start">Caloud 系統架構</text>
<rect class="box" x="24" y="92" width="168" height="64" rx="8"/>
<text class="t b" x="40" y="119" font-size="14" text-anchor="start">管理者瀏覽器</text>
<text class="t m s" x="40" y="140" font-size="12" text-anchor="start">Web 介面、CAFECA 登入</text>
<rect class="box" x="24" y="232" width="168" height="64" rx="8"/>
<text class="t b" x="40" y="259" font-size="14" text-anchor="start">AI 助手</text>
<text class="t m s" x="40" y="280" font-size="12" text-anchor="start">MCP 用戶端（Claude 等）</text>
<rect class="box" x="24" y="360" width="168" height="64" rx="8"/>
<text class="t b" x="40" y="387" font-size="14" text-anchor="start">網站訪客</text>
<text class="t m s" x="40" y="408" font-size="12" text-anchor="start">app.example.com</text>
<rect class="acc" x="244" y="64" width="404" height="380" rx="12"/>
<text class="t b acct" x="264" y="92" font-size="15" text-anchor="start">Caloud（單一執行檔）</text>
<rect class="box" x="264" y="108" width="176" height="60" rx="8"/>
<text class="t b" x="280" y="133" font-size="13" text-anchor="start">Web 介面＋REST API</text>
<text class="t m s mono" x="280" y="154" font-size="11" text-anchor="start">:8080 · cookie</text>
<rect class="box" x="264" y="184" width="176" height="60" rx="8"/>
<text class="t b" x="280" y="209" font-size="13" text-anchor="start">MCP 端點</text>
<text class="t m s mono" x="280" y="230" font-size="11" text-anchor="start">POST /mcp · Bearer</text>
<rect class="box" x="452" y="108" width="176" height="136" rx="8"/>
<text class="t b" x="468" y="133" font-size="13" text-anchor="start">服務層</text>
<text class="t m s" x="468" y="156" font-size="12" text-anchor="start">權限檢查</text>
<text class="t m s" x="468" y="175" font-size="12" text-anchor="start">compose 安全政策</text>
<text class="t m s" x="468" y="194" font-size="12" text-anchor="start">網域驗證</text>
<text class="t m s" x="468" y="213" font-size="12" text-anchor="start">稽核紀錄</text>
<path class="ln" d="M440 138 L452 138" marker-end="url(#a)"/>
<path class="ln" d="M440 214 L452 214" marker-end="url(#a)"/>
<rect class="box" x="264" y="268" width="176" height="60" rx="8"/>
<text class="t b" x="280" y="293" font-size="13" text-anchor="start">SQLite</text>
<text class="t m s" x="280" y="314" font-size="12" text-anchor="start">使用者 · App · 網域 · 權杖</text>
<rect class="box" x="452" y="268" width="176" height="60" rx="8"/>
<text class="t b" x="468" y="293" font-size="13" text-anchor="start">Compose 執行器</text>
<text class="t m s mono" x="468" y="314" font-size="11" text-anchor="start">docker compose CLI</text>
<path class="ln" d="M480 244 L480 256 L352 256 L352 268" marker-end="url(#a)"/>
<path class="ln" d="M560 244 L560 268" marker-end="url(#a)"/>
<rect class="box" x="264" y="352" width="364" height="72" rx="8"/>
<text class="t b" x="280" y="378" font-size="13" text-anchor="start">反向代理</text>
<text class="t m s" x="280" y="400" font-size="12" text-anchor="start">:80／:443 · 依 Host 查路由表；服務層變更後即時重載</text>
<path class="lna" d="M192 124 L264 138" marker-end="url(#aa)"/>
<path class="lna" d="M192 264 L228 264 L228 214 L264 214" marker-end="url(#aa)"/>
<path class="lna" d="M192 392 L264 388" marker-end="url(#aa)"/>
<rect class="soft" x="700" y="64" width="256" height="112" rx="10"/>
<text class="t b" x="716" y="90" font-size="14" text-anchor="start">CAFECA</text>
<rect class="box" x="716" y="102" width="108" height="58" rx="8"/>
<text class="t b" x="728" y="126" font-size="13" text-anchor="start">錢包</text>
<text class="t m s" x="728" y="146" font-size="12" text-anchor="start">Passkey 簽署</text>
<rect class="box" x="836" y="102" width="108" height="58" rx="8"/>
<text class="t b" x="848" y="126" font-size="13" text-anchor="start">公開 RPC</text>
<text class="t m s" x="848" y="146" font-size="12" text-anchor="start">ERC-1271 驗證</text>
<path class="ln" d="M628 184 L890 184 L890 160" marker-end="url(#a)"/>
<text class="t m s" x="651" y="202" font-size="12" text-anchor="start">驗證簽章</text>
<path class="ln" d="M108 92 C108 48 150 50 244 50 L700 50 C760 50 770 70 770 102" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text class="t m s" x="420" y="42" font-size="12" text-anchor="middle">登入時由錢包以 Passkey 簽署 EIP-712 SignIn</text>
<rect class="soft" x="700" y="196" width="256" height="300" rx="10"/>
<text class="t b" x="716" y="222" font-size="14" text-anchor="start">Docker Engine</text>
<rect class="grp" x="716" y="236" width="224" height="248" rx="8"/>
<text class="t m s mono" x="728" y="258" font-size="12" text-anchor="start">caloud-edge 網路</text>
<rect class="box" x="728" y="274" width="200" height="88" rx="8"/>
<text class="t b" x="744" y="300" font-size="13" text-anchor="start">App：blog</text>
<text class="t m s mono" x="744" y="321" font-size="12" text-anchor="start">web · db</text>
<text class="t m s" x="744" y="342" font-size="12" text-anchor="start">獨立 compose project</text>
<rect class="box" x="728" y="378" width="200" height="88" rx="8"/>
<text class="t b" x="744" y="404" font-size="13" text-anchor="start">App：api</text>
<text class="t m s mono" x="744" y="425" font-size="12" text-anchor="start">api · redis</text>
<text class="t m s" x="744" y="446" font-size="12" text-anchor="start">獨立 compose project</text>
<path class="ln" d="M628 298 L728 310" marker-end="url(#a)"/>
<text class="t m s mono" x="640" y="290" font-size="11" text-anchor="start">docker.sock</text>
<path class="lna" d="M628 388 L728 410" marker-end="url(#aa)"/>
<text class="t m s mono" x="636" y="380" font-size="11" text-anchor="start">service:port</text>
</svg>
