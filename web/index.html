<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caloud</title>
<link rel="icon" type="image/svg+xml" href="/assets/ds/logo.svg">
<link rel="stylesheet" href="/assets/ds/tokens.css">
<link rel="stylesheet" href="/assets/ds/theme.css">
<link rel="stylesheet" href="/assets/ds/components.css">
<script src="/assets/ds/ui.js"></script>
<script>UI.initTheme();</script>
</head>
<body>

<!-- FR-AUTH-01 登入 -->
<main class="c-login u-hidden" id="login">
  <section class="c-login__panel">
    <img class="c-login__mark" src="/assets/ds/logo.svg" alt="" aria-hidden="true">
    <h1 class="c-login__title">登入 Caloud</h1>
    <p class="c-login__desc">使用 CAFECA 身分登入。部署後第一位登入的人會成為 Super Admin。</p>
    <button class="c-btn c-btn--primary" id="login-btn">以 CAFECA 登入</button>
    <p class="c-msg c-msg--danger" id="login-msg" role="alert"></p>
  </section>
</main>

<!-- FR-UI-11 AppShell -->
<div class="c-shell u-hidden" id="shell">
  <aside class="c-sidebar">
    <div class="c-sidebar__brand"><img class="c-sidebar__mark" src="/assets/ds/logo.svg" alt="" aria-hidden="true">Caloud</div>
    <nav class="c-sidebar__nav" aria-label="主要導覽" id="nav"></nav>
    <div class="c-sidebar__footer">
      <div class="c-account" id="account"></div>
      <div class="l-row">
        <button class="c-btn c-btn--ghost c-btn--sm" id="theme-btn" aria-label="切換淺色／深色"></button>
        <button class="c-btn c-btn--ghost c-btn--sm" id="logout-btn"></button>
      </div>
    </div>
  </aside>
  <main class="c-shell__main"><div class="c-page" id="page"></div></main>
</div>

<script>
"use strict";
const { $, $$, esc, api, relTime, statusPill, showMsg, toast, confirmDialog, drawer, busy, copyField, empty, skeletonRows, icon } = UI;

// ─────────────── 狀態 ───────────────
const state = { me: null, apps: [], domains: [], users: [], cafeca: null, appFilter: "all", appQuery: "", domainQuery: "" };
const isAdmin = () => ["super_admin", "admin"].includes(state.me?.role);
const appName = (id) => state.apps.find((a) => a.id === id)?.name ?? "（已刪除）";
const roleLabel = (r) => ({ super_admin: "Super Admin", admin: "Admin", member: "Member", pending: "待核准", disabled: "已停用" }[r] || r);
const currentPage = () => (location.hash.slice(1) || "overview").split("/")[0];
const pageArg = () => decodeURIComponent(location.hash.slice(1).split("/")[1] || "");

// ─────────────── 登入 FR-AUTH-01 ───────────────
async function loadSdk() {
  const cfg = await api("/api/auth/config");
  await new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = cfg.wallet + "/sdk/cafeca-connect.js";
    s.onload = ok;
    s.onerror = () => fail(new Error("無法載入 CAFECA 登入元件，請檢查網路後重新整理。"));
    document.head.append(s);
  });
  return CafecaConnect.create({ wallet: cfg.wallet });
}
$("#login-btn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  showMsg($("#login-msg"), null);
  if (!state.cafeca) return showMsg($("#login-msg"), new Error("登入元件載入中，請稍候再按一次。"));
  try {
    // signIn 必須在點擊事件中同步呼叫（之前不可 await），否則彈出視窗會被擋下
    const response = await state.cafeca.signIn({
      nonce: () => api("/api/auth/nonce", { method: "POST" }).then((j) => j.nonce),
      statement: "登入 Caloud 管理介面",
      claims: ["handle"],
    });
    state.me = await busy(btn, api("/api/auth/login", { method: "POST", body: response }));
    boot();
  } catch (err) { showMsg($("#login-msg"), err); }
});

// ─────────────── AppShell FR-UI-11 ───────────────
const PAGES = [
  { id: "overview", label: "總覽", icon: "home", render: renderOverview },
  { id: "projects", label: "專案", icon: "branch", render: renderProjects },
  { id: "apps", label: "Apps", icon: "box", render: renderApps },
  { id: "domains", label: "網域", icon: "globe", render: renderDomains },
  { id: "users", label: "使用者", icon: "users", render: renderUsers, admin: true },
  { id: "tls", label: "HTTPS 憑證", icon: "shield", render: renderTls, admin: true },
  { id: "tokens", label: "API 權杖", icon: "key", render: renderTokens },
];
function renderShell() {
  const pendingUsers = state.users.filter((u) => u.role === "pending").length;
  $("#nav").innerHTML = PAGES.filter((p) => !p.admin || isAdmin()).map((p) =>
    `<a class="c-sidebar__item" href="#${p.id}" data-page="${p.id}">${icon(p.icon)}<span>${p.label}</span>${p.id === "users" && pendingUsers ? `<span class="c-sidebar__count" aria-label="${pendingUsers} 位待核准">${pendingUsers}</span>` : ""}</a>`).join("");
  const m = state.me;
  $("#account").innerHTML = `<span class="c-account__avatar" aria-hidden="true"></span><span class="c-account__text"><span class="c-account__name" title="${esc(m.account)}">${esc(m.handle || m.account.slice(0, 6) + "…" + m.account.slice(-4))}</span><span class="c-account__role">${esc(roleLabel(m.role))}</span></span>`;
  $("#theme-btn").innerHTML = `${icon("moon")}<span>主題</span>`;
  $("#logout-btn").innerHTML = `${icon("logout")}<span>登出</span>`;
  markNav();
}
function markNav() {
  $$(".c-sidebar__item").forEach((a) => {
    const on = a.dataset.page === currentPage();
    a.classList.toggle("is-active", on);
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
}
$("#theme-btn").addEventListener("click", UI.toggleTheme);
$("#logout-btn").addEventListener("click", async () => { await api("/api/auth/logout", { method: "POST" }); location.replace("/"); });

function route() {
  const page = PAGES.find((p) => p.id === currentPage() && (!p.admin || isAdmin())) || PAGES[0];
  markNav();
  document.title = `${page.label} · Caloud`;
  page.render();
}
window.addEventListener("hashchange", route);

function pageHeader(title, desc, actions = "") {
  return `<header class="c-page-header"><div class="c-page-header__text"><h1 class="c-page-header__title">${esc(title)}</h1><p class="c-page-header__desc">${esc(desc)}</p></div>${actions ? `<div class="c-page-header__actions">${actions}</div>` : ""}</header>`;
}

async function refresh(...what) {
  const jobs = { apps: () => api("/api/apps"), domains: () => api("/api/domains"), users: () => (isAdmin() ? api("/api/users") : []) };
  const res = await Promise.all(what.map((k) => jobs[k]()));
  what.forEach((k, i) => (state[k] = res[i]));
}

// ─────────────── 總覽 FR-UI-09 ───────────────
async function renderOverview() {
  const page = $("#page");
  page.innerHTML = pageHeader("總覽", "所有 App 與網域的目前狀態，以及需要你處理的事項。") +
    `<div class="l-grid" id="stats">${Array(4).fill('<div class="c-stat"><span class="c-skeleton"></span><span class="c-skeleton"></span></div>').join("")}</div><div id="todo"></div>`;
  try { await refresh("apps", "domains", "users"); renderShell(); }
  catch (err) { return page.insertAdjacentHTML("beforeend", `<p class="c-msg c-msg--danger" role="alert">${esc(err.message)}</p>`); }
  const running = state.apps.filter((a) => a.status === "running").length;
  const failed = state.apps.filter((a) => a.status === "failed");
  const live = state.domains.filter((d) => routeState(d) === "live").length;
  const unverified = state.domains.filter((d) => !d.verified);
  const unbound = state.domains.filter((d) => d.verified && !d.app_id);
  const pending = state.users.filter((u) => u.role === "pending");
  const todoCount = failed.length + unverified.length + unbound.length + pending.length;
  const stat = (label, value, total, meta, href) => `<a class="c-stat" href="${href}"><span class="c-stat__label">${label}</span><span class="c-stat__value">${value}${total !== null ? `<span class="u-muted u-small"> / ${total}</span>` : ""}</span><span class="c-stat__meta">${meta}</span></a>`;
  $("#stats").innerHTML =
    stat("運作中的 App", running, state.apps.length, failed.length ? `${statusPill("app", "failed")} ${failed.length} 個` : "沒有失敗的 App", "#apps") +
    stat("轉發中的網域", live, state.domains.length, unverified.length ? `${statusPill("domain", false)} ${unverified.length} 個` : "全部已驗證", "#domains") +
    stat("待處理", todoCount, null, todoCount ? "見下方清單" : "目前沒有", "#overview") +
    (isAdmin() ? stat("使用者", state.users.length, null, pending.length ? `${statusPill("role", "pending")} ${pending.length} 位` : "沒有待核准", "#users") : "");
  const items = [
    ...failed.map((a) => ({ tone: "danger", icon: "alert", title: `${a.name} 部署失敗`, body: a.last_error || "請查看 log 了解原因。", href: "#apps", action: "查看" })),
    ...unverified.map((d) => ({ tone: "warning", icon: "globe", title: `${d.hostname} 尚未驗證`, body: "設定 DNS TXT 紀錄後按「驗證」。", href: "#domains", action: "前往設定" })),
    ...unbound.map((d) => ({ tone: "", icon: "link", title: `${d.hostname} 尚未綁定 App`, body: "選擇要轉發的 App 與 port。", href: "#domains", action: "綁定" })),
    ...pending.map((u) => ({ tone: "warning", icon: "users", title: `${u.handle || u.account.slice(0, 10) + "…"} 等待核准`, body: "核准後才能部署 App 與托管網域。", href: "#users", action: "審核" })),
  ];
  $("#todo").innerHTML = `<section class="c-card"><div class="c-card__header"><h2 class="c-card__title">需要處理</h2></div><div class="c-card__body">${
    items.length
      ? items.map((i) => `<div class="c-banner ${i.tone ? "c-banner--" + i.tone : ""}">${icon(i.icon)}<div class="c-banner__body"><strong>${esc(i.title)}</strong><span class="u-muted u-small">${esc(i.body)}</span></div><a class="c-btn c-btn--sm" href="${i.href}">${i.action}</a></div>`).join("")
      : empty({ iconName: "check", title: "目前沒有待處理事項", body: "所有 App 與網域都運作正常。" })}</div></section>`;
}

// ─────────────── Apps FR-APP-* / FR-UI-08 / FR-UI-10 ───────────────
let pollTimer = null;
async function renderApps() {
  $("#page").innerHTML = pageHeader("Apps", "每個 App 是一份 docker compose。上傳後立即部署，再到「網域」把流量轉過來。",
    `<button class="c-btn c-btn--primary" id="new-app">${icon("plus")}<span>新增 App</span></button>`) +
    `<section class="c-card"><div class="c-card__header">
      <label class="c-search">${icon("search")}<span class="u-sr-only">搜尋 App</span><input class="c-input" id="app-q" placeholder="搜尋名稱" value="${esc(state.appQuery)}"></label>
      <div class="c-segmented" role="group" aria-label="狀態篩選" id="app-filter">${[["all", "全部"], ["running", "運作中"], ["deploying", "部署中"], ["failed", "失敗"], ["stopped", "已停止"]].map(([v, l]) => `<button class="c-segmented__item ${state.appFilter === v ? "is-active" : ""}" data-v="${v}" aria-pressed="${state.appFilter === v}">${l}</button>`).join("")}</div>
    </div><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>名稱</th><th>狀態</th><th>網域</th><th>更新</th><th><span class="u-sr-only">操作</span></th></tr></thead>
      <tbody id="apps">${skeletonRows(5)}</tbody></table></div></div></section>
    <p class="c-msg c-msg--danger" id="apps-msg" role="alert"></p>`;
  $("#new-app").addEventListener("click", openNewApp);
  $("#app-q").addEventListener("input", (e) => { state.appQuery = e.target.value; drawApps(); });
  $("#app-filter").addEventListener("click", (e) => {
    const b = e.target.closest("[data-v]"); if (!b) return;
    state.appFilter = b.dataset.v;
    $$("#app-filter .c-segmented__item").forEach((x) => { x.classList.toggle("is-active", x === b); x.setAttribute("aria-pressed", x === b); });
    drawApps();
  });
  await loadApps();
}
async function loadApps() {
  try { await refresh("apps", "domains"); if ($("#apps-msg")) showMsg($("#apps-msg"), null); }
  catch (err) { return $("#apps-msg") ? showMsg($("#apps-msg"), err) : toast(err.message, "danger"); }
  drawApps();
  clearTimeout(pollTimer); // FR-UI-02
  if (state.apps.some((a) => a.status === "deploying") && currentPage() === "apps") pollTimer = setTimeout(loadApps, 3000);
}
function drawApps() {
  const tbody = $("#apps"); if (!tbody) return;
  const q = state.appQuery.trim().toLowerCase();
  const list = state.apps.filter((a) => (state.appFilter === "all" || a.status === state.appFilter) && (!q || a.name.toLowerCase().includes(q)));
  if (!state.apps.length) return (tbody.innerHTML = `<tr><td colspan="5">${empty({ iconName: "box", title: "還沒有 App", body: "上傳一份 docker compose 檔，Caloud 會立即啟動容器。", action: `<button class="c-btn c-btn--primary" data-act="new">${icon("plus")}<span>新增 App</span></button>` })}</td></tr>`);
  if (!list.length) return (tbody.innerHTML = `<tr><td colspan="5">${empty({ iconName: "search", title: "沒有符合條件的 App", body: "調整搜尋文字或狀態篩選。" })}</td></tr>`);
  tbody.innerHTML = list.map((a) => {
    const doms = state.domains.filter((d) => d.app_id === a.id);
    return `<tr class="is-clickable" data-id="${esc(a.id)}" tabindex="0">
      <td><div class="c-table__primary">${esc(a.name)}</div><div class="c-table__secondary u-mono">${esc(a.id.slice(0, 8))}</div></td>
      <td>${statusPill("app", a.status)}${a.last_error ? `<div class="c-table__secondary u-truncate" title="${esc(a.last_error)}">${esc(a.last_error)}</div>` : ""}</td>
      <td class="u-small">${doms.length ? doms.map((d) => esc(d.hostname)).join("<br>") : '<span class="u-muted">—</span>'}</td>
      <td class="u-muted u-small u-nowrap">${relTime(a.updated_at)}</td>
      <td><div class="c-table__actions">
        <button class="c-btn c-btn--ghost c-btn--icon c-btn--sm" data-act="deploy" aria-label="部署 ${esc(a.name)}" title="部署">${icon(a.status === "running" ? "refresh" : "play")}</button>
        <button class="c-btn c-btn--ghost c-btn--icon c-btn--sm" data-act="stop" aria-label="停止 ${esc(a.name)}" title="停止" ${a.status === "stopped" ? "disabled" : ""}>${icon("stop")}</button>
        <button class="c-btn c-btn--ghost c-btn--icon c-btn--sm c-btn--danger" data-act="delete" aria-label="刪除 ${esc(a.name)}" title="刪除">${icon("trash")}</button>
      </div></td></tr>`;
  }).join("");
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#apps")) return;
  const btn = e.target.closest("[data-act]");
  if (btn?.dataset.act === "new") return openNewApp();
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  const app = state.apps.find((a) => a.id === tr.dataset.id);
  if (!btn) return openApp(app.id);
  appAction(btn.dataset.act, app, btn);
});
// 可點擊的表格列：Enter 開啟
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches?.("tr.is-clickable")) e.target.click(); });

async function appAction(act, app, btn) {
  try {
    if (act === "delete") {
      if (!(await confirmDialog({ title: `刪除 ${app.name}？`, body: "容器會被移除，綁定的網域會停止轉發。資料 volume 會保留。", confirmText: "刪除 App" }))) return false;
      await api(`/api/apps/${app.id}`, { method: "DELETE" });
      toast(`已刪除 ${app.name}`);
    } else {
      await busy(btn, api(`/api/apps/${app.id}/${act}`, { method: "POST" }));
      toast(act === "deploy" ? `${app.name} 開始部署` : `已停止 ${app.name}`);
    }
    await loadApps();
    return true;
  } catch (err) { toast(err.message, "danger"); return false; }
}

const parseList = (v) => v.split(/[\s,，]+/).map((x) => x.trim()).filter(Boolean);
const envHint = (app) => app.env_keys?.length ? `目前變數：${app.env_keys.join("、")}。留空表示不變。` : "每行 KEY=value；存檔後只顯示變數名稱。";

/** FR-APP-01、FR-APP-13～16：上傳 compose 或（Admin）從 Git 儲存庫建立 */
function openNewApp() {
  const dr = drawer({ title: "新增 App", subtitle: "上傳 compose 檔或從 Git 儲存庫建立，建立後立即部署。" });
  const sources = [["compose", "上傳 compose"], ...(isAdmin() ? [["git", "Git 儲存庫"]] : [])];
  dr.body.innerHTML = `
    ${sources.length > 1 ? `<div class="c-segmented" role="group" aria-label="來源" id="na-source">${sources.map(([v, l], i) => `<button class="c-segmented__item ${i ? "" : "is-active"}" data-v="${v}" aria-pressed="${!i}">${l}</button>`).join("")}</div>` : ""}
    <label class="c-field"><span class="c-field__label">名稱</span><input class="c-input" id="na-name" placeholder="例如 blog" autocomplete="off"><span class="c-field__hint">留空時以第一個 service 命名。</span></label>
    <div class="l-stack" data-src="compose">
      <div class="c-field"><span class="c-field__label">compose 檔</span>
        <div><label class="c-btn">${icon("upload")}<span>選擇 .yml 檔案</span><input type="file" id="na-file" accept=".yml,.yaml" class="u-sr-only"></label></div>
        <textarea class="c-textarea" id="na-yaml" aria-label="compose YAML" spellcheck="false" placeholder="services:&#10;  web:&#10;    image: nginx:alpine"></textarea></div>
    </div>
    <div class="l-stack u-hidden" data-src="git">
      <label class="c-field"><span class="c-field__label">儲存庫網址</span><input class="c-input u-mono" id="na-git-url" placeholder="https://github.com/CAFECA-IO/SwarmStorage" autocomplete="off" spellcheck="false"><span class="c-field__hint">只支援公開的 https:// 儲存庫。</span></label>
      <div class="l-grid">
        <label class="c-field"><span class="c-field__label">分支／標籤</span><input class="c-input u-mono" id="na-git-ref" placeholder="main"></label>
        <label class="c-field"><span class="c-field__label">目錄</span><input class="c-input u-mono" id="na-git-path" placeholder="deploy/livekit"></label>
        <label class="c-field"><span class="c-field__label">compose 檔名</span><input class="c-input u-mono" id="na-git-file" placeholder="docker-compose.yml"></label>
      </div>
    </div>
    <label class="c-field"><span class="c-field__label">只啟動這些 service（選填）</span><input class="c-input u-mono" id="na-services" placeholder="例如 caddy, livekit" autocomplete="off"><span class="c-field__hint">以逗號分隔；留空啟動全部。</span></label>
    <label class="c-field"><span class="c-field__label">環境變數（選填）</span><textarea class="c-textarea c-textarea--sm" id="na-env" spellcheck="false" placeholder="LIVEKIT_DOMAIN=livekit.example.com"></textarea><span class="c-field__hint">${envHint({})}</span></label>
    ${isAdmin() ? `<label class="c-check"><input type="checkbox" id="na-priv"><span>特權 App：允許 build、host 網路與主機連接埠（僅 Admin）</span></label>` : ""}
    <span class="c-field__error" id="na-err" role="alert"></span>
    <div class="c-banner" id="na-rules">${icon("shield")}<div class="c-banner__body"><strong>安全限制</strong><span class="u-small">一般 App 不可使用 <code class="c-code">ports</code>、<code class="c-code">privileged</code>、主機路徑掛載與 <code class="c-code">build</code>；對外流量請在「網域」綁定。特權 App 規則見安全規範 §3.5。</span></div></div>`;
  dr.footer.classList.remove("u-hidden");
  dr.footer.innerHTML = `<button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="na-submit">${icon("play")}<span>建立並部署</span></button>`;
  let source = "compose";
  $("#na-source", dr.el)?.addEventListener("click", (e) => {
    const b = e.target.closest("[data-v]"); if (!b) return;
    source = b.dataset.v;
    $$("#na-source .c-segmented__item", dr.el).forEach((x) => { x.classList.toggle("is-active", x === b); x.setAttribute("aria-pressed", x === b); });
    $$("[data-src]", dr.el).forEach((x) => x.classList.toggle("u-hidden", x.dataset.src !== source));
  });
  $("#na-file", dr.el).addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    $("#na-yaml", dr.el).value = await f.text();
    const base = f.name.replace(/\.(ya?ml)$/i, "");
    if (!$("#na-name", dr.el).value && !/^(docker-)?compose$/.test(base)) $("#na-name", dr.el).value = base;
  });
  $("#na-submit", dr.el).addEventListener("click", async (e) => {
    const btn = e.currentTarget, v = (id) => $(id, dr.el)?.value.trim() || null;
    showMsg($("#na-err", dr.el), null);
    const body = { name: v("#na-name"), source, env: v("#na-env"), services: parseList($("#na-services", dr.el).value), privileged: $("#na-priv", dr.el)?.checked || false };
    if (source === "compose") {
      if (!v("#na-yaml")) return showMsg($("#na-err", dr.el), new Error("請上傳或貼上 compose 檔。"));
      body.compose_yaml = $("#na-yaml", dr.el).value;
    } else {
      if (!v("#na-git-url")) return showMsg($("#na-err", dr.el), new Error("請輸入儲存庫網址。"));
      Object.assign(body, { git_url: v("#na-git-url"), git_ref: v("#na-git-ref"), git_path: v("#na-git-path"), compose_file: v("#na-git-file") });
    }
    try {
      const app = await busy(btn, api("/api/apps", { method: "POST", body }));
      dr.close(); toast(`已建立 ${app.name}，開始部署`);
      if (currentPage() === "apps") loadApps(); else location.hash = "apps";
    } catch (err) { showMsg($("#na-err", dr.el), err); }
  });
}

async function openApp(id) {
  const app = state.apps.find((a) => a.id === id);
  const dr = drawer({ title: app.name, subtitle: `${statusPill("app", app.status)} <span class="u-mono">${esc(app.id)}</span>` });
  dr.body.innerHTML = `<div class="c-tabs" role="tablist">${[["info", "概覽"], ["compose", "compose"], ["logs", "Logs"]].map(([v, l], i) => `<button class="c-tabs__item ${i ? "" : "is-active"}" role="tab" data-tab="${v}" aria-selected="${!i}">${l}</button>`).join("")}</div><div id="ad-panel" class="l-stack"></div>`;
  dr.footer.classList.remove("u-hidden");
  dr.footer.innerHTML = `<button class="c-btn c-btn--danger" data-a="delete">${icon("trash")}<span>刪除</span></button><span class="l-spacer"></span><button class="c-btn" data-a="stop">${icon("stop")}<span>停止</span></button><button class="c-btn c-btn--primary" data-a="deploy">${icon("refresh")}<span>重新部署</span></button>`;
  dr.footer.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    if ((await appAction(b.dataset.a, app, b)) && b.dataset.a === "delete") dr.close();
  });
  let detail = null;
  const show = async (tab) => {
    $$(".c-tabs__item", dr.el).forEach((t) => { t.classList.toggle("is-active", t.dataset.tab === tab); t.setAttribute("aria-selected", t.dataset.tab === tab); });
    const panel = $("#ad-panel", dr.el);
    panel.innerHTML = '<span class="c-skeleton"></span><span class="c-skeleton"></span>';
    try { detail ??= await api(`/api/apps/${id}`); } catch (err) { return (panel.innerHTML = `<p class="c-msg c-msg--danger">${esc(err.message)}</p>`); }
    if (tab === "info") {
      const doms = state.domains.filter((d) => d.app_id === id);
      const a = detail.app;
      const src = a.source === "git" ? `<span class="u-mono">${esc(a.git_url)}</span><br><span class="u-muted u-small">ref <code class="c-code">${esc(a.git_ref)}</code> · 目錄 <code class="c-code">${esc(a.git_path || "/")}</code> · <code class="c-code">${esc(a.compose_file)}</code></span>` : "上傳的 compose";
      panel.innerHTML = `<dl class="c-kv"><dt class="c-kv__key">狀態</dt><dd class="c-kv__value">${statusPill("app", app.status)}${a.privileged ? ` <span class="c-badge c-badge--accent"><span class="c-badge__dot" aria-hidden="true"></span>特權</span>` : ""}</dd>
        <dt class="c-kv__key">來源</dt><dd class="c-kv__value">${src}</dd>
        <dt class="c-kv__key">Services</dt><dd class="c-kv__value u-mono">${detail.services.map((x) => !a.services || a.services.includes(x) ? esc(x) : `<span class="u-muted">${esc(x)}（不啟動）</span>`).join(", ")}</dd>
        <dt class="c-kv__key">環境變數</dt><dd class="c-kv__value u-mono">${a.env_keys.length ? a.env_keys.map(esc).join(", ") : '<span class="u-muted">無</span>'}</dd>
        <dt class="c-kv__key">網域</dt><dd class="c-kv__value">${doms.length ? doms.map((d) => `<a href="${d.tls_mode === "passthrough" ? "https" : "http"}://${esc(d.hostname)}" target="_blank" rel="noopener">${esc(d.hostname)}</a> → <span class="u-mono">${esc(d.service)}:${esc(d.port)}${d.tls_mode === "passthrough" ? ` · TLS ${esc(d.tls_port)}` : ""}</span>`).join("<br>") : '<span class="u-muted">尚未綁定，請到「網域」設定。</span>'}</dd>
        <dt class="c-kv__key">更新</dt><dd class="c-kv__value">${relTime(app.updated_at)}</dd></dl>
        ${app.last_error ? `<div class="c-banner c-banner--danger">${icon("alert")}<div class="c-banner__body"><strong>上次部署失敗</strong><span class="u-small u-mono">${esc(app.last_error)}</span></div></div>` : ""}
        <h3 class="c-section-title">容器</h3>
        <div class="c-table-wrap"><table class="c-table"><thead><tr><th>Service</th><th>容器</th><th>狀態</th></tr></thead><tbody>${detail.containers.map((c) => `<tr><td class="u-mono">${esc(c.Service)}</td><td class="u-mono u-small">${esc(c.Name)}</td><td>${esc(c.State)} ${c.Health ? `<span class="u-muted">(${esc(c.Health)})</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="3">${empty({ iconName: "box", title: "沒有容器", body: "按「重新部署」啟動。" })}</td></tr>`}</tbody></table></div>`;
    } else if (tab === "compose") {
      const a = detail.app, git = a.source === "git";
      panel.innerHTML = `
        ${git ? `<label class="c-field"><span class="c-field__label">分支／標籤</span><input class="c-input u-mono" id="ad-ref" value="${esc(a.git_ref)}"><span class="c-field__hint">儲存後會重新取得此版本並建置。</span></label>` : ""}
        <label class="c-field"><span class="c-field__label">${git ? `${esc(a.compose_file)}（唯讀，來自儲存庫）` : "compose.yml"}</span><textarea class="c-textarea" id="ad-yaml" spellcheck="false" ${git ? "readonly" : ""}>${esc(detail.compose_yaml)}</textarea></label>
        <label class="c-field"><span class="c-field__label">只啟動這些 service</span><input class="c-input u-mono" id="ad-services" value="${esc((a.services || []).join(", "))}" placeholder="留空啟動全部"></label>
        <label class="c-field"><span class="c-field__label">環境變數</span><textarea class="c-textarea c-textarea--sm" id="ad-env" spellcheck="false" placeholder="KEY=value"></textarea><span class="c-field__hint">${esc(envHint(a))}</span></label>
        <span class="c-field__error" id="ad-err" role="alert"></span>
        <div class="l-row"><span class="l-spacer"></span><button class="c-btn c-btn--primary" id="ad-save">${icon("check")}<span>儲存並重新部署</span></button></div>`;
      $("#ad-save", dr.el).addEventListener("click", async (e) => {
        const btn = e.currentTarget, body = { services: parseList($("#ad-services", dr.el).value) };
        if (git) body.git_ref = $("#ad-ref", dr.el).value.trim(); else body.compose_yaml = $("#ad-yaml", dr.el).value;
        if ($("#ad-env", dr.el).value.trim()) body.env = $("#ad-env", dr.el).value;
        showMsg($("#ad-err", dr.el), null);
        try { await busy(btn, api(`/api/apps/${id}`, { method: "PUT", body })); detail = null; toast("已儲存，開始重新部署"); loadApps(); }
        catch (err) { showMsg($("#ad-err", dr.el), err); }
      });
    } else {
      const load = async () => {
        const out = $("#ad-log", dr.el); out.textContent = "載入中…";
        out.textContent = (await api(`/api/apps/${id}/logs?tail=500`).catch((e) => e.message)) || "（沒有 log）";
        out.scrollTop = out.scrollHeight;
      };
      panel.innerHTML = `<div class="l-row"><span class="c-label">最近 500 行</span><span class="l-spacer"></span><button class="c-btn c-btn--sm" id="ad-reload">${icon("refresh")}<span>重新整理</span></button></div><pre class="c-log" id="ad-log"></pre>`;
      $("#ad-reload", dr.el).addEventListener("click", load);
      load();
    }
  };
  $(".c-tabs", dr.el).addEventListener("click", (e) => { const t = e.target.closest("[data-tab]"); if (t) show(t.dataset.tab); });
  show("info");
}

// ─────────────── 專案 FR-GH-04、FR-AN-03、FR-AN-04、FR-AN-06、FR-AN-10 ───────────────
const ROLE_LABEL = { app: "App", database: "資料庫", cache: "快取", support: "附加服務" };
const PROVIDER_LABEL = { platform: "平臺自動填入", generated: "平臺產生（秘密）", user: "需要你提供" };
/** 分析訊息中的 `x` 顯示為行內程式碼 */
const fmtMsg = (m) => esc(m).replace(/`([^`]+)`/g, '<code class="c-code">$1</code>');
const repoShort = (url) => url.replace(/^https:\/\/(www\.)?github\.com\//, "").replace(/\.git$/, "");

async function renderProjects() {
  clearTimeout(pollTimer);
  if (pageArg()) return renderProject(pageArg());
  $("#page").innerHTML = pageHeader("專案", "貼上公開儲存庫網址，Caloud 會自動解析服務、port 與需要的環境變數；確認後才開始驗證。",
    `<button class="c-btn c-btn--primary" id="new-project">${icon("plus")}<span>匯入專案</span></button>`) +
    `<section class="c-card"><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>名稱</th><th>儲存庫</th><th>狀態</th><th>更新</th></tr></thead>
      <tbody id="projects">${skeletonRows(4)}</tbody></table></div></div></section>
    <p class="c-msg c-msg--danger" id="projects-msg" role="alert"></p>`;

}
async function loadProjects() {
  let list;
  try { list = await api("/api/projects"); } catch (err) { return showMsg($("#projects-msg"), err); }
  const tbody = $("#projects"); if (!tbody) return;
  tbody.innerHTML = list.length ? list.map((p) => `<tr class="is-clickable" data-id="${esc(p.id)}" tabindex="0">
      <td><div class="c-table__primary">${esc(p.name)}</div>${p.root ? `<div class="c-table__secondary u-mono">${esc(p.root)}/</div>` : ""}</td>
      <td><span class="u-mono u-small">${esc(repoShort(p.repo_url))}</span><div class="c-table__secondary u-mono">${esc(p.git_ref || p.branch || "預設分支")}</div></td>
      <td>${statusPill("project", p.status)}${p.error ? `<div class="c-table__secondary u-truncate" title="${esc(p.error)}">${esc(p.error)}</div>` : ""}</td>
      <td class="u-muted u-small u-nowrap">${relTime(p.updated_at)}</td></tr>`).join("")
    : `<tr><td colspan="4">${empty({ iconName: "branch", title: "還沒有專案", body: "匯入一個公開的 GitHub 儲存庫，Caloud 會解析它需要的服務。", action: `<button class="c-btn c-btn--primary" data-act="import">${icon("plus")}<span>匯入專案</span></button>` })}</td></tr>`;
  if (list.some((p) => p.status === "analyzing") && currentPage() === "projects" && !pageArg()) pollTimer = setTimeout(loadProjects, 2000);
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#projects")) return;
  if (e.target.closest("[data-act='import']")) return openImport();
  const tr = e.target.closest("tr[data-id]");
  if (tr) location.hash = `projects/${tr.dataset.id}`;
});

/** FR-GH-04、FR-AN-06：以公開儲存庫網址匯入 */
function openImport() {
  const dr = drawer({ title: "匯入專案", subtitle: "目前支援公開的 https:// 儲存庫；GitHub App 授權之後開放。" });
  dr.body.innerHTML = `
    <label class="c-field"><span class="c-field__label">儲存庫網址</span><input class="c-input u-mono" id="ip-url" placeholder="https://github.com/CAFECA-IO/SwarmStorage" autocomplete="off" spellcheck="false"></label>
    <div class="l-grid">
      <label class="c-field"><span class="c-field__label">分支／標籤（選填）</span><input class="c-input u-mono" id="ip-ref" placeholder="預設分支"></label>
      <label class="c-field"><span class="c-field__label">根目錄（選填）</span><input class="c-input u-mono" id="ip-root" placeholder="例如 app"><span class="c-field__hint">monorepo 時指定專案所在的子目錄。</span></label>
    </div>
    <label class="c-field"><span class="c-field__label">名稱（選填）</span><input class="c-input" id="ip-name" placeholder="預設為儲存庫名稱" autocomplete="off"></label>
    <span class="c-field__error" id="ip-err" role="alert"></span>
    <div class="c-banner">${icon("shield")}<div class="c-banner__body"><strong>只讀取，不執行</strong><span class="u-small">解析只讀儲存庫中的檔案，不會執行任何程式；確認之前不會建置或部署。</span></div></div>`;
  dr.footer.classList.remove("u-hidden");
  dr.footer.innerHTML = `<button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="ip-submit">${icon("search")}<span>匯入並解析</span></button>`;
  $("#ip-submit", dr.el).addEventListener("click", async (e) => {
    const v = (id) => $(id, dr.el).value.trim() || null;
    showMsg($("#ip-err", dr.el), null);
    if (!v("#ip-url")) return showMsg($("#ip-err", dr.el), new Error("請輸入儲存庫網址。"));
    try {
      const p = await busy(e.currentTarget, api("/api/projects", { method: "POST", body: { repo_url: v("#ip-url"), git_ref: v("#ip-ref"), root: v("#ip-root"), name: v("#ip-name") } }));
      dr.close();
      location.hash = p ? `projects/${p.id}` : "projects";
    } catch (err) { showMsg($("#ip-err", dr.el), err); }
  });
}

/** 依據：GitHub 儲存庫連到該 commit 的檔案與行號 */
function evidenceLink(project, commit, ev) {
  const label = `${ev.file}${ev.line ? `:${ev.line}` : ""}`;
  const gh = /^https:\/\/github\.com\/[^/]+\/[^/]+/.exec(project.repo_url.replace(/\.git$/, ""));
  if (!gh || !commit || ev.file.startsWith("（")) return `<span class="u-mono u-small">${esc(label)}</span>`;
  return `<a class="u-mono u-small" href="${esc(`${gh[0]}/blob/${commit}/${ev.file}${ev.line ? `#L${ev.line}` : ""}`)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}

/** FR-AN-03、FR-AN-04：解析結果確認頁 */
async function renderProject(id) {
  $("#page").innerHTML = `<span class="c-skeleton"></span><span class="c-skeleton"></span>`;
  let data;
  try { data = await api(`/api/projects/${encodeURIComponent(id)}`); }
  catch (err) { return ($("#page").innerHTML = pageHeader("專案", "") + `<p class="c-msg c-msg--danger" role="alert">${esc(err.message)}</p><p><a href="#projects">回到專案列表</a></p>`); }
  if (currentPage() !== "projects" || pageArg() !== id) return;
  const { project: p, analysis: a, confirmed: c } = data;
  const r = a?.result;
  document.title = `${p.name} · 專案 · Caloud`;
  const commitShort = a?.commit ? a.commit.slice(0, 7) : "";
  const analyzing = p.status === "analyzing";
  const isConfirmedLatest = c && a && c.id === a.id;
  const step = (n, label, state) => `<span role="listitem" class="c-badge ${state === "done" ? "c-badge--success" : state === "current" ? "c-badge--accent" : ""}"><span class="c-badge__dot" aria-hidden="true"></span>${n} ${esc(label)}${state === "current" ? '<span class="u-sr-only">（目前步驟）</span>' : ""}</span>`;
  const reviewState = isConfirmedLatest ? "done" : analyzing || !r ? "" : "current";
  const lows = r ? r.findings.map((f, i) => [f, i]).filter(([f]) => f.confidence === "low") : [];
  const acked = new Set(isConfirmedLatest ? c.acknowledged : []);
  const editedCompose = isConfirmedLatest ? c.compose : null;
  const publicDefault = (isConfirmedLatest && c.public_service) || r?.services.find((s) => s.public)?.name || "";
  const suggest = r?.findings.find((f) => f.key === "suggest_root");

  $("#page").innerHTML = pageHeader(p.name,
    `${repoShort(p.repo_url)} · ${p.git_ref || p.branch || "預設分支"}${commitShort ? ` · ${commitShort}` : ""}${p.root ? ` · 根目錄 ${p.root}/` : ""}`,
    `<a class="c-btn" href="#projects">專案列表</a><button class="c-btn" id="pj-reanalyze" ${analyzing ? "disabled" : ""}>${icon("refresh")}<span>重新解析</span></button><button class="c-btn c-btn--danger" id="pj-delete">${icon("trash")}<span>刪除</span></button>`) +
    `<div class="l-row" role="list" aria-label="匯入步驟">${step(1, "選擇儲存庫", "done")}${step(2, "解析", analyzing ? "current" : r ? "done" : "")}${step(3, "確認設定", reviewState)}${step(4, "第一次驗證（尚未開放）", "")}</div>
    <div id="pj-banners" class="l-stack"></div>
    <div id="pj-body" class="l-stack"></div>`;

  const banners = [];
  if (analyzing) banners.push(`<div class="c-banner">${icon("loader")}<div class="c-banner__body"><strong>正在取得並解析儲存庫</strong><span class="u-small">通常在一分鐘內完成，這頁會自動更新。</span></div></div>`);
  if (p.status === "error") banners.push(`<div class="c-banner c-banner--danger">${icon("alert")}<div class="c-banner__body"><strong>解析失敗</strong><span class="u-small">${esc(p.error)}</span></div></div>`);
  if (c && a && !isConfirmedLatest && !analyzing) banners.push(`<div class="c-banner c-banner--warning">${icon("info")}<div class="c-banner__body"><strong>最新解析與已確認的版本不同</strong><span class="u-small">已確認的是 ${esc(c.commit.slice(0, 7))}（${relTime(c.confirmed_at)}）。確認下方的新結果後才會改用它。</span></div></div>`);
  if (r?.errors.length) banners.push(`<div class="c-banner c-banner--danger">${icon("alert")}<div class="c-banner__body"><strong>${r.errors.length} 個阻擋項</strong><span class="u-small">${r.errors.map(fmtMsg).join("<br>")}${r.compose === null && !suggest ? "<br>可以在下方編輯 compose 解決後再確認。" : ""}</span></div></div>`);
  if (suggest) {
    const dirs = [...suggest.message.matchAll(/`([^`]+)\/`/g)].map((m) => m[1]);
    banners.push(`<div class="c-banner c-banner--warning">${icon("info")}<div class="c-banner__body"><strong>根目錄沒有可解析的檔案</strong><span class="u-small">${fmtMsg(suggest.message)}</span><div class="l-row">${dirs.map((d) => `<button class="c-btn c-btn--sm" data-root="${esc(d)}">改用 ${esc(d)}/ 重新解析</button>`).join("")}</div></div></div>`);
  } else if (r && !isConfirmedLatest && lows.length) banners.push(`<div class="c-banner c-banner--warning">${icon("alert")}<div class="c-banner__body"><strong>${lows.length} 個項目需要你確認</strong><span class="u-small">低信心的判斷在第一次驗證前需要確認；請檢查後在「判斷與依據」勾選。</span></div></div>`);
  if (isConfirmedLatest) banners.push(`<div class="c-banner">${icon("check")}<div class="c-banner__body"><strong>已確認</strong><span class="u-small">${relTime(c.confirmed_at)} 確認${c.compose ? "（使用編輯過的 compose）" : ""}；對外服務 <code class="c-code">${esc(c.public_service)}</code>。驗證功能開放後會以這份設定執行。</span></div></div>`);
  $("#pj-banners").innerHTML = banners.join("");

  if (r) {
    const svcRows = r.services.map((s) => `<tr>
        <td class="c-table__primary u-mono">${esc(s.name)}</td><td>${esc(ROLE_LABEL[s.role] || s.role)}</td><td class="u-mono">${s.port ?? '<span class="u-muted">—</span>'}</td>
        <td>${s.role === "database" || s.role === "cache" ? '<span class="u-muted u-small">僅內部</span>' : `<label class="c-check"><input type="radio" name="pj-public" value="${esc(s.name)}" ${s.name === publicDefault ? "checked" : ""}><span class="u-sr-only">以 ${esc(s.name)} 為對外服務</span><span>路徑 /</span></label>`}</td></tr>`).join("");
    const pubFinding = r.findings.find((f) => f.key === "public_service");
    const findingRows = r.findings.map((f, i) => `<tr>
        <td>${statusPill("confidence", f.confidence)}</td>
        <td>${fmtMsg(f.message)}</td>
        <td>${f.evidence.map((ev) => evidenceLink(p, a.commit, ev)).join("<br>") || '<span class="u-muted">—</span>'}</td>
        <td>${f.confidence === "low" ? `<label class="c-check"><input type="checkbox" data-ack="${i}" ${acked.has(i) ? "checked" : ""}><span>我已確認</span></label>` : ""}</td></tr>`).join("");
    const envRows = r.env.map((e) => `<tr><td><span class="c-table__primary u-mono">${esc(e.name)}</span>${e.build_time ? ' <span class="c-badge" title="值在建置時寫入前端">建置時</span>' : ""}${e.varies_by_env ? ' <span class="c-badge c-badge--warning" title="staging 與 production 需各自建置">隨環境不同</span>' : ""}</td><td class="u-small ${e.provider === "user" ? "" : "u-muted"}">${esc(PROVIDER_LABEL[e.provider])}</td>
        <td>${e.evidence.map((ev) => evidenceLink(p, a.commit, ev)).join("<br>") || '<span class="u-muted">—</span>'}</td></tr>`).join("");
    const userVars = r.env.filter((e) => e.provider === "user").length;
    const composeText = editedCompose ?? r.compose;
    const sourceLabel = { override: `儲存庫的 ${r.source.file}`, compose: `沿用 ${r.source.file}`, dockerfile: `儲存庫的 Dockerfile`, template: `${r.source.template} 範本`, static: "靜態網站（nginx）", none: "找不到可解析的來源" }[r.source.kind];
    $("#pj-body").innerHTML = `
      <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">偵測到的服務</h2><span class="u-small u-muted">來源：${esc(sourceLabel)}${pubFinding ? ` · 對外服務信心 ${statusPill("confidence", pubFinding.confidence)}` : ""}</span></div>
        <div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
        <thead><tr><th>服務</th><th>類型</th><th>Port</th><th>對外</th></tr></thead>
        <tbody>${svcRows || `<tr><td colspan="4">${empty({ iconName: "inbox", title: "沒有服務", body: "請指定根目錄或在儲存庫加入 compose 檔。" })}</td></tr>`}</tbody></table></div></div></section>
      <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">判斷與依據</h2><span class="u-small u-muted">${r.findings.length} 項${lows.length ? `，${lows.length} 項低信心需確認` : ""}</span></div>
        <div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
        <thead><tr><th>信心</th><th>判斷</th><th>依據</th><th><span class="u-sr-only">確認</span></th></tr></thead><tbody>${findingRows}</tbody></table></div></div></section>
      <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">環境變數</h2><span class="u-small u-muted">${userVars} 個需要你提供；值的設定在秘密變數功能開放後提供</span></div>
        <div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
        <thead><tr><th>名稱</th><th>由誰提供</th><th>依據</th></tr></thead>
        <tbody>${envRows || `<tr><td colspan="3">${empty({ iconName: "inbox", title: "沒有偵測到環境變數" })}</td></tr>`}</tbody></table></div></div></section>
      <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">${editedCompose ? "compose（已編輯）" : "產生的 compose"}</h2><span class="l-spacer"></span><button class="c-btn c-btn--sm" id="pj-edit">編輯</button></div>
        <div class="c-card__body l-stack">${composeText ? `<pre class="c-log" aria-label="compose 檔">${esc(composeText)}</pre>` : `<p class="u-muted">解析有阻擋項，沒有產生 compose；請按「編輯」貼上修正後的版本。</p>`}
        <p class="u-small u-muted">已通過平臺 compose 政策。要固定這份設定，可放到儲存庫的 <code class="c-code">.caloud/compose.yml</code>。</p></div></section>
      <span class="c-field__error" id="pj-err" role="alert"></span>
      <div class="l-row"><span class="l-spacer"></span><span class="u-small u-muted" id="pj-hint"></span><button class="c-btn c-btn--primary" id="pj-confirm">${icon("check")}<span>${isConfirmedLatest ? "更新確認" : "確認設定"}</span></button></div>`;
  }

  let compose = editedCompose; // 用戶編輯版（null 表示使用產生的）
  const ackSet = () => $$("[data-ack]").filter((x) => x.checked).map((x) => Number(x.dataset.ack));
  const refreshConfirm = () => {
    const btn = $("#pj-confirm"); if (!btn) return;
    const missing = lows.length - ackSet().length;
    const noCompose = !compose && !r.compose;
    const noPublic = !$("[name='pj-public']:checked");
    btn.disabled = missing > 0 || noCompose || noPublic || analyzing;
    $("#pj-hint").textContent = missing > 0 ? `還有 ${missing} 個低信心項目未確認` : noCompose ? "請先編輯 compose 解決阻擋項" : noPublic ? "請選擇對外服務" : "";
  };
  $$("[data-ack], [name='pj-public']").forEach((x) => x.addEventListener("change", refreshConfirm));
  refreshConfirm();

  $("#pj-confirm")?.addEventListener("click", async (e) => {
    showMsg($("#pj-err"), null);
    try {
      await busy(e.currentTarget, api(`/api/projects/${id}/analysis`, { method: "PUT", body: { compose, public_service: $("[name='pj-public']:checked")?.value, acknowledged: ackSet() } }));
      toast("已確認解析結果");
      renderProject(id);
    } catch (err) { showMsg($("#pj-err"), err); }
  });
  $("#pj-edit")?.addEventListener("click", () => {
    const dr = drawer({ title: "編輯 compose", subtitle: "確認時以平臺 compose 政策檢查；不可使用 ports、主機路徑與 host 網路。" });
    dr.body.innerHTML = `<label class="c-field"><span class="c-field__label">compose.yml</span><textarea class="c-textarea" id="pe-yaml" spellcheck="false">${esc(compose ?? r.compose ?? "")}</textarea></label>`;
    dr.footer.classList.remove("u-hidden");
    dr.footer.innerHTML = `<button class="c-btn" id="pe-reset">還原為產生的版本</button><span class="l-spacer"></span><button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="pe-save">${icon("check")}<span>套用</span></button>`;
    $("#pe-reset", dr.el).disabled = !r.compose;
    $("#pe-reset", dr.el).addEventListener("click", () => { compose = null; dr.close(); redrawCompose(); });
    $("#pe-save", dr.el).addEventListener("click", () => { const v = $("#pe-yaml", dr.el).value; compose = v.trim() && v !== r.compose ? v : null; dr.close(); redrawCompose(); });
  });
  const redrawCompose = () => {
    const card = $("#pj-edit").closest(".c-card");
    $(".c-card__title", card).textContent = compose ? "compose（已編輯，確認時檢查）" : "產生的 compose";
    const body = $(".c-card__body", card);
    const text = compose ?? r.compose;
    body.firstElementChild.outerHTML = text ? `<pre class="c-log" aria-label="compose 檔">${esc(text)}</pre>` : `<p class="u-muted">解析有阻擋項，沒有產生 compose；請按「編輯」貼上修正後的版本。</p>`;
    refreshConfirm();
  };
  $("#pj-reanalyze").addEventListener("click", async (e) => {
    try { await busy(e.currentTarget, api(`/api/projects/${id}/analysis`, { method: "POST" })); renderProject(id); }
    catch (err) { toast(err.message, "danger"); }
  });
  $$("[data-root]").forEach((b) => b.addEventListener("click", async () => {
    try { await busy(b, api(`/api/projects/${id}`, { method: "PATCH", body: { root: b.dataset.root } })); renderProject(id); }
    catch (err) { toast(err.message, "danger"); }
  }));
  $("#pj-delete").addEventListener("click", async () => {
    if (!(await confirmDialog({ title: `刪除 ${p.name}？`, body: "解析紀錄與取得的原始碼會一併刪除，無法復原。", confirmText: "刪除專案" }))) return;
    try { await api(`/api/projects/${id}`, { method: "DELETE" }); toast(`已刪除 ${p.name}`); location.hash = "projects"; }
    catch (err) { toast(err.message, "danger"); }
  });
  if (analyzing) pollTimer = setTimeout(() => currentPage() === "projects" && pageArg() === id && renderProject(id), 2000);
}

// ─────────────── 網域 FR-DOM-* / FR-UI-06 / FR-UI-07 ───────────────
function routeState(d) {
  if (!d.verified || !d.app_id) return "none";
  return state.apps.find((a) => a.id === d.app_id)?.status === "running" ? "live" : "idle";
}
async function renderDomains() {
  $("#page").innerHTML = pageHeader("網域", "托管網域並轉發到 App。新增後依步驟設定 DNS、驗證擁有權，再綁定 App。",
    `<button class="c-btn c-btn--primary" id="new-dom">${icon("plus")}<span>新增網域</span></button>`) +
    `<section class="c-card"><div class="c-card__header"><label class="c-search">${icon("search")}<span class="u-sr-only">搜尋網域</span><input class="c-input" id="dom-q" placeholder="搜尋網域" value="${esc(state.domainQuery)}"></label></div>
    <div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>網域</th><th>驗證</th><th>轉發</th><th>TLS</th></tr></thead><tbody id="domains">${skeletonRows(4)}</tbody></table></div></div></section>
    <p class="c-msg c-msg--danger" id="domains-msg" role="alert"></p>`;
  $("#new-dom").addEventListener("click", () => openDomain(null));
  $("#dom-q").addEventListener("input", (e) => { state.domainQuery = e.target.value; drawDomains(); });
  try { await refresh("domains", "apps"); showMsg($("#domains-msg"), null); } catch (err) { return showMsg($("#domains-msg"), err); }
  drawDomains();
}
function drawDomains() {
  const tbody = $("#domains"); if (!tbody) return;
  const q = state.domainQuery.trim().toLowerCase();
  const list = state.domains.filter((d) => !q || d.hostname.includes(q));
  if (!state.domains.length) return (tbody.innerHTML = `<tr><td colspan="4">${empty({ iconName: "globe", title: "還沒有網域", body: "新增網域後，依步驟設定 DNS 即可把流量轉到 App。", action: `<button class="c-btn c-btn--primary" data-new>${icon("plus")}<span>新增網域</span></button>` })}</td></tr>`);
  if (!list.length) return (tbody.innerHTML = `<tr><td colspan="4">${empty({ iconName: "search", title: "沒有符合的網域" })}</td></tr>`);
  tbody.innerHTML = list.map((d) => `<tr class="is-clickable" data-host="${esc(d.hostname)}" tabindex="0">
    <td class="c-table__primary">${esc(d.hostname)}</td>
    <td>${statusPill("domain", d.verified)}</td>
    <td>${statusPill("route", routeState(d))}${d.app_id ? `<div class="c-table__secondary">${esc(appName(d.app_id))} → <span class="u-mono">${esc(d.service)}:${esc(d.port)}</span></div>` : ""}</td>
    <td>${d.tls_mode === "passthrough" ? statusPill("tls", "passthrough") : statusPill("tls", d.tls_status)}</td></tr>`).join("");
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#domains")) return;
  if (e.target.closest("[data-new]")) return openDomain(null);
  const tr = e.target.closest("tr[data-host]"); if (tr) openDomain(tr.dataset.host);
});

/** 網域設定精靈：1 輸入 → 2 DNS → 3 驗證 → 4 綁定（FR-UI-07） */
function openDomain(hostname) {
  let d = hostname ? state.domains.find((x) => x.hostname === hostname) : null;
  const dr = drawer({ title: hostname || "新增網域", subtitle: "依序完成以下步驟，網域就會開始轉發。", onClose: () => currentPage() === "domains" && renderDomains() });
  const stepClass = (n) => {
    const step = !d ? 1 : !d.verified ? 2 : 4;
    if (n < step || (n === 4 && d?.app_id)) return "is-done";
    if (n === step || (step === 2 && n === 3)) return "is-current";
    return "";
  };
  const index = (n) => `<span class="c-stepper__index">${stepClass(n) === "is-done" ? icon("check") : n}</span>`;
  const draw = () => {
    const appOpts = `<option value="">（不轉發）</option>` + state.apps.map((a) => `<option value="${esc(a.id)}" ${a.id === d?.app_id ? "selected" : ""}>${esc(a.name)}</option>`).join("");
    dr.body.innerHTML = `<ol class="c-stepper">
      <li class="c-stepper__step ${stepClass(1)}">${index(1)}<div class="c-stepper__content"><span class="c-stepper__label">輸入網域</span>
        ${d ? `<span class="u-mono">${esc(d.hostname)}</span>` : `<label class="c-field"><span class="u-sr-only">主機名稱</span><input class="c-input" id="dm-host" placeholder="app.example.com" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="c-field__error" id="dm-err" role="alert"></span></label><div><button class="c-btn c-btn--primary" id="dm-create">下一步</button></div>`}</div></li>
      <li class="c-stepper__step ${stepClass(2)}">${index(2)}<div class="c-stepper__content"><span class="c-stepper__label">設定 DNS</span>
        ${d && !d.verified ? `<p class="u-muted u-small">到你的 DNS 服務商新增以下兩筆紀錄：</p>
          <div class="c-field"><span class="c-label">A 紀錄 · 名稱</span>${copyField(d.hostname, "紀錄名稱")}<span class="c-field__hint">值為 Caloud 主機的 IP。</span></div>
          <div class="c-field"><span class="c-label">TXT 紀錄 · 名稱</span>${copyField("_caloud-challenge." + d.hostname, "紀錄名稱")}</div>
          <div class="c-field"><span class="c-label">TXT 紀錄 · 值</span>${copyField(d.verify_token, "驗證值")}</div>` : d ? '<span class="u-muted u-small">已完成</span>' : ""}</div></li>
      <li class="c-stepper__step ${stepClass(3)}">${index(3)}<div class="c-stepper__content"><span class="c-stepper__label">驗證擁有權</span>
        ${d && !d.verified ? `<p class="u-muted u-small">DNS 生效可能需要幾分鐘。</p><span class="c-field__error" id="dm-verr" role="alert"></span><div><button class="c-btn c-btn--primary" id="dm-verify">${icon("shield")}<span>驗證</span></button></div>` : d?.verified ? statusPill("domain", true) : ""}</div></li>
      <li class="c-stepper__step ${stepClass(4)}">${index(4)}<div class="c-stepper__content"><span class="c-stepper__label">綁定 App</span>
        ${d?.verified ? `<div class="l-grid">
            <label class="c-field"><span class="c-field__label">App</span><select class="c-select" id="dm-app">${appOpts}</select></label>
            <label class="c-field"><span class="c-field__label">Service</span><select class="c-select" id="dm-svc"></select></label>
            <label class="c-field"><span class="c-field__label">容器 port（HTTP）</span><input class="c-input" id="dm-port" inputmode="numeric" placeholder="80" value="${esc(d.port ?? "")}"></label></div>
          <label class="c-check"><input type="checkbox" id="dm-pass" ${d.tls_mode === "passthrough" ? "checked" : ""}><span>TLS 直通：443 的連線原封不動轉給 App，由 App 自己處理 HTTPS 與憑證</span></label>
          <label class="c-field ${d.tls_mode === "passthrough" ? "" : "u-hidden"}" id="dm-tls-field"><span class="c-field__label">App 的 TLS port</span><input class="c-input" id="dm-tls" inputmode="numeric" placeholder="443" value="${esc(d.tls_port ?? "")}"><span class="c-field__hint">HTTP port 仍會轉發，供 App 申請憑證（HTTP-01）。</span></label>
          <span class="c-field__error" id="dm-berr" role="alert"></span><div><button class="c-btn c-btn--primary" id="dm-bind">${icon("link")}<span>套用</span></button></div>` : ""}</div></li></ol>`;
    dr.footer.classList.toggle("u-hidden", !d);
    dr.footer.innerHTML = d ? `<button class="c-btn c-btn--danger" id="dm-del">${icon("trash")}<span>刪除網域</span></button><span class="l-spacer"></span><button class="c-btn" data-close>完成</button>` : "";
    wire();
  };
  const wire = () => {
    const host = $("#dm-host", dr.el);
    if (host) {
      host.focus();
      host.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#dm-create", dr.el).click(); });
      $("#dm-create", dr.el).addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        host.removeAttribute("aria-invalid"); showMsg($("#dm-err", dr.el), null);
        try { d = await busy(btn, api("/api/domains", { method: "POST", body: { hostname: host.value } })); state.domains.push(d); $(".c-drawer__title", dr.el).textContent = d.hostname; draw(); }
        catch (err) { host.setAttribute("aria-invalid", "true"); showMsg($("#dm-err", dr.el), err); }
      });
    }
    $("#dm-verify", dr.el)?.addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      showMsg($("#dm-verr", dr.el), null);
      try { d = await busy(btn, api(`/api/domains/${encodeURIComponent(d.hostname)}/verify`, { method: "POST" })); toast(`${d.hostname} 已驗證`); draw(); }
      catch (err) { showMsg($("#dm-verr", dr.el), err); }
    });
    const appSel = $("#dm-app", dr.el);
    if (appSel) {
      const fillSvc = async () => {
        const svc = $("#dm-svc", dr.el);
        if (!appSel.value) { svc.innerHTML = ""; svc.disabled = true; return; }
        svc.disabled = false; svc.innerHTML = "<option>載入中…</option>";
        try { const det = await api(`/api/apps/${appSel.value}`); svc.innerHTML = det.services.map((s) => `<option ${s === d.service ? "selected" : ""}>${esc(s)}</option>`).join(""); }
        catch (err) { svc.innerHTML = ""; showMsg($("#dm-berr", dr.el), err); }
      };
      appSel.addEventListener("change", fillSvc);
      $("#dm-pass", dr.el).addEventListener("change", (e) => $("#dm-tls-field", dr.el).classList.toggle("u-hidden", !e.target.checked));
      fillSvc();
      $("#dm-bind", dr.el).addEventListener("click", async (e) => {
        const btn = e.currentTarget, app_id = appSel.value || null;
        showMsg($("#dm-berr", dr.el), null);
        try {
          d = await busy(btn, api(`/api/domains/${encodeURIComponent(d.hostname)}/bind`, { method: "PUT", body: { app_id, service: app_id ? $("#dm-svc", dr.el).value : null, port: app_id ? Number($("#dm-port", dr.el).value) || null : null, tls_mode: $("#dm-pass", dr.el).checked ? "passthrough" : "none", tls_port: Number($("#dm-tls", dr.el).value) || null } }));
          toast(app_id ? `${d.hostname} 已轉發到 ${appName(app_id)}` : `${d.hostname} 已解除綁定`);
          draw();
        } catch (err) { showMsg($("#dm-berr", dr.el), err); }
      });
    }
    $("#dm-del", dr.el)?.addEventListener("click", async () => {
      if (!(await confirmDialog({ title: `刪除 ${d.hostname}？`, body: "此網域會立即停止轉發流量。", confirmText: "刪除網域" }))) return;
      try { await api(`/api/domains/${encodeURIComponent(d.hostname)}`, { method: "DELETE" }); toast(`已刪除 ${d.hostname}`); dr.close(); }
      catch (err) { toast(err.message, "danger"); }
    });
  };
  draw();
}

// ─────────────── 使用者 FR-USER-01～02 ───────────────
async function renderUsers() {
  $("#page").innerHTML = pageHeader("使用者", "以 CAFECA 身分登入的所有人。新使用者預設待核准，核准為 Member 後才能部署。") +
    `<div id="users-banner"></div><section class="c-card"><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">

    <p class="c-msg c-msg--danger" id="users-msg" role="alert"></p>`;

  const order = { pending: 0, super_admin: 1, admin: 2, member: 3, disabled: 4 };

  $("#users").innerHTML = [...state.users].sort((a, b) => order[a.role] - order[b.role]).map((u) => `<tr data-account="${esc(u.account)}">
    <td><div class="c-table__primary">${esc(u.handle || "（未提供代稱）")}${u.account === state.me.account ? ' <span class="u-muted u-small">（你）</span>' : ""}</div><div class="c-table__secondary u-mono" title="${esc(u.account)}">${esc(u.account)}</div></td>
    <td>${statusPill("role", u.role)}</td>
    <td class="u-muted u-small u-nowrap">${relTime(u.last_login)}</td>
    <td>${canEdit(u) ? `<label><span class="u-sr-only">變更 ${esc(u.handle || u.account)} 的角色</span><select class="c-select" data-role>${roles.map((r) => `<option value="${r}" ${r === u.role ? "selected" : ""}>${roleLabel(r)}</option>`).join("")}</select></label>` : ""}</td></tr>`).join("");
}
document.addEventListener("change", async (e) => {

// ─────────────── HTTPS 憑證 FR-OPS-03、FR-OPS-10、FR-DOM-05（ADR 0016） ───────────────
const PURPOSE_LABEL = { production: "Production", staging: "Staging", verify: "驗證", system: "系統" };
async function renderTls() {
  $("#page").innerHTML = pageHeader("HTTPS 憑證", "網域池設定 Cloudflare 權杖後，Caloud 以 DNS-01 申請 wildcard 憑證；已驗證並綁定 App 的網域以 HTTP-01 申請。到期前 30 天自動續簽。",
    `<button class="c-btn c-btn--primary" id="new-pool">${icon("plus")}<span>新增網域池</span></button>`) +
    `<section class="c-card"><div class="c-card__header"><h2 class="c-card__title">網域池</h2></div><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>根網域</th><th>用途</th><th>Cloudflare 權杖</th><th><span class="u-sr-only">操作</span></th></tr></thead><tbody id="pools">${skeletonRows(4)}</tbody></table></div></div></section>
    <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">憑證</h2></div><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>名稱</th><th>方式</th><th>狀態</th><th>到期</th></tr></thead><tbody id="certs">${skeletonRows(4)}</tbody></table></div></div></section>
    <p class="c-msg c-msg--danger" id="tls-msg" role="alert"></p>`;
  $("#new-pool").addEventListener("click", () => openPool(null));
  let pools, certs;
  try { [pools, certs] = await Promise.all([api("/api/admin/domain-pools"), api("/api/admin/certificates")]); showMsg($("#tls-msg"), null); }
  catch (err) { return showMsg($("#tls-msg"), err); }
  state.pools = pools;
  $("#pools").innerHTML = pools.map((p) => `<tr data-root="${esc(p.root)}">
      <td><div class="c-table__primary u-mono">${esc(p.root)}</div><div class="c-table__secondary">${p.cloudflare_zone ? `zone ${esc(p.cloudflare_zone)}` : "未設定 Cloudflare zone"}</div></td>
      <td class="u-small">${p.purposes.map((x) => esc(PURPOSE_LABEL[x] || x)).join("、")}</td>
      <td class="u-small">${p.cloudflare_token_hint ? `<span class="u-mono">${esc(p.cloudflare_token_hint)}</span>` : '<span class="u-muted">未設定</span>'}</td>
      <td><div class="c-table__actions"><button class="c-btn c-btn--sm" data-edit-pool>${icon("key")}<span>設定</span></button></div></td></tr>`).join("")
    || `<tr><td colspan="4">${empty({ iconName: "globe", title: "還沒有網域池", body: "新增根網域（例如 caloud.tw）並設定 Cloudflare 權杖，即可為環境網址自動申請 HTTPS 憑證。" })}</td></tr>`;
  $("#certs").innerHTML = certs.map((c) => `<tr>
      <td><div class="c-table__primary u-mono">${esc(c.name)}</div><div class="c-table__secondary u-mono">${c.names.map(esc).join(", ")}</div>${c.error ? `<p class="c-msg c-msg--danger">${esc(c.error)}</p>` : ""}</td>
      <td class="u-small">${c.kind === "dns01" ? "DNS-01（Cloudflare）" : "HTTP-01"}${c.staging ? ' <span class="c-badge c-badge--warning">staging</span>' : ""}</td>
      <td>${statusPill("tls", c.status)}${c.next_attempt ? `<div class="c-table__secondary">下次重試 ${relTime(c.next_attempt)}</div>` : ""}</td>
      <td class="u-small u-nowrap">${c.not_after ? relTime(c.not_after) : "—"}</td></tr>`).join("")
    || `<tr><td colspan="4">${empty({ iconName: "shield", title: "還沒有憑證", body: "設定網域池權杖，或驗證並綁定網域後，憑證會在數分鐘內出現在這裡。" })}</td></tr>`;
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest("#pools [data-edit-pool]"); if (!btn) return;
  openPool(state.pools.find((p) => p.root === btn.closest("tr").dataset.root));
});
function openPool(p) {
  const dr = drawer({ title: p ? `網域池 ${p.root}` : "新增網域池", subtitle: "權杖只會加密保存，之後只顯示末 4 碼。", onClose: () => currentPage() === "tls" && renderTls() });
  const purposes = p ? p.purposes : ["production", "staging", "verify"];
  dr.body.innerHTML = `
    ${p ? "" : `<label class="c-field"><span class="c-field__label">根網域</span><input class="c-input u-mono" id="pl-root" placeholder="caloud.tw" autocomplete="off" spellcheck="false"></label>`}
    <div class="c-field"><span class="c-field__label">用途</span>${Object.keys(PURPOSE_LABEL).map((k) => `<label class="c-check"><input type="checkbox" data-purpose="${k}" ${purposes.includes(k) ? "checked" : ""}><span>${PURPOSE_LABEL[k]}</span></label>`).join("")}</div>
    <label class="c-field"><span class="c-field__label">Cloudflare zone</span><input class="c-input u-mono" id="pl-zone" value="${esc(p?.cloudflare_zone || "")}" placeholder="caloud.tw" autocomplete="off" spellcheck="false"></label>
    <label class="c-field"><span class="c-field__label">Cloudflare API 權杖${p?.cloudflare_token_hint ? `（目前 ${esc(p.cloudflare_token_hint)}）` : ""}</span><input class="c-input u-mono" type="password" id="pl-token" autocomplete="off" spellcheck="false" placeholder="${p?.cloudflare_token_hint ? "留空表示不變" : "選填"}"><span class="c-field__hint">需要該 zone 的「DNS 編輯」權限。儲存前 Caloud 會先向 Cloudflare 驗證。</span></label>
    ${p?.cloudflare_token_hint ? `<label class="c-check"><input type="checkbox" id="pl-clear"><span>清除權杖（停止申請 wildcard 憑證）</span></label>` : ""}
    <span class="c-field__error" id="pl-err" role="alert"></span>`;
  dr.footer.classList.remove("u-hidden");
  dr.footer.innerHTML = `<button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="pl-submit">${icon("check")}<span>儲存</span></button>`;
  $("#pl-submit", dr.el).addEventListener("click", async (e) => {
    showMsg($("#pl-err", dr.el), null);
    const body = { purposes: $$("[data-purpose]", dr.el).filter((c) => c.checked).map((c) => c.dataset.purpose), cloudflare_zone: $("#pl-zone", dr.el).value.trim() || null };
    const token = $("#pl-token", dr.el).value.trim();
    if ($("#pl-clear", dr.el)?.checked) body.cloudflare_token = "";
    else if (token) body.cloudflare_token = token;
    try {
      if (p) await busy(e.currentTarget, api(`/api/admin/domain-pools/${encodeURIComponent(p.root)}`, { method: "PUT", body }));
      else await busy(e.currentTarget, api("/api/admin/domain-pools", { method: "POST", body: { root: $("#pl-root", dr.el).value.trim(), ...body } }));
      toast("已儲存網域池"); dr.close();
    } catch (err) { showMsg($("#pl-err", dr.el), err); }
  });
}

// ─────────────── API 權杖與 MCP FR-MCP-02／08 ───────────────
const mcpUrl = () => `${location.origin}/mcp`;
async function renderTokens() {
  $("#page").innerHTML = pageHeader("API 權杖", "讓 AI 助手透過 MCP 以你的身分操作 Caloud。權杖權限與你的角色相同，請像密碼一樣保管。",
    `<button class="c-btn c-btn--primary" id="new-token">${icon("plus")}<span>建立權杖</span></button>`) +
    `<section class="c-card"><div class="c-card__header"><h2 class="c-card__title">MCP 端點</h2></div><div class="c-card__body">
      ${copyField(mcpUrl(), "MCP 端點")}
      <p class="u-muted u-small">傳輸方式為 Streamable HTTP，以 <code class="c-code">Authorization: Bearer &lt;權杖&gt;</code> 驗證。建立權杖後會顯示用戶端設定範例。</p>
    </div></section>
    <section class="c-card"><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>名稱</th><th>建立</th><th>最後使用</th><th>到期</th><th><span class="u-sr-only">操作</span></th></tr></thead>
      <tbody id="tokens">${skeletonRows(5)}</tbody></table></div></div></section>
    <p class="c-msg c-msg--danger" id="tokens-msg" role="alert"></p>`;
  $("#new-token").addEventListener("click", openNewToken);
  let list;
  try { list = await api("/api/tokens"); showMsg($("#tokens-msg"), null); } catch (err) { return showMsg($("#tokens-msg"), err); }
  const now = Date.now() / 1000;
  $("#tokens").innerHTML = list.map((t) => `<tr data-id="${esc(t.id)}">
      <td><div class="c-table__primary">${esc(t.name)}</div><div class="c-table__secondary u-mono">${esc(t.prefix)}…</div></td>
      <td class="u-muted u-small u-nowrap">${relTime(t.created_at)}</td>
      <td class="u-muted u-small u-nowrap">${t.last_used_at ? relTime(t.last_used_at) : "從未使用"}</td>
      <td class="u-small u-nowrap">${t.expires_at < now ? '<span class="c-badge c-badge--danger"><span class="c-badge__dot" aria-hidden="true"></span>已過期</span>' : relTime(t.expires_at)}</td>
      <td><div class="c-table__actions"><button class="c-btn c-btn--ghost c-btn--icon c-btn--sm c-btn--danger" data-revoke aria-label="撤銷 ${esc(t.name)}" title="撤銷">${icon("trash")}</button></div></td></tr>`).join("")
    || `<tr><td colspan="5">${empty({ iconName: "key", title: "還沒有 API 權杖", body: "建立權杖後，就能在 Claude 等 MCP 用戶端部署 App、查 log、設定網域。", action: `<button class="c-btn c-btn--primary" data-new-token>${icon("plus")}<span>建立權杖</span></button>` })}</td></tr>`;
}
document.addEventListener("click", async (e) => {
  if (!e.target.closest("#tokens")) return;
  if (e.target.closest("[data-new-token]")) return openNewToken();
  const btn = e.target.closest("[data-revoke]"); if (!btn) return;
  const tr = btn.closest("tr"), name = tr.querySelector(".c-table__primary").textContent;
  if (!(await confirmDialog({ title: `撤銷 ${name}？`, body: "使用此權杖的 MCP 用戶端會立即無法連線。", confirmText: "撤銷權杖" }))) return;
  try { await api(`/api/tokens/${tr.dataset.id}`, { method: "DELETE" }); toast(`已撤銷 ${name}`); renderTokens(); }
  catch (err) { toast(err.message, "danger"); }
});
function openNewToken() {
  const dr = drawer({ title: "建立 API 權杖", subtitle: "權杖只會顯示一次，請立即複製到 MCP 用戶端。", onClose: () => currentPage() === "tokens" && renderTokens() });
  dr.body.innerHTML = `
    <label class="c-field"><span class="c-field__label">名稱</span><input class="c-input" id="tk-name" placeholder="例如 Claude Desktop" maxlength="60" autocomplete="off"><span class="c-field__hint">用來辨識是哪個用戶端，稽核紀錄會標示此名稱。</span><span class="c-field__error" id="tk-err" role="alert"></span></label>
    <label class="c-field"><span class="c-field__label">有效期限</span><select class="c-select" id="tk-days"><option value="30">30 天</option><option value="90" selected>90 天</option><option value="180">180 天</option><option value="365">365 天</option></select></label>`;
  dr.footer.classList.remove("u-hidden");
  dr.footer.innerHTML = `<button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="tk-submit">${icon("key")}<span>建立權杖</span></button>`;
  $("#tk-name", dr.el).focus();
  $("#tk-submit", dr.el).addEventListener("click", async (e) => {
    const btn = e.currentTarget, input = $("#tk-name", dr.el);
    showMsg($("#tk-err", dr.el), null); input.removeAttribute("aria-invalid");
    try {
      const res = await busy(btn, api("/api/tokens", { method: "POST", body: { name: input.value, expires_in_days: Number($("#tk-days", dr.el).value) } }));
      const claudeCode = `claude mcp add --transport http caloud ${mcpUrl()} --header "Authorization: Bearer ${res.token}"`;
      const mcpJson = JSON.stringify({ mcpServers: { caloud: { type: "http", url: mcpUrl(), headers: { Authorization: `Bearer ${res.token}` } } } }, null, 2);
      dr.body.innerHTML = `
        <div class="c-banner c-banner--warning">${icon("alert")}<div class="c-banner__body"><strong>權杖只顯示這一次</strong><span class="u-small">關閉後無法再查看。遺失時請撤銷並重新建立。</span></div></div>
        <div class="c-field"><span class="c-label">權杖 · ${esc(res.api_token.name)}</span>${copyField(res.token, "權杖")}</div>
        <div class="c-field"><span class="c-label">Claude Code</span>${copyField(claudeCode, "指令")}</div>
        <div class="c-field"><div class="l-row"><span class="c-label">.mcp.json（其他支援 HTTP 傳輸的 MCP 用戶端）</span><span class="l-spacer"></span><button class="c-btn c-btn--ghost c-btn--sm" data-copy="${esc(mcpJson)}" data-copy-label="設定">${icon("copy")}<span>複製</span></button></div><pre class="c-log">${esc(mcpJson)}</pre></div>`;
      dr.footer.innerHTML = `<span class="l-spacer"></span><button class="c-btn c-btn--primary" data-close>我已複製，完成</button>`;
    } catch (err) { input.setAttribute("aria-invalid", "true"); showMsg($("#tk-err", dr.el), err); }
  });
}

// ─────────────── 啟動 ───────────────
async function boot() {
  try { state.me ??= await api("/api/me"); } catch {
    $("#login").classList.remove("u-hidden");
    loadSdk().then((c) => (state.cafeca = c), (err) => showMsg($("#login-msg"), err)); // 預先載入，點擊時才能同步開窗
    return;
  }
  if (state.me.role === "pending") { // FR-USER-04
    $("#login").classList.remove("u-hidden");
    $("#login").innerHTML = `<section class="c-login__panel"><img class="c-login__mark" src="/assets/ds/logo.svg" alt="" aria-hidden="true"><h1 class="c-login__title">等待核准</h1><p class="c-login__desc">你的帳戶已建立。管理員核准後，就能部署 App 與托管網域。</p><button class="c-btn" id="pending-logout">${icon("logout")}<span>登出</span></button></section>`;
    $("#pending-logout").addEventListener("click", async () => { await api("/api/auth/logout", { method: "POST" }); location.replace("/"); });
    return;
  }
  $("#login").classList.add("u-hidden");
  $("#shell").classList.remove("u-hidden");
  if (isAdmin()) state.users = await api("/api/users").catch(() => []);
  renderShell();
  route();
}
boot();
</script>
</body>
