<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caloud</title>
<link rel="icon" type="image/svg+xml" href="/assets/ds/logo.svg">
<link rel="stylesheet" href="/assets/ds/tokens.css">
<link rel="stylesheet" href="/assets/ds/theme.css">
<link rel="stylesheet" href="/assets/ds/components.css">
<script src="/assets/ds/ui.js"></script>
<script>UI.initTheme();</script>
</head>
<body>

<!-- FR-AUTH-01 登入 -->
<main class="c-login u-hidden" id="login">
  <section class="c-login__panel">
    <img class="c-login__mark" src="/assets/ds/logo.svg" alt="" aria-hidden="true">
    <h1 class="c-login__title">登入 Caloud</h1>
    <p class="c-login__desc" id="login-desc">使用 CAFECA 身分登入。</p>
    <button class="c-btn c-btn--primary" id="login-btn">以 CAFECA 登入</button>
    <p class="c-msg c-msg--danger" id="login-msg" role="alert"></p>
  </section>
</main>

<!-- FR-UI-11 AppShell -->
<div class="c-shell u-hidden" id="shell">
  <aside class="c-sidebar">
    <div class="c-sidebar__brand"><img class="c-sidebar__mark" src="/assets/ds/logo.svg" alt="" aria-hidden="true">Caloud</div>
    <nav class="c-sidebar__nav" aria-label="主要導覽" id="nav"></nav>
    <div class="c-sidebar__footer">
      <div class="c-account" id="account"></div>
      <p class="u-small u-muted" id="build-info"></p>
      <div class="l-row">
        <button class="c-btn c-btn--ghost c-btn--sm" id="theme-btn" aria-label="切換淺色／深色"></button>
        <button class="c-btn c-btn--ghost c-btn--sm" id="logout-btn"></button>
      </div>
    </div>
  </aside>
  <main class="c-shell__main"><div id="stale-banner"></div><div class="c-page" id="page"></div></main>
</div>

<script>
"use strict";
const { $, $$, esc, api, relTime, statusPill, showMsg, toast, confirmDialog, drawer, busy, copyField, empty, skeletonRows, icon } = UI;

// ─────────────── 狀態 ───────────────
const state = { me: null, apps: [], domains: [], users: [], cafeca: null, appFilter: "all", appQuery: "", domainQuery: "" };
const isAdmin = () => ["super_admin", "admin"].includes(state.me?.role);
const appName = (id) => state.apps.find((a) => a.id === id)?.name ?? "（已刪除）";
const roleLabel = (r) => ({ super_admin: "Super Admin", admin: "Admin", member: "Member", pending: "待核准", disabled: "已停用" }[r] || r);
const currentPage = () => (location.hash.slice(1) || "overview").split("/")[0];
const pageArg = () => decodeURIComponent(location.hash.slice(1).split("/")[1] || "");
/** `#projects/<id>/verifications/<vid>` 的 vid */
const pageSub = () => (location.hash.slice(1).split("/")[2] === "verifications" ? decodeURIComponent(location.hash.slice(1).split("/")[3] || "") : "");

// ─────────────── 登入 FR-AUTH-01 ───────────────
async function loadSdk() {
  const cfg = await api("/api/auth/config");
  // ADR 0024：只在還沒有任何使用者時說明 Super Admin
  if (cfg.first_user) $("#login-desc").textContent = "使用 CAFECA 身分登入。系統還沒有使用者，第一位登入的人會成為 Super Admin。";
  await new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = cfg.wallet + "/sdk/cafeca-connect.js";
    s.onload = ok;
    s.onerror = () => fail(new Error("無法載入 CAFECA 登入元件，請檢查網路後重新整理。"));
    document.head.append(s);
  });
  return CafecaConnect.create({ wallet: cfg.wallet });
}
$("#login-btn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  showMsg($("#login-msg"), null);
  if (!state.cafeca) return showMsg($("#login-msg"), new Error("登入元件載入中，請稍候再按一次。"));
  try {
    // signIn 必須在點擊事件中同步呼叫（之前不可 await），否則彈出視窗會被擋下
    const response = await state.cafeca.signIn({
      nonce: () => api("/api/auth/nonce", { method: "POST" }).then((j) => j.nonce),
      statement: "登入 Caloud 管理介面",
      claims: ["handle"],
    });
    state.me = await busy(btn, api("/api/auth/login", { method: "POST", body: response }));
    boot();
  } catch (err) { showMsg($("#login-msg"), err); }
});

// ─────────────── AppShell FR-UI-11 ───────────────
const PAGES = [
  { id: "overview", label: "總覽", icon: "home", render: renderOverview },
  { id: "projects", label: "專案", icon: "branch", render: renderProjects },
  { id: "apps", label: "Apps", icon: "box", render: renderApps },
  { id: "domains", label: "網域", icon: "globe", render: renderDomains },
  { id: "users", label: "使用者", icon: "users", render: renderUsers, admin: true },
  { id: "nodes", label: "Runner 節點", icon: "box", render: renderNodes, admin: true },
  { id: "tls", label: "HTTPS 憑證", icon: "shield", render: renderTls, admin: true },
  { id: "github", label: "GitHub App", icon: "key", render: renderGithubApp, admin: true },
  { id: "tokens", label: "API 權杖", icon: "key", render: renderTokens },
];
function renderShell() {
  const pendingUsers = state.users.filter((u) => u.role === "pending").length;
  $("#nav").innerHTML = PAGES.filter((p) => !p.admin || isAdmin()).map((p) =>
    `<a class="c-sidebar__item" href="#${p.id}" data-page="${p.id}">${icon(p.icon)}<span>${p.label}</span>${p.id === "users" && pendingUsers ? `<span class="c-sidebar__count" aria-label="${pendingUsers} 位待核准">${pendingUsers}</span>` : ""}</a>`).join("");
  const m = state.me;
  $("#account").innerHTML = `<span class="c-account__avatar" aria-hidden="true"></span><span class="c-account__text"><span class="c-account__name" title="${esc(m.account)}">${esc(m.handle || m.account.slice(0, 6) + "…" + m.account.slice(-4))}</span><span class="c-account__role">${esc(roleLabel(m.role))}</span></span>`;
  $("#theme-btn").innerHTML = `${icon("moon")}<span>主題</span>`;
  $("#logout-btn").innerHTML = `${icon("logout")}<span>登出</span>`;
  markNav();
}
function markNav() {
  $$(".c-sidebar__item").forEach((a) => {
    const on = a.dataset.page === currentPage();
    a.classList.toggle("is-active", on);
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
}
$("#theme-btn").addEventListener("click", UI.toggleTheme);
$("#logout-btn").addEventListener("click", async () => { await api("/api/auth/logout", { method: "POST" }); location.replace("/"); });

function route() {
  if (currentPage() === "github-complete") return completeGithub();
  const page = PAGES.find((p) => p.id === currentPage() && (!p.admin || isAdmin())) || PAGES[0];
  markNav();
  document.title = `${page.label} · Caloud`;
  page.render();
}
window.addEventListener("hashchange", route);

function pageHeader(title, desc, actions = "") {
  return `<header class="c-page-header"><div class="c-page-header__text"><h1 class="c-page-header__title">${esc(title)}</h1><p class="c-page-header__desc">${esc(desc)}</p></div>${actions ? `<div class="c-page-header__actions">${actions}</div>` : ""}</header>`;
}

async function refresh(...what) {
  const jobs = { apps: () => api("/api/apps"), domains: () => api("/api/domains"), users: () => (isAdmin() ? api("/api/users") : []) };
  const res = await Promise.all(what.map((k) => jobs[k]()));
  what.forEach((k, i) => (state[k] = res[i]));
}

// ─────────────── 總覽 FR-UI-09 ───────────────
async function renderOverview() {
  const page = $("#page");
  page.innerHTML = pageHeader("總覽", "所有 App 與網域的目前狀態，以及需要你處理的事項。") +
    `<div class="l-grid" id="stats">${Array(4).fill('<div class="c-stat"><span class="c-skeleton"></span><span class="c-skeleton"></span></div>').join("")}</div><div id="todo"></div>`;
  try { await refresh("apps", "domains", "users"); renderShell(); }
  catch (err) { return page.insertAdjacentHTML("beforeend", `<p class="c-msg c-msg--danger" role="alert">${esc(err.message)}</p>`); }
  const running = state.apps.filter((a) => a.status === "running").length;
  const failed = state.apps.filter((a) => a.status === "failed");
  const live = state.domains.filter((d) => routeState(d) === "live").length;
  const unverified = state.domains.filter((d) => !d.verified);
  const unbound = state.domains.filter((d) => d.verified && !d.app_id);
  const pending = state.users.filter((u) => u.role === "pending");
  const todoCount = failed.length + unverified.length + unbound.length + pending.length;
  const stat = (label, value, total, meta, href) => `<a class="c-stat" href="${href}"><span class="c-stat__label">${label}</span><span class="c-stat__value">${value}${total !== null ? `<span class="u-muted u-small"> / ${total}</span>` : ""}</span><span class="c-stat__meta">${meta}</span></a>`;
  $("#stats").innerHTML =
    stat("運作中的 App", running, state.apps.length, failed.length ? `${statusPill("app", "failed")} ${failed.length} 個` : "沒有失敗的 App", "#apps") +
    stat("轉發中的網域", live, state.domains.length, unverified.length ? `${statusPill("domain", false)} ${unverified.length} 個` : "全部已驗證", "#domains") +
    stat("待處理", todoCount, null, todoCount ? "見下方清單" : "目前沒有", "#overview") +
    (isAdmin() ? stat("使用者", state.users.length, null, pending.length ? `${statusPill("role", "pending")} ${pending.length} 位` : "沒有待核准", "#users") : "");
  const projects = await api("/api/projects").catch(() => []);
  const badVerify = projects.filter((p) => ["failed", "error"].includes(p.verify_status));
  const items = [
    ...badVerify.map((p) => ({ tone: "danger", icon: "alert", title: `${p.name} 驗證未通過`, body: "查看驗證報告中的 Blocker 與 High 問題。", href: `#projects/${p.id}`, action: "查看" })),
    ...failed.map((a) => ({ tone: "danger", icon: "alert", title: `${a.name} 部署失敗`, body: a.last_error || "請查看 log 了解原因。", href: "#apps", action: "查看" })),
    ...unverified.map((d) => ({ tone: "warning", icon: "globe", title: `${d.hostname} 尚未驗證`, body: "設定 DNS TXT 紀錄後按「驗證」。", href: "#domains", action: "前往設定" })),
    ...unbound.map((d) => ({ tone: "", icon: "link", title: `${d.hostname} 尚未綁定 App`, body: "選擇要轉發的 App 與 port。", href: "#domains", action: "綁定" })),
    ...pending.map((u) => ({ tone: "warning", icon: "users", title: `${u.handle || u.account.slice(0, 10) + "…"} 等待核准`, body: "核准後才能部署 App 與托管網域。", href: "#users", action: "審核" })),
  ];
  $("#todo").innerHTML = `<section class="c-card"><div class="c-card__header"><h2 class="c-card__title">需要處理</h2></div><div class="c-card__body">${
    items.length
      ? items.map((i) => `<div class="c-banner ${i.tone ? "c-banner--" + i.tone : ""}">${icon(i.icon)}<div class="c-banner__body"><strong>${esc(i.title)}</strong><span class="u-muted u-small">${esc(i.body)}</span></div><a class="c-btn c-btn--sm" href="${i.href}">${i.action}</a></div>`).join("")
      : empty({ iconName: "check", title: "目前沒有待處理事項", body: "所有 App 與網域都運作正常。" })}</div></section>`;
}

// ─────────────── Apps FR-APP-* / FR-UI-08 / FR-UI-10 ───────────────
let pollTimer = null;
async function renderApps() {
  $("#page").innerHTML = pageHeader("Apps", "每個 App 是一份 docker compose。上傳後立即部署，再到「網域」把流量轉過來。",
    `<button class="c-btn c-btn--primary" id="new-app">${icon("plus")}<span>新增 App</span></button>`) +
    `<section class="c-card"><div class="c-card__header">
      <label class="c-search">${icon("search")}<span class="u-sr-only">搜尋 App</span><input class="c-input" id="app-q" placeholder="搜尋名稱" value="${esc(state.appQuery)}"></label>
      <div class="c-segmented" role="group" aria-label="狀態篩選" id="app-filter">${[["all", "全部"], ["running", "運作中"], ["deploying", "部署中"], ["failed", "失敗"], ["stopped", "已停止"]].map(([v, l]) => `<button class="c-segmented__item ${state.appFilter === v ? "is-active" : ""}" data-v="${v}" aria-pressed="${state.appFilter === v}">${l}</button>`).join("")}</div>
    </div><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>名稱</th><th>狀態</th><th>網域</th><th>更新</th><th><span class="u-sr-only">操作</span></th></tr></thead>
      <tbody id="apps">${skeletonRows(5)}</tbody></table></div></div></section>
    <p class="c-msg c-msg--danger" id="apps-msg" role="alert"></p>`;
  $("#new-app").addEventListener("click", openNewApp);
  $("#app-q").addEventListener("input", (e) => { state.appQuery = e.target.value; drawApps(); });
  $("#app-filter").addEventListener("click", (e) => {
    const b = e.target.closest("[data-v]"); if (!b) return;
    state.appFilter = b.dataset.v;
    $$("#app-filter .c-segmented__item").forEach((x) => { x.classList.toggle("is-active", x === b); x.setAttribute("aria-pressed", x === b); });
    drawApps();
  });
  await loadApps();
}
async function loadApps() {
  try { await refresh("apps", "domains"); if ($("#apps-msg")) showMsg($("#apps-msg"), null); }
  catch (err) { return $("#apps-msg") ? showMsg($("#apps-msg"), err) : toast(err.message, "danger"); }
  drawApps();
  clearTimeout(pollTimer); // FR-UI-02
  if (state.apps.some((a) => a.status === "deploying") && currentPage() === "apps") pollTimer = setTimeout(loadApps, 3000);
}
function drawApps() {
  const tbody = $("#apps"); if (!tbody) return;
  const q = state.appQuery.trim().toLowerCase();
  const list = state.apps.filter((a) => (state.appFilter === "all" || a.status === state.appFilter) && (!q || a.name.toLowerCase().includes(q)));
  if (!state.apps.length) return (tbody.innerHTML = `<tr><td colspan="5">${empty({ iconName: "box", title: "還沒有 App", body: "上傳一份 docker compose 檔，Caloud 會立即啟動容器。", action: `<button class="c-btn c-btn--primary" data-act="new">${icon("plus")}<span>新增 App</span></button>` })}</td></tr>`);
  if (!list.length) return (tbody.innerHTML = `<tr><td colspan="5">${empty({ iconName: "search", title: "沒有符合條件的 App", body: "調整搜尋文字或狀態篩選。" })}</td></tr>`);
  tbody.innerHTML = list.map((a) => {
    const doms = state.domains.filter((d) => d.app_id === a.id);
    return `<tr class="is-clickable" data-id="${esc(a.id)}" tabindex="0">
      <td><div class="c-table__primary">${esc(a.name)}</div><div class="c-table__secondary u-mono">${esc(a.id.slice(0, 8))}</div></td>
      <td>${statusPill("app", a.status)}${a.last_error ? `<div class="c-table__secondary u-truncate" title="${esc(a.last_error)}">${esc(a.last_error)}</div>` : ""}</td>
      <td class="u-small">${doms.length ? doms.map((d) => esc(d.hostname)).join("<br>") : '<span class="u-muted">—</span>'}</td>
      <td class="u-muted u-small u-nowrap">${relTime(a.updated_at)}</td>
      <td><div class="c-table__actions">
        <button class="c-btn c-btn--ghost c-btn--icon c-btn--sm" data-act="deploy" aria-label="部署 ${esc(a.name)}" title="部署">${icon(a.status === "running" ? "refresh" : "play")}</button>
        <button class="c-btn c-btn--ghost c-btn--icon c-btn--sm" data-act="stop" aria-label="停止 ${esc(a.name)}" title="停止" ${a.status === "stopped" ? "disabled" : ""}>${icon("stop")}</button>
        <button class="c-btn c-btn--ghost c-btn--icon c-btn--sm c-btn--danger" data-act="delete" aria-label="刪除 ${esc(a.name)}" title="刪除">${icon("trash")}</button>
      </div></td></tr>`;
  }).join("");
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#apps")) return;
  const btn = e.target.closest("[data-act]");
  if (btn?.dataset.act === "new") return openNewApp();
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  const app = state.apps.find((a) => a.id === tr.dataset.id);
  if (!btn) return openApp(app.id);
  appAction(btn.dataset.act, app, btn);
});
// 可點擊的表格列：Enter 開啟
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches?.("tr.is-clickable")) e.target.click(); });

// ─────────────── 版本（FR-OPS-15，ADR 0023） ───────────────
const BUILD = document.querySelector('meta[name="caloud-build"]')?.content || "dev";
$("#build-info").textContent = `版本 ${BUILD}`;
window.addEventListener("caloud:stale", (e) => {
  const box = $("#stale-banner");
  if (!box || box.dataset.build === e.detail) return;
  box.dataset.build = e.detail;
  box.innerHTML = `<div class="c-banner c-banner--warning" role="status">${icon("info")}<div class="c-banner__body"><strong>Caloud 已更新到 ${esc(e.detail)}</strong><span class="u-small">這個頁面仍是 ${esc(BUILD)}，重新整理以載入新版。</span></div><button class="c-btn c-btn--sm" id="stale-reload">${icon("refresh")}<span>重新整理</span></button></div>`;
  $("#stale-reload").addEventListener("click", () => location.reload());
});

async function appAction(act, app, btn) {
  try {
    if (act === "delete") {
      if (!(await confirmDialog({ title: `刪除 ${app.name}？`, body: "容器會被移除，綁定的網域會停止轉發。資料 volume 會保留。", confirmText: "刪除 App" }))) return false;
      await api(`/api/apps/${app.id}`, { method: "DELETE" });
      toast(`已刪除 ${app.name}`);
    } else {
      await busy(btn, api(`/api/apps/${app.id}/${act}`, { method: "POST" }));
      toast(act === "deploy" ? `${app.name} 開始部署` : `已停止 ${app.name}`);
    }
    await loadApps();
    return true;
  } catch (err) { toast(err.message, "danger"); return false; }
}

const parseList = (v) => v.split(/[\s,，]+/).map((x) => x.trim()).filter(Boolean);
const envHint = (app) => app.env_keys?.length ? `目前變數：${app.env_keys.join("、")}。留空表示不變。` : "每行 KEY=value；存檔後只顯示變數名稱。";

/** FR-APP-01、FR-APP-13～16：上傳 compose 或（Admin）從 Git 儲存庫建立 */
function openNewApp() {
  const dr = drawer({ title: "新增 App", subtitle: "上傳 compose 檔或從 Git 儲存庫建立，建立後立即部署。" });
  const sources = [["compose", "上傳 compose"], ...(isAdmin() ? [["git", "Git 儲存庫"]] : [])];
  dr.body.innerHTML = `
    ${sources.length > 1 ? `<div class="c-segmented" role="group" aria-label="來源" id="na-source">${sources.map(([v, l], i) => `<button class="c-segmented__item ${i ? "" : "is-active"}" data-v="${v}" aria-pressed="${!i}">${l}</button>`).join("")}</div>` : ""}
    <label class="c-field"><span class="c-field__label">名稱</span><input class="c-input" id="na-name" placeholder="例如 blog" autocomplete="off"><span class="c-field__hint">留空時以第一個 service 命名。</span></label>
    <div class="l-stack" data-src="compose">
      <div class="c-field"><span class="c-field__label">compose 檔</span>
        <div><label class="c-btn">${icon("upload")}<span>選擇 .yml 檔案</span><input type="file" id="na-file" accept=".yml,.yaml" class="u-sr-only"></label></div>
        <textarea class="c-textarea" id="na-yaml" aria-label="compose YAML" spellcheck="false" placeholder="services:&#10;  web:&#10;    image: nginx:alpine"></textarea></div>
    </div>
    <div class="l-stack u-hidden" data-src="git">
      <label class="c-field"><span class="c-field__label">儲存庫網址</span><input class="c-input u-mono" id="na-git-url" placeholder="https://github.com/CAFECA-IO/SwarmStorage" autocomplete="off" spellcheck="false"><span class="c-field__hint">只支援公開的 https:// 儲存庫。</span></label>
      <div class="l-grid">
        <label class="c-field"><span class="c-field__label">分支／標籤</span><input class="c-input u-mono" id="na-git-ref" placeholder="main"></label>
        <label class="c-field"><span class="c-field__label">目錄</span><input class="c-input u-mono" id="na-git-path" placeholder="deploy/livekit"></label>
        <label class="c-field"><span class="c-field__label">compose 檔名</span><input class="c-input u-mono" id="na-git-file" placeholder="docker-compose.yml"></label>
      </div>
    </div>
    <label class="c-field"><span class="c-field__label">只啟動這些 service（選填）</span><input class="c-input u-mono" id="na-services" placeholder="例如 caddy, livekit" autocomplete="off"><span class="c-field__hint">以逗號分隔；留空啟動全部。</span></label>
    <label class="c-field"><span class="c-field__label">環境變數（選填）</span><textarea class="c-textarea c-textarea--sm" id="na-env" spellcheck="false" placeholder="LIVEKIT_DOMAIN=livekit.example.com"></textarea><span class="c-field__hint">${envHint({})}</span></label>
    ${isAdmin() ? `<label class="c-check"><input type="checkbox" id="na-priv"><span>特權 App：允許 build、host 網路與主機連接埠（僅 Admin）</span></label>` : ""}
    <span class="c-field__error" id="na-err" role="alert"></span>
    <div class="c-banner" id="na-rules">${icon("shield")}<div class="c-banner__body"><strong>安全限制</strong><span class="u-small">一般 App 不可使用 <code class="c-code">ports</code>、<code class="c-code">privileged</code>、主機路徑掛載與 <code class="c-code">build</code>；對外流量請在「網域」綁定。特權 App 規則見安全規範 §3.5。</span></div></div>`;
  dr.footer.classList.remove("u-hidden");

  });
  $("#na-file", dr.el).addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;

    const base = f.name.replace(/\.(ya?ml)$/i, "");
    if (!$("#na-name", dr.el).value && !/^(docker-)?compose$/.test(base)) $("#na-name", dr.el).value = base;
  });
  $("#na-submit", dr.el).addEventListener("click", async (e) => {
    const btn = e.currentTarget, v = (id) => $(id, dr.el)?.value.trim() || null;

    }
    try {
      const app = await busy(btn, api("/api/apps", { method: "POST", body }));
      dr.close(); toast(`已建立 ${app.name}，開始部署`);
      if (currentPage() === "apps") loadApps(); else location.hash = "apps";
    } catch (err) { showMsg($("#na-err", dr.el), err); }
  });
}

/** FR-GH-01：GitHub 安裝完成後導回（跨站導回不帶 cookie，因此由同站頁面完成綁定） */
async function completeGithub() {
  const q = new URLSearchParams(location.hash.split("/").slice(1).join("/"));
  history.replaceState(null, "", "#projects");
  try {
    if (!q.get("code") || !q.get("state")) throw new Error("GitHub 沒有回傳授權資料，請重新連結。");
    const inst = await api("/api/github/complete", { method: "POST", body: { code: q.get("code"), installation_id: Number(q.get("installation_id")), state: q.get("state") } });
    toast(`已連結 GitHub：${inst.account_login}`);
  } catch (err) { toast(err.message, "danger"); }
  route();
}

/** 依據：GitHub 儲存庫連到該 commit 的檔案與行號 */
function evidenceLink(project, commit, ev) {
  const label = `${ev.file}${ev.line ? `:${ev.line}` : ""}`;
  const gh = /^https:\/\/github\.com\/[^/]+\/[^/]+/.exec(project.repo_url.replace(/\.git$/, ""));
  if (!gh || !commit || ev.file.startsWith("（")) return `<span class="u-mono u-small">${esc(label)}</span>`;
  return `<a class="u-mono u-small" href="${esc(`${gh[0]}/blob/${commit}/${ev.file}${ev.line ? `#L${ev.line}` : ""}`)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}

  return `<div class="l-row" role="list" aria-label="驗證階段">${VERIFY_STAGES.map(([k, label]) => {
    const st = stages?.[k] || "pending";
    return `<span role="listitem" class="c-badge ${cls[st] || ""}" title="${esc(st)}"><span class="c-badge__dot" aria-hidden="true"></span>${label}${st === "skipped" ? "（略過）" : ""}</span>`;
  }).join("")}</div>`;
}
function countBadges(c) {
  return ["blocker", "high", "medium", "low"].map((k) => `${statusPill("severity", k)} <span class="u-mono u-small">${c?.[k] ?? 0}</span>`).join(" ");
}
const card = (title, body, extra = "") => `<section class="c-card"><div class="c-card__header"><h2 class="c-card__title">${title}</h2>${extra}</div><div class="c-card__body l-stack">${body}</div></section>`;
const banner = (tone, ic, title, body = "", actions = "") => `<div class="c-banner ${tone ? `c-banner--${tone}` : ""}">${icon(ic)}<div class="c-banner__body"><strong>${title}</strong>${body ? `<span class="u-small">${body}</span>` : ""}${actions ? `<div class="l-row">${actions}</div>` : ""}</div></div>`;

// Menu：點選單外關閉
document.addEventListener("click", (e) => $$("details.c-menu[open]").forEach((m) => { if (!m.contains(e.target)) m.open = false; }));

/** 目前的專案資料（分頁共用） */
const pj = { id: null, data: null, vars: null, runs: [], deps: [] };

/** 需要用戶提供、未設定的必填變數 */
const missingVars = (vars) => (vars?.items || []).filter((i) => i.needed && !i.optional && !i.set && !i.ignored && i.source === "user");

async function loadProject(id) {
  const [data, runs, deps] = await Promise.all([
    api(`/api/projects/${encodeURIComponent(id)}`),
    api(`/api/projects/${encodeURIComponent(id)}/verifications`).catch(() => []),
    api(`/api/projects/${encodeURIComponent(id)}/deployments`).catch(() => []),
  ]);
  const vars = data.confirmed ? await api(`/api/projects/${encodeURIComponent(id)}/vars?env=production`).catch(() => null) : null;
  Object.assign(pj, { id, data, runs, deps, vars });
}
const stillHere = (id, tab) => currentPage() === "projects" && pageArg() === id && !pageSub() && (tab === undefined || projectTab() === tab);

/** 專案頁：頁首、分頁、各分頁內容 */
async function renderProject(id) {
  clearTimeout(pollTimer);
  const tab = projectTab();
  if (pj.id !== id) $("#page").innerHTML = `<span class="c-skeleton"></span><span class="c-skeleton"></span>`;
  try { await loadProject(id); }
  catch (err) { return ($("#page").innerHTML = pageHeader("專案", "") + `<p class="c-msg c-msg--danger" role="alert">${esc(err.message)}</p><p><a href="#projects">回到專案列表</a></p>`); }
  if (!stillHere(id, tab)) return;
  const { project: p, analysis: a, deployment: d } = pj.data;
  document.title = `${p.name} · 專案 · Caloud`;
  const live = d && d.status === "running" && d.running_commit;
  const missing = missingVars(pj.vars).length;
  const menu = `<details class="c-menu" id="pj-menu"><summary class="c-btn">更多</summary><div class="c-menu__list" role="menu">
      <button class="c-menu__item" role="menuitem" data-act="verify" ${pj.data.confirmed ? "" : "disabled"}>${icon("play")}<span>立即驗證</span></button>
      ${isAdmin() ? `<button class="c-menu__item" role="menuitem" data-act="force" ${pj.data.confirmed ? "" : "disabled"}>${icon("alert")}<span>強制部署（略過驗證）</span></button>` : ""}
      <button class="c-menu__item" role="menuitem" data-act="reanalyze" ${p.status === "analyzing" ? "disabled" : ""}>${icon("refresh")}<span>重新解析</span></button>
      <button class="c-menu__item c-menu__item--danger" role="menuitem" data-act="delete">${icon("trash")}<span>刪除專案</span></button></div></details>`;
  $("#page").innerHTML = pageHeader(p.name,
    `${repoShort(p.repo_url)} · ${p.git_ref || p.branch || "預設分支"}${p.root ? ` · 根目錄 ${p.root}/` : ""}${p.installation_id ? " · GitHub App" : ""}${a?.commit ? ` · 最新 ${short(a.commit)}` : ""}`,
    `<a class="c-btn" href="#projects">專案列表</a>${live ? `<a class="c-btn" href="${esc(d.url)}" target="_blank" rel="noopener">${icon("link")}<span>開啟網站</span></a>` : ""}${menu}`) +
    `<nav class="c-tabs" aria-label="專案分頁">${PROJECT_TABS.map(([k, label]) => `<a class="c-tabs__item" href="#projects/${esc(id)}${k ? `/${k}` : ""}" ${k === tab ? 'aria-current="page"' : ""}>${label}${k === "vars" && missing ? `<span class="c-badge c-badge--warning c-tabs__count">${missing} 未設定</span>` : ""}</a>`).join("")}</nav>
    <div id="pj-global" class="l-stack"></div>
    <div id="pj-tab" class="l-stack"></div>`;
  drawGlobal();
  bindMenu(id);
  drawTab(id, tab);
}

/** 解析中、解析失敗：每個分頁都顯示 */
function drawGlobal() {
  const { project: p } = pj.data;
  const out = [];
  if (p.status === "analyzing") out.push(banner("", "loader", "正在取得並解析儲存庫", "通常在一分鐘內完成，這頁會自動更新。"));
  if (p.status === "error") out.push(banner("danger", "alert", "解析失敗", esc(p.error)));
  $("#pj-global").innerHTML = out.join("");
  $("#pj-global").classList.toggle("u-hidden", !out.length);
}

function drawTab(id, tab) {
  const box = $("#pj-tab"); if (!box) return;
  ({ "": drawOverview, settings: drawSettings, vars: drawVarsTab, history: drawHistoryTab })[tab](id, box);
  // 進行中時更新；設定與環境變數分頁可能正在編輯，只在解析中時更新
  const { project: p, deployment: d } = pj.data;
  const active = p.status === "analyzing" || d?.in_progress || pj.runs.some((r) => ["queued", "running"].includes(r.status));
  if (active && (tab === "" || tab === "history" || p.status === "analyzing")) {
    pollTimer = setTimeout(async () => {
      if (!stillHere(id, tab)) return;
      if (p.status === "analyzing") return renderProject(id);
      try { await loadProject(id); } catch { return; }
      if (stillHere(id, tab)) { drawGlobal(); drawTab(id, tab); }
    }, 3000);
  }
}

function bindMenu(id) {
  const m = $("#pj-menu"); if (!m) return;
  m.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    m.open = false;
    const p = pj.data.project;
    try {
      if (b.dataset.act === "verify") { await api(`/api/projects/${encodeURIComponent(id)}/verify`, { method: "POST", body: {} }); toast("已開始驗證"); }
      if (b.dataset.act === "force") {
        if (!(await confirmDialog({ title: "略過驗證直接部署？", body: "會以目前確認的設定部署最新版本，即使尚未通過驗證。強制部署會寫入稽核紀錄。", confirmText: "強制部署" }))) return;
        await api(`/api/projects/${encodeURIComponent(id)}/deploy`, { method: "POST", body: { force: true } }); toast("已開始部署");
      }
      if (b.dataset.act === "reanalyze") { await api(`/api/projects/${encodeURIComponent(id)}/analysis`, { method: "POST" }); toast("已開始重新解析"); }
      if (b.dataset.act === "delete") {
        if (!(await confirmDialog({ title: `刪除 ${p.name}？`, body: "解析紀錄、取得的原始碼與部署的環境會一併刪除，無法復原。", confirmText: "刪除專案" }))) return;
        await api(`/api/projects/${encodeURIComponent(id)}`, { method: "DELETE" }); toast(`已刪除 ${p.name}`); location.hash = "projects"; return;
      }
      renderProject(id);
    } catch (err) { toast(err.message, "danger"); }
  });
}

/** 部署（未通過驗證時先驗證，ADR 0020）或部署指定版本（ADR 0024） */
async function deployProject(id, btn, body) {
  try {
    const r = await busy(btn, api(`/api/projects/${encodeURIComponent(id)}/deploy`, { method: "POST", body: body || {} }));
    toast(r?.verification ? "已開始驗證，通過後自動部署" : "已開始部署");
    if (projectTab() !== "") location.hash = `projects/${id}`; else renderProject(id);
  } catch (err) { toast(err.message, "danger"); }
}
async function deployCommit(id, btn, commit, rollback) {
  const ok = await confirmDialog({
    title: rollback ? `回到 ${short(commit)}？` : `部署 ${short(commit)}？`,
    body: rollback ? "程式碼與 compose 回到當時上線的版本並重新部署。volume 資料與環境變數不會回退。" : "以這個版本通過驗證時的設定部署到 production。",
    confirmText: rollback ? "回到這個版本" : "部署這個版本", tone: "primary",
  });
  if (ok) deployProject(id, btn, { commit });
}

/** ADR 0024：加上 volume——先看 compose 的修改再確認 */
async function openVolumeFix(id, fix) {
  let pv;
  try { pv = await api(`/api/projects/${encodeURIComponent(id)}/volume-fix?service=${encodeURIComponent(fix.service)}&target=${encodeURIComponent(fix.target)}`); }
  catch (err) { return toast(err.message, "danger"); }
  let deploy = false;
  const ok = await confirmDialog({
    title: `為 ${fix.service} 加上 volume`, confirmText: "確認修改", tone: "primary", wide: true,
    html: `<p class="u-muted"><code class="c-code">${esc(fix.target)}</code> 會改存在具名 volume <code class="c-code">${esc(pv.volume)}</code>，重新部署後資料會保留。以下是 compose 的修改：</p>
      ${UI.diffLines(pv.before, pv.after)}
      ${banner("warning", "alert", "現有資料不會搬移", `目前容器裡 <code class="c-code">${esc(fix.target)}</code> 的內容不會自動搬到新 volume；需要保留的話，請先從 App 匯出。`)}
      <ul class="u-small u-muted"><li>修改會存成「編輯過的 compose」，並更新已確認的設定。</li><li>設定改變後，新版本需要重新驗證才會部署。</li></ul>
      ${UI.switchHtml({ id: "vf-deploy", label: "確認後立即重新部署", hint: "關閉時，下次部署才生效（未驗證時先驗證）" })}`,
    setup: (dlg) => $("#vf-deploy", dlg).addEventListener("change", (e) => {
      deploy = e.currentTarget.checked;
      $("[data-v='1']", dlg).textContent = deploy ? "確認並重新部署" : "確認修改";
    }),
  });
  if (!ok) return;
  try {
    const r = await api(`/api/projects/${encodeURIComponent(id)}/volume-fix`, { method: "POST", body: { ...fix, deploy } });
    toast(r.verification ? `已加上 ${r.volume}，開始驗證，通過後部署` : r.deployment ? `已加上 ${r.volume}，開始部署` : `已加上 ${r.volume}，下次部署生效`);
    renderProject(id);
  } catch (err) { toast(err.message, "danger"); }
}

/** 確認的有效 compose */
const confirmedCompose = () => { const c = pj.data.confirmed; return c ? c.compose ?? c.result?.compose ?? "" : ""; };
/** 確認的設定中仍未掛 volume 的持久化目錄 */
const volumeFixes = () => {
  const c = pj.data.confirmed; if (!c) return [];
  const compose = confirmedCompose();
  return (c.result?.findings || []).filter((f) => f.volume && !compose.includes(`:${f.volume.target}\n`) && !compose.includes(`:${f.volume.target}/`));
};
/** 非 PR 的驗證 */
const branchRuns = () => pj.runs.filter((r) => r.trigger !== "pr");

// ── 概況 ──
function drawOverview(id, box) {
  const { project: p, analysis: a, confirmed: c, deployment: d } = pj.data;
  const runs = branchRuns();
  const latestRun = runs[0];
  const running = latestRun && ["queued", "running"].includes(latestRun.status) ? latestRun : null;
  const cards = [];
  // 線上版本
  const liveCommit = d?.running_commit;
  cards.push(`<div class="c-stat"><span class="c-stat__label">線上版本 ${d ? statusPill("deploy", d.in_progress ? "deploying" : d.status === "running" && liveCommit ? "running" : d.error ? "failed" : "none") : statusPill("deploy", "none")}</span>
    <span class="c-stat__value u-mono">${liveCommit ? esc(short(liveCommit)) : "—"}</span>
    <span class="c-stat__meta">${liveCommit && d.deployed_at ? `${relTime(d.deployed_at)}上線` : "尚未上線"}${d?.url && liveCommit ? ` · <a class="u-mono" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.hostname)}</a>` : ""}</span>
    ${c ? `<div class="l-row"><button class="c-btn c-btn--sm" id="pj-redeploy" ${d?.in_progress || running ? "disabled" : ""}>${icon("upload")}<span>${d ? "重新部署" : "部署"}</span></button></div>` : ""}</div>`);
  // 下一個版本
  const next = d?.branch_commit || a?.commit;
  let nextBody;
  if (p.status === "analyzing") nextBody = `<span class="c-stat__meta">正在解析最新的 commit</span>`;
  else if (!c) nextBody = `<span class="c-stat__meta">尚未確認設定</span><div class="l-row"><a class="c-btn c-btn--sm c-btn--primary" href="#projects/${esc(id)}/settings">前往確認設定</a></div>`;
  else if (next && sameCommit(next, liveCommit) && !d?.pending_changes) nextBody = `<span class="c-stat__meta">${icon("check")}已是分支最新版本</span>`;
  else {
    const v = runs.find((r) => sameCommit(r.commit, next));
    const msg = d?.pending_changes ? `設定有變動，<a href="#projects/${esc(id)}/settings">確認後</a>才會使用新設定`
      : !v ? "尚未驗證；按「重新部署」會先驗證，通過後部署"
      : ["queued", "running"].includes(v.status) ? (v.deploy_after ? "通過後會自動部署到 production" : "驗證完成後不會自動部署")
      : v.status === "passed" ? (v.deploy_note ? esc(v.deploy_note) : "已通過驗證，尚未部署")
      : v.status === "failed" ? `未通過驗證，<a href="#projects/${esc(id)}/verifications/${esc(v.id)}">查看報告</a>` : "驗證未完成";
    nextBody = `<span class="c-stat__meta">${v ? statusPill("verify", v.status) : ""} ${v ? `${esc(triggerLabel(v))} · ${relTime(v.created_at)}` : ""}</span><span class="c-stat__meta">${msg}</span>`;
  }
  cards.push(`<div class="c-stat"><span class="c-stat__label">下一個版本</span><span class="c-stat__value u-mono">${next && !(sameCommit(next, liveCommit) && !d?.pending_changes) ? esc(short(next)) : "—"}</span>${nextBody}</div>`);
  // 環境
  const gpu = (c?.result?.services || []).some((s) => s.gpu);
  const usage = pj.data.build_usage;
  cards.push(`<div class="c-stat"><span class="c-stat__label">環境</span>
    <span class="c-stat__meta">production${d ? ` · <span class="u-mono">${esc(d.subdomain)}</span>` : ""}${gpu ? ' <span class="c-badge c-badge--accent">GPU</span>' : ""}</span>
    <span class="c-stat__meta">${usage ? `本月建置 ${usage.minutes} 分鐘${usage.limit ? `／上限 ${usage.limit}` : ""}` : ""}</span>
    <span class="c-stat__meta">${p.commit_header !== false ? "回應帶 <code class=\"c-code\">X-Caloud-Commit</code>" : "不帶版本標頭"}</span></div>`);

  box.innerHTML = `<div class="l-grid" aria-label="版本現況">${cards.join("")}</div>
    <div id="pj-flow"></div>
    <div class="l-grid">
      ${card(`需要處理`, `<div id="pj-todo" class="l-stack"></div>`)}
      ${card("最近活動", `<div id="pj-activity"></div>`, `<span class="l-spacer"></span><a class="u-small" href="#projects/${esc(id)}/history">全部紀錄</a>`)}
    </div>`;
  drawFlow(id, running);
  drawTodo(id);
  drawActivity(id);
  $("#pj-redeploy")?.addEventListener("click", (e) => deployProject(id, e.currentTarget));
}

/** 進行中的驗證或部署：階段、耗時、預估 */
function drawFlow(id, run) {
  const box = $("#pj-flow"); if (!box) return;
  const d = pj.data.deployment;
  const now = Date.now() / 1000;
  const out = [];
  if (run) {
    const t = run.stage_times || {};
    const elapsed = now - (run.started_at || run.created_at);
    const avg = pj.data.verification?.avg_secs;
    const eta = avg ? Math.max(0, avg - elapsed) : null;
    const steps = VERIFY_STAGES.filter(([k]) => !["report", "destroy"].includes(k)).map(([k, label]) => {
      const st = run.stages?.[k] || "pending";
      const [s0, s1] = t[k] || [];
      const meta = st === "running" && s0 ? dur(now - s0) : s0 && s1 ? dur(s1 - s0) : st === "skipped" ? "略過" : st === "pending" ? "等待" : "";
      const cls = st === "passed" || st === "skipped" ? "is-done" : st === "running" ? "is-current" : st === "failed" ? "is-failed" : "";
      return `<li class="c-flow__step ${cls}" ${st === "running" ? 'aria-current="step"' : ""}><span class="c-flow__label">${label}</span><span class="c-flow__meta">${esc(meta)}</span></li>`;
    });
    if (run.deploy_after) steps.push(`<li class="c-flow__step"><span class="c-flow__label">部署</span><span class="c-flow__meta">通過後自動</span></li>`);
    out.push(card(`<span class="u-mono">${esc(short(run.commit))}</span> 正在驗證`,
      `<ol class="c-flow" aria-label="驗證階段">${steps.join("")}</ol>`,
      `<span class="u-small u-muted">已進行 ${dur(elapsed)}${eta != null ? ` · 依最近 3 次，約還要 ${Math.max(1, Math.round(eta / 60))} 分鐘` : ""}</span><span class="l-spacer"></span>
       <a class="c-btn c-btn--sm" href="#projects/${esc(id)}/verifications/${esc(run.id)}">即時 log</a><button class="c-btn c-btn--sm" id="pj-verify-cancel">${icon("stop")}<span>取消</span></button>`));
  }
  if (d?.in_progress || d?.error) {
    const at = DEPLOY_STAGES.findIndex(([k]) => k === d.stage);
    const steps = DEPLOY_STAGES.map(([k, label], i) => {
      const cls = at < 0 || i < at ? "is-done" : i === at ? (d.error ? "is-failed" : "is-current") : "";
      return `<li class="c-flow__step ${cls}"><span class="c-flow__label">${label}</span></li>`;
    });
    const logs = (d.logs || []).map((l) => `[${l.stage}] ${l.line}`);
    const title = d.error ? (d.running_commit && d.status === "running" ? `部署 <span class="u-mono">${esc(short(d.target_commit))}</span> 失敗，仍在執行 <span class="u-mono">${esc(short(d.running_commit))}</span>` : `部署 <span class="u-mono">${esc(short(d.target_commit))}</span> 失敗`) : `正在部署 <span class="u-mono">${esc(short(d.target_commit))}</span>`;
    out.push(card(title, `<ol class="c-flow" aria-label="部署階段">${steps.join("")}</ol>
      ${d.error ? `<p class="c-msg c-msg--danger" role="alert">${esc(d.error)}</p>` : ""}
      ${logs.length ? `<details ${d.error ? "open" : ""}><summary class="u-small">部署 log（最近 ${logs.length} 行）</summary><pre class="c-log" aria-label="部署 log" id="pj-log">${esc(logs.join("\n"))}</pre></details>` : ""}`,
      d.error ? `<span class="l-spacer"></span><button class="c-btn c-btn--sm c-btn--primary" id="pj-retry">${icon("refresh")}<span>重新部署</span></button>` : ""));
  }
  box.innerHTML = out.join("");
  const log = $("#pj-log"); if (log) log.scrollTop = log.scrollHeight;
  $("#pj-retry")?.addEventListener("click", (e) => deployProject(id, e.currentTarget));
  $("#pj-verify-cancel")?.addEventListener("click", async (e) => {
    try { await busy(e.currentTarget, api(`/api/verifications/${encodeURIComponent(run.id)}/cancel`, { method: "POST" })); toast("已取消驗證"); renderProject(id); }
    catch (err) { toast(err.message, "danger"); }
  });
}

/** 需要處理：每項都可直接處理 */
function drawTodo(id) {
  const box = $("#pj-todo"); if (!box) return;
  const { project: p, analysis: a, confirmed: c, deployment: d } = pj.data;
  const items = [];
  const item = (tone, label, title, body, action) => items.push(`<div class="l-stack"><div class="l-row"><span class="c-badge ${tone ? `c-badge--${tone}` : ""}">${esc(label)}</span><strong>${title}</strong></div>${body ? `<span class="u-small u-muted">${body}</span>` : ""}<div class="l-row">${action}</div></div>`);
  if (!c && a?.result) item("warning", "確認", "確認解析結果後才能驗證與部署", "檢查服務、對外服務與低信心的判斷。", `<a class="c-btn c-btn--sm c-btn--primary" href="#projects/${esc(id)}/settings">前往設定</a>`);
  if (c && a && c.id !== a.id && p.status !== "analyzing") item("warning", "設定", "最新解析的設定有變動，需要確認", `確認前仍使用 ${esc(short(c.commit))} 的設定與程式碼。`, `<a class="c-btn c-btn--sm" href="#projects/${esc(id)}/settings">查看差異</a>`);
  volumeFixes().forEach((f, i) => item("danger", "資料遺失", `重新部署時，<code class="c-code">${esc(f.volume.service)}</code> 的 <code class="c-code">${esc(f.volume.target)}</code> 會被清空`, `${fmtMsg(f.message)}`, `<button class="c-btn c-btn--sm c-btn--primary" data-vfix="${i}">加上 volume…</button>`));
  // 已通過驗證、比線上新、沒有部署的版本
  const live = d?.running_commit;
  const liveAt = d?.deployed_at || 0;
  const waiting = branchRuns().find((r) => r.status === "passed" && !sameCommit(r.commit, live) && (r.finished_at || 0) > liveAt);
  if (waiting && !d?.in_progress && !branchRuns().some((r) => ["queued", "running"].includes(r.status) && r.deploy_after)) {
    item("warning", "未部署", `<span class="u-mono">${esc(short(waiting.commit))}</span> 已通過驗證，但沒有部署`, waiting.deploy_note ? esc(waiting.deploy_note) : "", `<button class="c-btn c-btn--sm" data-deploy="${esc(waiting.commit)}">部署 ${esc(short(waiting.commit))}</button>`);
  }
  const miss = missingVars(pj.vars);
  if (miss.length) item("warning", "變數", `${miss.length} 個必填的環境變數未設定`, `<span class="u-mono">${miss.slice(0, 6).map((x) => esc(x.name)).join("、")}${miss.length > 6 ? "…" : ""}</span>；確定不需要的可以標為「不需要」。`, `<a class="c-btn c-btn--sm" href="#projects/${esc(id)}/vars">前往環境變數</a>`);
  if (d?.vars_pending && !d.in_progress) item("", "變數", "環境變數已變更", "重新部署後生效。", `<button class="c-btn c-btn--sm" data-redeploy>重新部署</button>`);
  // ADR 0023：容器實際的映像與執行中版本不一致
  const odd = (d?.services || []).filter((x) => x.commit && d.running_commit && !d.running_commit.startsWith(x.commit) && !d.in_progress && !d.error);
  if (odd.length) item("warning", "版本", "容器版本與執行中版本不同", `<span class="u-mono">${odd.map((x) => `${esc(x.name)}：${esc(short(x.commit))}`).join("、")}</span>`, `<button class="c-btn c-btn--sm" data-redeploy>重新部署</button>`);
  box.innerHTML = items.length ? items.join("") : `<p class="u-muted u-small">${icon("check")} 目前沒有需要處理的事項。</p>`;
  const fixes = volumeFixes();
  $$("[data-vfix]", box).forEach((b) => b.addEventListener("click", () => openVolumeFix(id, fixes[Number(b.dataset.vfix)].volume)));
  $$("[data-deploy]", box).forEach((b) => b.addEventListener("click", () => deployCommit(id, b, b.dataset.deploy, false)));
  $$("[data-redeploy]", box).forEach((b) => b.addEventListener("click", () => deployProject(id, b)));
}

/** 最近活動：驗證與部署合併 */
function drawActivity(id) {
  const box = $("#pj-activity"); if (!box) return;
  const ev = [
    ...pj.runs.slice(0, 8).map((r) => ({ at: r.created_at, html: `${statusPill("verify", r.status)} <span class="u-mono">${esc(short(r.commit))}</span> <span class="u-small">${esc(triggerLabel(r))}驗證${r.status === "passed" && r.deploy_note ? " · 未部署" : ""}</span>`, href: `#projects/${id}/verifications/${r.id}` })),
    ...pj.deps.slice(0, 8).map((x) => ({ at: x.created_at, html: `<span class="c-badge ${x.status === "success" ? "c-badge--success" : x.status === "failure" ? "c-badge--danger" : "c-badge--accent"}">${x.status === "success" ? "上線" : x.status === "failure" ? "部署失敗" : "部署中"}</span> <span class="u-mono">${esc(short(x.commit))}</span> <span class="u-small">${esc(DEPLOY_TRIGGER[x.trigger] || x.trigger)}部署</span>` })),
  ].sort((x, y) => y.at - x.at).slice(0, 6);
  box.innerHTML = ev.length ? `<div class="l-stack">${ev.map((e) => `<div class="l-row">${e.href ? `<a href="${esc(e.href)}">${e.html}</a>` : e.html}<span class="l-spacer"></span><span class="u-small u-muted">${relTime(e.at)}</span></div>`).join("")}</div>`
    : `<p class="u-muted u-small">還沒有驗證或部署。</p>`;
}

// ── 設定 ──
function drawSettings(id, box) {
  const { project: p, analysis: a, confirmed: c, confirmed_diff: diff } = pj.data;
  const r = a?.result;
  const analyzing = p.status === "analyzing";
  const isConfirmedLatest = c && a && c.id === a.id;
  const lows = r ? r.findings.map((f, i) => [f, i]).filter(([f]) => f.confidence === "low") : [];
  // 新的解析：上次確認時勾選過的同一則判斷預先勾選
  const ackedMsgs = new Set((c?.acknowledged || []).map((i) => c.result?.findings?.[i]?.message).filter(Boolean));
  const acked = new Set(isConfirmedLatest ? c.acknowledged : lows.filter(([f]) => ackedMsgs.has(f.message)).map(([, i]) => i));
  let compose = isConfirmedLatest ? c.compose : null; // 用戶編輯版（null 表示使用產生的）
  const publicDefault = (isConfirmedLatest && c.public_service) || (c?.public_service && r?.services.some((s) => s.name === c.public_service) ? c.public_service : "") || r?.services.find((s) => s.public)?.name || "";
  const suggest = r?.findings.find((f) => f.key === "suggest_root");
  const out = [];

  // 確認狀態
  if (isConfirmedLatest) out.push(banner("", "check", "設定已確認",
    `${c.confirmed_via === "auto" ? "最新解析的設定與上次相同，已自動沿用確認" : `${relTime(c.confirmed_at)}確認`}${c.compose ? "（使用編輯過的 compose）" : ""}；對外服務 <code class="c-code">${esc(c.public_service)}</code>。push 後以這份設定驗證，通過即自動部署。`));
  else if (c && a && !analyzing) out.push(banner("warning", "info", "最新解析的設定有變動",
    `目前使用 ${esc(short(c.commit))} 確認的設定。確認下方的新設定後才會改用；之前通過驗證的版本仍可在「紀錄」部署。`) + (diff ? card("compose 差異", `${UI.diffLines(diff.before, diff.after)}<p class="u-small u-muted">左側 − 為目前確認的版本，+ 為最新解析產生的版本。</p>`) : ""));
  else if (!c && r) out.push(banner("warning", "info", "確認解析結果", "檢查下方的服務與判斷；確認後才會開始驗證與部署。"));
  if (r?.errors.length) out.push(banner("danger", "alert", `${r.errors.length} 個阻擋項`, `${r.errors.map(fmtMsg).join("<br>")}${r.compose === null && !suggest ? "<br>可以在下方編輯 compose 解決後再確認。" : ""}`));
  if (suggest) {
    const dirs = [...suggest.message.matchAll(/`([^`]+)\/`/g)].map((m) => m[1]);
    out.push(banner("warning", "info", "根目錄沒有可解析的檔案", fmtMsg(suggest.message), dirs.map((dd) => `<button class="c-btn c-btn--sm" data-root="${esc(dd)}">改用 ${esc(dd)}/ 重新解析</button>`).join("")));
  }

  if (r) {
    const fixes = isConfirmedLatest ? volumeFixes() : [];
    const svcRows = r.services.map((s) => `<tr>
        <td class="c-table__primary u-mono">${esc(s.name)}${s.gpu ? ' <span class="c-badge c-badge--accent" title="以 GPU 節點執行；GPU 由同一節點上的環境分時共用，顯示記憶體不隔離">GPU</span>' : ""}</td><td>${esc(ROLE_LABEL[s.role] || s.role)}</td><td class="u-mono">${s.port ?? '<span class="u-muted">—</span>'}</td>
        <td>${s.role === "database" || s.role === "cache" ? '<span class="u-muted u-small">僅內部</span>' : `<label class="c-check"><input type="radio" name="pj-public" value="${esc(s.name)}" ${s.name === publicDefault ? "checked" : ""}><span class="u-sr-only">以 ${esc(s.name)} 為對外服務</span><span>路徑 /</span></label>`}</td></tr>`).join("");
    const findingRows = r.findings.map((f, i) => {
      const fi = fixes.findIndex((x) => x.message === f.message);
      return `<tr><td>${statusPill("confidence", f.confidence)}</td><td>${fmtMsg(f.message)}</td>
        <td>${f.evidence.map((ev) => evidenceLink(p, a.commit, ev)).join("<br>") || '<span class="u-muted">—</span>'}</td>
        <td>${f.confidence === "low" ? `<label class="c-check"><input type="checkbox" data-ack="${i}" ${acked.has(i) ? "checked" : ""}><span>我已確認</span></label>` : fi >= 0 ? `<button class="c-btn c-btn--sm" data-vfix="${fi}">加上 volume…</button>` : ""}</td></tr>`;
    }).join("");
    const sourceLabel = { override: `儲存庫的 ${r.source.file}`, compose: `沿用 ${r.source.file}`, dockerfile: `儲存庫的 Dockerfile`, template: `${r.source.template} 範本`, static: "靜態網站（nginx）", none: "找不到可解析的來源" }[r.source.kind];
    const pubFinding = r.findings.find((f) => f.key === "public_service");
    out.push(card("服務", `<div class="c-table-wrap"><table class="c-table">
        <thead><tr><th>服務</th><th>類型</th><th>Port</th><th>對外</th></tr></thead>
        <tbody>${svcRows || `<tr><td colspan="4">${empty({ iconName: "inbox", title: "沒有服務", body: "請指定根目錄或在儲存庫加入 compose 檔。" })}</td></tr>`}</tbody></table></div>`,
      `<span class="u-small u-muted">來源：${esc(sourceLabel)}${pubFinding ? ` · 對外服務信心 ${statusPill("confidence", pubFinding.confidence)}` : ""}</span>`));
    out.push(card("判斷與依據", `<div class="c-table-wrap"><table class="c-table">
        <thead><tr><th>信心</th><th>判斷</th><th>依據</th><th><span class="u-sr-only">操作</span></th></tr></thead><tbody>${findingRows}</tbody></table></div>`,
      `<span class="u-small u-muted">${r.findings.length} 項${lows.length ? `，${lows.length} 項低信心需確認` : ""}</span>`));
    out.push(`<section class="c-card"><div class="c-card__header"><h2 class="c-card__title" id="pj-compose-title"></h2><span class="l-spacer"></span><button class="c-btn c-btn--sm" id="pj-edit">編輯</button></div>
        <div class="c-card__body l-stack"><details id="pj-compose-box"><summary class="u-small">顯示 compose</summary><div id="pj-compose"></div></details>
        <p class="u-small u-muted">已通過平臺 compose 政策。要固定這份設定，可放到儲存庫的 <code class="c-code">.caloud/compose.yml</code>。</p></div></section>`);
    out.push(`<div class="l-row"><span class="c-field__error" id="pj-err" role="alert"></span><span class="l-spacer"></span><span class="u-small u-muted" id="pj-hint"></span>
      <button class="c-btn c-btn--primary" id="pj-confirm">${icon("check")}<span>${isConfirmedLatest ? "儲存變更" : c ? "確認新設定" : "確認設定"}</span></button></div>`);
  }

  // ADR 0025：資源
  const lim = pj.data.limits;
  if (lim) {
    const fmtGb = (mb) => `${+(mb / 1024).toFixed(1)} GB`;
    const fmtCpu = (c) => `${+(+c).toFixed(2)} 核`;
    const rows = lim.services.map((x) => `<tr><td class="c-table__primary u-mono">${esc(x.service)}</td><td>${fmtGb(x.memory_mb)}</td><td>${fmtCpu(x.cpus)}</td><td class="u-small u-muted">${x.declared ? "compose 宣告" : "預設"}</td></tr>`).join("");
    const capText = `記憶體 ${lim.memory_mb ? `合計上限 ${fmtGb(lim.memory_mb)}` : "每個服務最多 1 GB"}；CPU ${lim.cpus ? `合計上限 ${fmtCpu(lim.cpus)}` : "每個服務最多 1 核"}`;
    out.push(card("資源", `${lim.error ? banner("danger", "alert", "超過資源上限", `${esc(lim.error)}<br>調整 compose 的 <code class="c-code">mem_limit</code>／<code class="c-code">cpus</code>${isAdmin() ? "，或放寬專案上限" : "，或請 Admin 放寬專案上限"}。`) : ""}
      ${rows ? `<div class="c-table-wrap"><table class="c-table"><thead><tr><th>服務</th><th>記憶體</th><th>CPU</th><th>來源</th></tr></thead><tbody>${rows}
        <tr><td class="c-table__primary">合計</td><td>${fmtGb(lim.total_memory_mb)}</td><td>${fmtCpu(lim.total_cpus)}</td><td></td></tr></tbody></table></div>` : '<p class="u-small u-muted">確認設定後顯示各服務的資源。</p>'}
      <p class="u-small u-muted">${esc(capText)}。服務在 compose 以 <code class="c-code">mem_limit</code>、<code class="c-code">cpus</code>（或 <code class="c-code">deploy.resources.limits</code>）宣告用量，沒有宣告以 1 GB、1 核計。${isAdmin() ? "" : "需要更多請聯絡 Admin。"}</p>
      ${isAdmin() ? `<div class="l-grid">
        <label class="c-field"><span class="c-field__label">記憶體合計上限（GB）</span><input class="c-input" id="pl-mem" type="number" min="1" max="128" step="1" value="${lim.memory_mb ? lim.memory_mb / 1024 : ""}" placeholder="預設：每個服務 1 GB"></label>
        <label class="c-field"><span class="c-field__label">CPU 合計上限（核）</span><input class="c-input" id="pl-cpu" type="number" min="1" max="64" step="0.5" value="${lim.cpus ?? ""}" placeholder="預設：每個服務 1 核"></label></div>
        <div class="l-row"><span class="c-field__error" id="pl-err" role="alert"></span><span class="l-spacer"></span><span class="u-small u-muted">只有 Admin 能調整；留空恢復預設。</span><button class="c-btn" id="pl-save">儲存上限</button></div>` : ""}`));
  }

  // 專案設定
  out.push(card("專案設定", `<div class="l-grid">
      <label class="c-field"><span class="c-field__label">分支／標籤</span><input class="c-input u-mono" id="ps-ref" value="${esc(p.git_ref || "")}" placeholder="預設分支（${esc(p.branch || "—")}）"></label>
      <label class="c-field"><span class="c-field__label">根目錄</span><input class="c-input u-mono" id="ps-root" value="${esc(p.root || "")}" placeholder="儲存庫根目錄"><span class="c-field__hint">改變分支或根目錄會重新解析。</span></label></div>
    <div class="l-row"><span class="c-field__error" id="ps-err" role="alert"></span><span class="l-spacer"></span><button class="c-btn" id="ps-save">儲存</button></div>
    ${UI.switchHtml({ id: "ps-header", label: "網站回應帶 X-Caloud-Commit", hint: "值為執行中版本的前 7 碼，方便確認線上版本；變更立即生效。", checked: p.commit_header !== false })}`));
  out.push(card("刪除專案", `<div class="l-row"><span class="u-small u-muted l-spacer">解析紀錄、取得的原始碼與部署的環境會一併刪除，無法復原。</span><button class="c-btn c-btn--danger" id="ps-delete">${icon("trash")}<span>刪除專案</span></button></div>`));
  box.innerHTML = out.join("");

  // compose 顯示與編輯
  const drawCompose = () => {
    const t = $("#pj-compose-title"); if (!t) return;
    t.textContent = compose ? "compose（已編輯）" : "產生的 compose";
    const text = compose ?? r.compose;
    $("#pj-compose").innerHTML = text ? `<pre class="c-log" aria-label="compose 檔">${esc(text)}</pre>` : `<p class="u-muted">解析有阻擋項，沒有產生 compose；請按「編輯」貼上修正後的版本。</p>`;
    if (!text) $("#pj-compose-box").open = true;
  };
  const initial = () => JSON.stringify([compose, $("[name='pj-public']:checked")?.value, ackSet()]);
  const ackSet = () => $$("[data-ack]").filter((x) => x.checked).map((x) => Number(x.dataset.ack));
  let start = "";
  const refreshConfirm = () => {
    const btn = $("#pj-confirm"); if (!btn) return;
    const missing = lows.length - ackSet().length;
    const noCompose = !compose && !r.compose;
    const noPublic = !$("[name='pj-public']:checked");
    const unchanged = isConfirmedLatest && initial() === start;
    btn.disabled = missing > 0 || noCompose || noPublic || analyzing || unchanged;
    $("#pj-hint").textContent = missing > 0 ? `還有 ${missing} 個低信心項目未確認` : noCompose ? "請先編輯 compose 解決阻擋項" : noPublic ? "請選擇對外服務" : unchanged ? "沒有變更" : "";
  };
  if (r) {
    drawCompose();
    start = initial();
    $$("[data-ack], [name='pj-public']").forEach((x) => x.addEventListener("change", refreshConfirm));
    refreshConfirm();
    $("#pj-confirm").addEventListener("click", async (e) => {
      showMsg($("#pj-err"), null);
      try {
        await busy(e.currentTarget, api(`/api/projects/${id}/analysis`, { method: "PUT", body: { compose, public_service: $("[name='pj-public']:checked")?.value, acknowledged: ackSet() } }));
        toast("已確認設定");
        renderProject(id);
      } catch (err) { showMsg($("#pj-err"), err); }
    });
    $("#pj-edit").addEventListener("click", () => {
      const dr = drawer({ title: "編輯 compose", subtitle: "確認時以平臺 compose 政策檢查；不可使用 ports、主機路徑與 host 網路。" });
      dr.body.innerHTML = `<label class="c-field"><span class="c-field__label">compose.yml</span><textarea class="c-textarea" id="pe-yaml" spellcheck="false">${esc(compose ?? r.compose ?? "")}</textarea></label>`;
      dr.footer.classList.remove("u-hidden");
      dr.footer.innerHTML = `<button class="c-btn" id="pe-reset">還原為產生的版本</button><span class="l-spacer"></span><button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="pe-save">${icon("check")}<span>套用</span></button>`;
      $("#pe-reset", dr.el).disabled = !r.compose;
      $("#pe-reset", dr.el).addEventListener("click", () => { compose = null; dr.close(); drawCompose(); refreshConfirm(); });
      $("#pe-save", dr.el).addEventListener("click", () => { const v = $("#pe-yaml", dr.el).value; compose = v.trim() && v !== r.compose ? v : null; dr.close(); drawCompose(); $("#pj-compose-box").open = true; refreshConfirm(); });
    });
    const fixes = isConfirmedLatest ? volumeFixes() : [];
    $$("[data-vfix]", box).forEach((b) => b.addEventListener("click", () => openVolumeFix(id, fixes[Number(b.dataset.vfix)].volume)));
  }
  $$("[data-root]", box).forEach((b) => b.addEventListener("click", async () => {
    try { await busy(b, api(`/api/projects/${id}`, { method: "PATCH", body: { root: b.dataset.root } })); renderProject(id); }
    catch (err) { toast(err.message, "danger"); }
  }));
  $("#pl-save")?.addEventListener("click", async (e) => {
    showMsg($("#pl-err"), null);
    const num = (sel) => { const v = $(sel).value.trim(); return v === "" ? null : Number(v); };
    const mem = num("#pl-mem");
    try {
      await busy(e.currentTarget, api(`/api/projects/${encodeURIComponent(id)}/limits`, { method: "PUT", body: { memory_mb: mem == null ? null : Math.round(mem * 1024), cpus: num("#pl-cpu") } }));
      toast("已更新資源上限，下次部署生效"); renderProject(id);
    } catch (err) { showMsg($("#pl-err"), err); }
  });
  $("#ps-save").addEventListener("click", async (e) => {
    showMsg($("#ps-err"), null);
    try { await busy(e.currentTarget, api(`/api/projects/${encodeURIComponent(id)}`, { method: "PATCH", body: { git_ref: $("#ps-ref").value.trim(), root: $("#ps-root").value.trim() } })); toast("已儲存"); renderProject(id); }
    catch (err) { showMsg($("#ps-err"), err); }
  });
  $("#ps-header").addEventListener("change", async (e) => {
    const el = e.currentTarget;
    try { await api(`/api/projects/${encodeURIComponent(id)}`, { method: "PATCH", body: { commit_header: el.checked } }); toast(el.checked ? "已開啟版本標頭" : "已關閉版本標頭"); pj.data.project.commit_header = el.checked; }
    catch (err) { el.checked = !el.checked; toast(err.message, "danger"); }
  });
  $("#ps-delete").addEventListener("click", async () => {
    if (!(await confirmDialog({ title: `刪除 ${p.name}？`, body: "解析紀錄、取得的原始碼與部署的環境會一併刪除，無法復原。", confirmText: "刪除專案" }))) return;
    try { await api(`/api/projects/${id}`, { method: "DELETE" }); toast(`已刪除 ${p.name}`); location.hash = "projects"; }
    catch (err) { toast(err.message, "danger"); }
  });
}

// ── 環境變數 FR-ENV-05（ADR 0019）、FR-AN-12（ADR 0024） ──
function drawVarsTab(id, box) {
  const c = pj.data.confirmed;
  if (!c) return (box.innerHTML = empty({ iconName: "key", title: "確認設定後才能設定環境變數", body: "解析結果確認後，這裡會列出 App 需要的變數。", action: `<a class="c-btn c-btn--primary" href="#projects/${esc(id)}/settings">前往設定</a>` }));
  const v = pj.vars;
  if (!v) return (box.innerHTML = `<p class="c-msg c-msg--danger" role="alert">無法載入環境變數。</p>`);
  const meta = Object.fromEntries((c.result?.env || []).map((e) => [e.name, e]));
  const platform = (c.result?.env || []).filter((e) => e.provider === "platform");
  const badges = (e) => `${e?.build_time ? ' <span class="c-badge" title="值在建置時寫入映像，不要放秘密">建置時</span>' : ""}${e?.varies_by_env ? ' <span class="c-badge c-badge--warning" title="staging 與 production 需各自建置">隨環境不同</span>' : ""}`;
  const evid = (it) => (it.evidence?.length ? it.evidence : meta[it.name]?.evidence || []).map((ev) => evidenceLink(pj.data.project, c.commit, ev)).join("<br>") || '<span class="u-muted">—</span>';
  const setBtn = (it) => `<button class="c-btn c-btn--sm" data-var-set="${esc(it.name)}">${icon("key")}<span>${it.set ? "更新" : "設定"}</span></button>`;
  const required = v.items.filter((i) => i.source === "user" && i.needed && !i.optional && !i.set && !i.ignored);
  const optional = v.items.filter((i) => i.source === "user" && i.needed && i.optional && !i.set && !i.ignored);
  const provided = v.items.filter((i) => i.set || i.source === "compose" || i.source === "generated");

  const table = (rows, head) => `<div class="c-table-wrap"><table class="c-table"><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  const sec = (title, desc, rows, head) => rows.length ? card(`${title} <span class="c-badge">${rows.length}</span>`, `${desc ? `<p class="u-small u-muted">${desc}</p>` : ""}${table(rows, head)}`) : "";
  const pendingRows = (list) => list.map((it) => `<tr><td><span class="c-table__primary u-mono">${esc(it.name)}</span>${badges(meta[it.name] || it)}</td><td>${evid(it)}</td>
      <td><div class="c-table__actions">${setBtn(it)}<button class="c-btn c-btn--ghost c-btn--sm" data-var-ignore="${esc(it.name)}">標為不需要</button></div></td></tr>`);
  const providedRows = provided.map((it) => {

      : it.set ? `<span class="c-badge c-badge--success">秘密變數</span>${it.hint ? ` <span class="u-mono u-small">${esc(it.hint)}</span>` : ""}`
      : `<span class="c-badge">compose</span> <span class="u-mono u-small">${esc(it.value || "")}</span>`;
    const actions = it.source === "generated" ? '<span class="u-muted u-small">不可修改</span>'
      : `${setBtn(it)}${it.set ? `<button class="c-btn c-btn--ghost c-btn--sm" data-var-unset="${esc(it.name)}">${icon("trash")}<span>清除</span></button>` : ""}`;
    return `<tr><td><span class="c-table__primary u-mono">${esc(it.name)}</span>${badges(meta[it.name] || it)}</td><td>${state}</td><td><div class="c-table__actions">${actions}</div></td></tr>`;
  }).concat(platform.map((e) => `<tr><td><span class="c-table__primary u-mono">${esc(e.name)}</span>${badges(e)}</td><td><span class="c-badge">平臺</span></td><td></td></tr>`));
  const ignoredRows = ignored.map((it) => `<tr><td><span class="c-table__primary u-mono">${esc(it.name)}</span></td><td>${evid(it)}</td><td><div class="c-table__actions"><button class="c-btn c-btn--ghost c-btn--sm" data-var-unignore="${esc(it.name)}">還原</button></div></td></tr>`);
  box.innerHTML = `<div class="l-row"><span class="u-small u-muted l-spacer">production · 值加密保存、只寫不讀；變更後重新部署生效。「需要／選填」依程式中是否有預設值判斷。</span>
      <button class="c-btn" id="pj-var-new">${icon("plus")}<span>新增變數</span></button></div>
    ${required.length ? "" : banner("", "check", "必填的變數都已提供", "")}
    ${sec("需要你提供", "程式中讀取、沒有預設值。未設定也能部署，但 App 可能無法正常運作。", pendingRows(required), ["名稱", "依據", '<span class="u-sr-only">操作</span>'])}
    ${sec("選填", "程式中有預設值，不設定時使用預設值。", pendingRows(optional), ["名稱", "依據", '<span class="u-sr-only">操作</span>'])}
    ${sec("已提供", "", providedRows, ["名稱", "來源", '<span class="u-sr-only">操作</span>'])}
    ${sec("已標為不需要", "不再提醒；不影響部署時注入的變數。", ignoredRows, ["名稱", "依據", '<span class="u-sr-only">操作</span>'])}`;
  const save = async (body, msg) => { pj.vars = await api(`/api/projects/${encodeURIComponent(id)}/vars`, { method: "PUT", body: { env: "production", ...body } }); toast(msg); renderProject(id); };
  const open = (name) => {
    const m = meta[name];
    const dr = drawer({ title: name ? `設定 ${name}` : "新增變數", subtitle: "值以主金鑰加密保存，之後不會再顯示；重新部署後生效。" });
    dr.body.innerHTML = `
      ${name ? "" : `<label class="c-field"><span class="c-field__label">名稱</span><input class="c-input u-mono" id="pv-name" placeholder="例如 SESSION_SECRET" autocomplete="off" spellcheck="false"><span class="c-field__hint">英數與底線，不可以數字開頭；CALOUD_ 開頭保留給平臺。</span></label>`}
      <label class="c-field"><span class="c-field__label">值</span><input class="c-input u-mono" type="password" id="pv-value" autocomplete="new-password" spellcheck="false"></label>
      ${m?.build_time ? banner("warning", "alert", "建置時變數", "值會寫進映像與前端程式，任何人都看得到，不要放秘密。") : ""}
      <span class="c-field__error" id="pv-err" role="alert"></span>`;
    dr.footer.classList.remove("u-hidden");
    dr.footer.innerHTML = `<button class="c-btn" data-close>取消</button><button class="c-btn c-btn--primary" id="pv-save">${icon("check")}<span>儲存</span></button>`;
    $("#pv-save", dr.el).addEventListener("click", async (e) => {
      const n = name || $("#pv-name", dr.el).value.trim();
      showMsg($("#pv-err", dr.el), null);
      if (!n) return showMsg($("#pv-err", dr.el), new Error("請輸入名稱。"));
      try { await busy(e.currentTarget, save({ set: { [n]: $("#pv-value", dr.el).value } }, `已儲存 ${n}，重新部署後生效`)); dr.close(); }
      catch (err) { showMsg($("#pv-err", dr.el), err); }
    });
  };
  $("#pj-var-new", box).addEventListener("click", () => open(null));
  $$("[data-var-set]", box).forEach((b) => b.addEventListener("click", () => open(b.dataset.varSet)));
  $$("[data-var-ignore]", box).forEach((b) => b.addEventListener("click", async () => {
    try { await busy(b, save({ ignore: [b.dataset.varIgnore] }, `${b.dataset.varIgnore} 已標為不需要`)); } catch (err) { toast(err.message, "danger"); }
  }));
  $$("[data-var-unignore]", box).forEach((b) => b.addEventListener("click", async () => {
    try { await busy(b, save({ unignore: [b.dataset.varUnignore] }, `已還原 ${b.dataset.varUnignore}`)); } catch (err) { toast(err.message, "danger"); }
  }));
  $$("[data-var-unset]", box).forEach((b) => b.addEventListener("click", async () => {
    const n = b.dataset.varUnset;
    if (!(await confirmDialog({ title: `清除 ${n}？`, body: "值會被刪除，無法復原；重新部署後生效。", confirmText: "清除變數" }))) return;
    try { await busy(b, save({ unset: [n] }, `已清除 ${n}`)); } catch (err) { toast(err.message, "danger"); }
  }));
}

// ── 紀錄：每個 commit 一列，驗證與部署並列 ──
let historyFilter = "all";
function drawHistoryTab(id, box) {
  const d = pj.data.deployment;
  const live = d?.running_commit;
  const busyNow = d?.in_progress;
  const rows = new Map();
  const row = (commit, pr) => {
    const k = `${pr ? `pr${pr}:` : ""}${commit}`;
    if (!rows.has(k)) rows.set(k, { commit, pr, runs: [], deps: [], at: 0 });
    return rows.get(k);
  };
  pj.runs.forEach((r) => { const x = row(r.commit, r.trigger === "pr" ? r.pr_number || "?" : null); x.runs.push(r); x.at = Math.max(x.at, r.created_at); });
  pj.deps.forEach((dp) => { const x = row(dp.commit, null); x.deps.push(dp); x.at = Math.max(x.at, dp.created_at); });
  let list = [...rows.values()].sort((a, b) => b.at - a.at);
  // 曾成功上線的舊版本：回到這個版本；只通過驗證的：部署這個版本
  const wasLive = (x) => x.deps.some((dp) => dp.status === "success");
  const canRollback = (x) => !x.pr && !sameCommit(x.commit, live) && wasLive(x) && (x.deps.some((dp) => dp.rollback) || x.runs.some((r) => r.status === "passed"));
  const canDeploy = (x) => !x.pr && !canRollback(x) && x.runs.some((r) => r.status === "passed") && !sameCommit(x.commit, live);
  if (historyFilter === "deployable") list = list.filter((x) => canDeploy(x) || canRollback(x));
  if (historyFilter === "pr") list = list.filter((x) => x.pr);
  const depBadge = (dp) => dp.status === "success" ? '<span class="c-badge c-badge--success">成功</span>' : dp.status === "failure" ? `<span class="c-badge c-badge--danger">失敗${dp.stage ? `（${esc(dp.stage)}）` : ""}</span>` : '<span class="c-badge c-badge--accent c-badge--pulse">進行中</span>';
  const tr = list.map((x) => {
    const r = x.runs[0], dp = x.deps[0];
    const isLive = sameCommit(x.commit, live);
    const verify = r ? `${statusPill("verify", r.status)}<div class="c-table__secondary">${esc(triggerLabel(r))} · ${relTime(r.created_at)} · <a href="#projects/${esc(id)}/verifications/${esc(r.id)}">報告</a></div>${r.status !== "queued" && r.status !== "running" ? `<div class="c-table__secondary u-nowrap">${countBadges(r.counts)}</div>` : ""}${x.runs.length > 1 ? `<div class="c-table__secondary">另有 ${x.runs.length - 1} 次：${x.runs.slice(1, 4).map((o) => `<a href="#projects/${esc(id)}/verifications/${esc(o.id)}">${esc(STATUS_TEXT[o.status] || o.status)}</a>`).join("、")}</div>` : ""}` : '<span class="u-muted">—</span>';
    const deploy = dp ? `${depBadge(dp)}${isLive && dp.status === "success" ? ' <span class="c-badge c-badge--success">線上</span>' : ""}<div class="c-table__secondary">${esc(DEPLOY_TRIGGER[dp.trigger] || dp.trigger)} · ${relTime(dp.created_at)}</div>${dp.error ? `<div class="c-table__secondary u-truncate" title="${esc(dp.error)}">${esc(dp.error)}</div>` : ""}`
      : x.pr ? '<span class="u-muted u-small">PR 不部署</span>'
      : r?.status === "passed" ? `<span class="c-badge c-badge--warning">未部署</span>${r.deploy_note ? `<div class="c-table__secondary">${esc(r.deploy_note)}</div>` : ""}`
      : r && ["queued", "running"].includes(r.status) && r.deploy_after ? '<span class="c-badge">通過後自動部署</span>' : '<span class="u-muted">—</span>';
    const action = canDeploy(x) ? `<button class="c-btn c-btn--sm c-btn--primary" data-deploy="${esc(x.commit)}" ${busyNow ? "disabled" : ""}>部署這個版本</button>`
      : canRollback(x) ? `<button class="c-btn c-btn--sm" data-rollback="${esc(x.commit)}" ${busyNow ? "disabled" : ""}>回到這個版本</button>` : "";
    return `<tr><td><span class="c-table__primary u-mono">${esc(short(x.commit))}</span>${x.pr ? ` <span class="c-badge">PR #${esc(x.pr)}</span>` : ""}</td><td>${verify}</td><td>${deploy}</td><td><div class="c-table__actions">${action}</div></td></tr>`;
  });
  box.innerHTML = `<div class="l-row"><div class="c-segmented" role="group" aria-label="篩選" id="ph-filter">${[["all", "全部"], ["deployable", "可部署"], ["pr", "PR"]].map(([k, l]) => `<button class="c-segmented__item ${historyFilter === k ? "is-active" : ""}" data-v="${k}" aria-pressed="${historyFilter === k}">${l}</button>`).join("")}</div>
      <span class="u-small u-muted">每個 commit 一列；最近 50 次驗證與 20 次部署。</span></div>
    <section class="c-card"><div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>版本</th><th>驗證</th><th>部署</th><th><span class="u-sr-only">操作</span></th></tr></thead>
      <tbody>${tr.join("") || `<tr><td colspan="4">${empty({ iconName: "inbox", title: historyFilter === "all" ? "還沒有紀錄" : "沒有符合的紀錄" })}</td></tr>`}</tbody></table></div></div></section>
    <p class="u-small u-muted">「部署這個版本」只對通過驗證的 commit 顯示，以當時驗證的設定部署；「回到這個版本」以當時上線的設定重新部署，volume 資料與環境變數不會回退。</p>`;
  $("#ph-filter").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (!b) return; historyFilter = b.dataset.v; drawHistoryTab(id, box); });
  $$("[data-deploy]", box).forEach((b) => b.addEventListener("click", () => deployCommit(id, b, b.dataset.deploy, false)));
  $$("[data-rollback]", box).forEach((b) => b.addEventListener("click", () => deployCommit(id, b, b.dataset.rollback, true)));
}
const STATUS_TEXT = { queued: "排隊中", running: "驗證中", passed: "通過", failed: "未通過", canceled: "已取消", error: "錯誤" };

/** 驗證報告頁（FR-RPT-01～03） */
async function renderReport(pid, vid) {
  clearTimeout(verifyTimer);
  $("#page").innerHTML = `<span class="c-skeleton"></span><span class="c-skeleton"></span>`;
  let d, project;
  try { [d, project] = await Promise.all([api(`/api/verifications/${encodeURIComponent(vid)}`), api(`/api/projects/${encodeURIComponent(pid)}`)]); }
  catch (err) { return ($("#page").innerHTML = pageHeader("驗證報告", "") + `<p class="c-msg c-msg--danger" role="alert">${esc(err.message)}</p><p><a href="#projects/${esc(pid)}">回到專案</a></p>`); }
  if (pageSub() !== vid) return;
  const v = d.verification, p = project.project;
  document.title = `驗證報告 · ${p.name} · Caloud`;
  const base = `/api/verifications/${encodeURIComponent(vid)}/report`;
  $("#page").innerHTML = pageHeader(`驗證報告：${p.name}`, `${v.commit.slice(0, 7)}（${v.branch}）· ${triggerLabel(v)} · ${new Date(v.created_at * 1000).toLocaleString("zh-TW", { hour12: false })}`,
    `<a class="c-btn" href="#projects/${esc(pid)}">回到專案</a><a class="c-btn" href="${base}?format=md" download>${icon("upload")}<span>匯出 Markdown</span></a><a class="c-btn" href="${base}?format=json" download>${icon("upload")}<span>匯出 JSON</span></a>`) +
    `<section class="c-card"><div class="c-card__header"><h2 class="c-card__title">摘要</h2>${statusPill("verify", v.status)}</div><div class="c-card__body l-stack">
       ${stageBadges(v.stages)}<div class="l-row">${countBadges(v.counts)}</div>
       ${v.error ? `<p class="u-small">${esc(v.error)}</p>` : ""}
       <p class="u-small u-muted">${d.previous ? `與同分支前次驗證比較：新增 ${d.issues.filter((i) => i.change === "new").length}、仍存在 ${d.issues.filter((i) => i.change === "existing").length}、已修正 ${d.fixed.length}。` : "這是這個分支第一次完成的驗證。"}</p></div></section>
     <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">問題</h2>
       <div class="c-segmented" role="group" aria-label="變化篩選" id="rp-filter">${[["all", "全部"], ["new", "新增"], ["existing", "仍存在"], ["fixed", "已修正"]].map(([k, l], i) => `<button class="c-segmented__item ${i ? "" : "is-active"}" data-v="${k}" aria-pressed="${!i}">${l}</button>`).join("")}</div></div>
       <div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
       <thead><tr><th>等級</th><th>階段</th><th>問題</th><th>位置</th></tr></thead><tbody id="rp-issues"></tbody></table></div></div></section>
     <section class="c-card"><div class="c-card__header"><h2 class="c-card__title">Log</h2><span class="u-small u-muted">最近 500 行</span></div>
       <div class="c-card__body">${d.logs.length ? `<pre class="c-log" aria-label="驗證 log">${esc(d.logs.map((l) => `[${l.stage}] ${l.line}`).join("\n"))}</pre>` : '<p class="u-muted u-small">沒有 log。</p>'}</div></section>`;
  const draw = (f) => {
    const rows = f === "fixed" ? d.fixed.map((i) => ({ ...i, change: "fixed" })) : d.issues.filter((i) => f === "all" || i.change === f);
    $("#rp-issues").innerHTML = rows.map((i) => `<tr>
        <td>${statusPill("severity", i.severity)}${i.change === "new" && d.previous ? ' <span class="c-badge c-badge--accent">新增</span>' : i.change === "fixed" ? ' <span class="c-badge c-badge--success">已修正</span>' : ""}</td>
        <td class="u-small">${esc(VERIFY_STAGES.find(([k]) => k === i.stage)?.[1] || i.stage)}</td>
        <td><div class="c-table__primary">${esc(i.title)}</div>${i.detail ? `<div class="c-table__secondary">${esc(i.detail)}</div>` : ""}<div class="c-table__secondary u-mono">${esc(i.rule)}</div></td>
        <td>${i.file ? evidenceLink(p, v.commit, { file: i.file, line: i.line }) : '<span class="u-muted">—</span>'}</td></tr>`).join("")
      || `<tr><td colspan="4">${empty({ iconName: "check", title: f === "fixed" ? "沒有已修正的問題" : "沒有問題", body: "" })}</td></tr>`;
  };
  $("#rp-filter").addEventListener("click", (e) => {

    draw(b.dataset.v);
  });
  draw("all");
  if (["queued", "running"].includes(v.status)) verifyTimer = setTimeout(() => pageSub() === vid && renderReport(pid, vid), 3000);
}

// ─────────────── 網域 FR-DOM-* / FR-UI-06 / FR-UI-07 ───────────────
function routeState(d) {
  if (!d.verified || !d.app_id) return "none";
  return state.apps.find((a) => a.id === d.app_id)?.status === "running" ? "live" : "idle";
}
async function renderDomains() {
  $("#page").innerHTML = pageHeader("網域", "托管網域並轉發到 App。新增後依步驟設定 DNS、驗證擁有權，再綁定 App。",
    `<button class="c-btn c-btn--primary" id="new-dom">${icon("plus")}<span>新增網域</span></button>`) +
    `<section class="c-card"><div class="c-card__header"><label class="c-search">${icon("search")}<span class="u-sr-only">搜尋網域</span><input class="c-input" id="dom-q" placeholder="搜尋網域" value="${esc(state.domainQuery)}"></label></div>
    <div class="c-card__body c-card__body--flush"><div class="c-table-wrap"><table class="c-table">
      <thead><tr><th>網域</th><th>驗證</th><th>轉發</th><th>TLS</th></tr></thead><tbody id="domains">${skeletonRows(4)}</tbody></table></div></div></section>

function drawDomains() {

document.addEventListener("click", (e) => {

/** 網域設定精靈：1 輸入 → 2 DNS → 3 驗證 → 4 綁定（FR-UI-07） */
function openDomain(hostname) {
  let d = hostname ? state.domains.find((x) => x.hostname === hostname) : null;
  const dr = drawer({ title: hostname || "新增網域", subtitle: "依序完成以下步驟，網域就會開始轉發。", onClose: () => currentPage() === "domains" && renderDomains() });
  const stepClass = (n) => {
    const step = !d ? 1 : !d.verified ? 2 : 4;
    if (n < step || (n === 4 && d?.app_id)) return "is-done";
    if (n === step || (step === 2 && n === 3)) return "is-current";
    return "";
  };
  const index = (n) => `<span class="c-stepper__index">${stepClass(n) === "is-done" ? icon("check") : n}</span>`;
  const draw = () => {
    const appOpts = `<option value="">（不轉發）</option>` + state.apps.map((a) => `<option value="${esc(a.id)}" ${a.id === d?.app_id ? "selected" : ""}>${esc(a.name)}</option>`).join("");
    dr.body.innerHTML = `<ol class="c-stepper">

          <div class="c-field"><span class="c-label">TXT 紀錄 · 名稱</span>${copyField("_caloud-challenge." + d.hostname, "紀錄名稱")}</div>

          <label class="c-field ${d.tls_mode === "passthrough" ? "" : "u-hidden"}" id="dm-tls-field"><span class="c-field__label">App 的 TLS port</span><input class="c-input" id="dm-tls" inputmode="numeric" placeholder="443" value="${esc(d.tls_port ?? "")}"><span class="c-field__hint">HTTP port 仍會轉發，供 App 申請憑證（HTTP-01）。</span></label>
          <span class="c-field__error" id="dm-berr" role="alert"></span><div><button class="c-btn c-btn--primary" id="dm-bind">${icon("link")}<span>套用</span></button></div>` : ""}</div></li></ol>`;

  };
  const wire = () => {
    const host = $("#dm-host", dr.el);
    if (host) {
      host.focus();
      host.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#dm-create", dr.el).click(); });

        const btn = e.currentTarget;
        host.removeAttribute("aria-invalid"); showMsg($("#dm-err", dr.el), null);

      catch (err) { showMsg($("#dm-verr", dr.el), err); }
    });
    const appSel = $("#dm-app", dr.el);
    if (appSel) {
      const fillSvc = async () => {
        const svc = $("#dm-svc", dr.el);
        if (!appSel.value) { svc.innerHTML = ""; svc.disabled = true; return; }
        svc.disabled = false; svc.innerHTML = "<option>載入中…</option>";
        try { const det = await api(`/api/apps/${appSel.value}`); svc.innerHTML = det.services.map((s) => `<option ${s === d.service ? "selected" : ""}>${esc(s)}</option>`).join(""); }
        catch (err) { svc.innerHTML = ""; showMsg($("#dm-berr", dr.el), err); }
      };
      appSel.addEventListener("change", fillSvc);
      $("#dm-pass", dr.el).addEventListener("change", (e) => $("#dm-tls-field", dr.el).classList.toggle("u-hidden", !e.target.checked));
      fillSvc();
      $("#dm-bind", dr.el).addEventListener("click", async (e) => {
        const btn = e.currentTarget, app_id = appSel.value || null;
        showMsg($("#dm-berr", dr.el), null);
        try {
          d = await busy(btn, api(`/api/domains/${encodeURIComponent(d.hostname)}/bind`, { method: "PUT", body: { app_id, service: app_id ? $("#dm-svc", dr.el).value : null, port: app_id ? Number($("#dm-port", dr.el).value) || null : null, tls_mode: $("#dm-pass", dr.el).checked ? "passthrough" : "none", tls_port: Number($("#dm-tls", dr.el).value) || null } }));
          toast(app_id ? `${d.hostname} 已轉發到 ${appName(app_id)}` : `${d.hostname} 已解除綁定`);
          draw();
        } catch (err) { showMsg($("#dm-berr", dr.el), err); }
      });
    }
    $("#dm-del", dr.el)?.addEventListener("click", async () => {
      if (!(await confirmDialog({ title: `刪除 ${d.hostname}？`, body: "此網域會立即停止轉發流量。", confirmText: "刪除網域" }))) return;
      try { await api(`/api/domains/${encodeURIComponent(d.hostname)}`, { method: "DELETE" }); toast(`已刪除 ${d.hostname}`); dr.close(); }
      catch (err) { toast(err.message, "danger"); }
    });
  };
  draw();
}
