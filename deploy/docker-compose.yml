# Caloud 本體部署：docker compose -f deploy/docker-compose.yml up -d
services:
  caloud:
    build:
      context: ..
      # 建置識別（ADR 0023）：CALOUD_COMMIT=$(git rev-parse --short HEAD) docker compose … up -d --build
      args:
        CALOUD_COMMIT: ${CALOUD_COMMIT:-dev}
        CALOUD_BUILT_AT: ${CALOUD_BUILT_AT:-dev}
    image: caloud:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"                # SNI 直通（ADR 0009）或 Caloud 終結 TLS（ADR 0016）
      - "127.0.0.1:8080:8080"   # 管理介面（SSH 通道備用）；對外經 :443 以 CALOUD_PUBLIC_ORIGIN 的網域提供
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caloud-data:/data
    # 轉發到 network_mode: host 的 service（FR-DOM-10）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edge

volumes:
  caloud-data:

networks:
  edge:
    name: caloud-edge
